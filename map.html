<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#faf4e8}
a{color:inherit;text-decoration:none}
button{transition:transform .15s ease;font-family:inherit}
button:hover{transform:translateY(-3px)}
button:active{transform:scale(.97)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,94,74,.35)}50%{box-shadow:0 0 0 14px rgba(47,94,74,0)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.pop{animation:pop .5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1000px){
  .page{width:100%!important;height:auto!important;min-height:100vh}
  .track{overflow-x:auto}
  .detail-row{flex-direction:column!important}
  .hdr{padding:12px 16px!important;height:auto!important;flex-wrap:wrap;gap:10px}
  .body{padding:16px!important}
  .path{padding:20px 16px!important}
}
</style>
</head>
<body>

<div class="page" style="width:1280px;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#faf4e8;color:#1f3d31;font-family:'Noto Sans SC','Fredoka',system-ui,sans-serif">

  <header class="hdr" style="box-sizing:border-box;height:88px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fffdf8;border-bottom:1.5px solid #eadfcb">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:46px;height:46px;border-radius:15px;background:#2f5e4a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px">A</div>
      <div>
        <div style="font-size:22px;font-weight:800">Your quest map 你的冒险地图</div>
        <div id="sub" style="font-size:14px;color:#6d6a5c">Year 3 · 华文 Chinese</div>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="background:#e8f1ea;color:#2f5e4a;border-radius:999px;padding:12px 18px;font-size:18px;font-weight:800">Streak 连胜 2</div>
      <a href="home.html" style="background:#fffdf8;border:1.5px solid #eadfcb;border-radius:999px;padding:12px 18px;font-size:18px;font-weight:800;color:#1f3d31">Home 首页</a>
    </div>
  </header>

  <div class="body" style="flex:1;min-height:0;box-sizing:border-box;padding:32px;display:flex;flex-direction:column;gap:28px">

    <section class="path" style="background:#fffdf8;border:1.5px solid #eadfcb;border-radius:30px;padding:36px 40px">
      <div style="font-size:18px;font-weight:700;color:#6d6a5c;margin-bottom:24px">Tap a level to see it. 点一关看看。</div>
      <div class="track" id="track" style="position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding-top:8px">
        <div style="position:absolute;left:60px;right:60px;top:52px;height:10px;border-radius:999px;background:#eadfcb"></div>
        <div id="fill" style="position:absolute;left:60px;top:52px;height:10px;border-radius:999px;background:#6fb08c"></div>
      </div>
    </section>

    <div class="detail-row" style="display:flex;gap:28px;flex:1;min-height:0">
      <section id="detail" class="pop" style="flex:1;min-width:0;background:#2f5e4a;color:#fff;border-radius:30px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:20px"></section>
    </div>
  </div>
</div>

<script src="lesson.js"></script>
<script>
(function(){
  var SESS_KEY = "asc_student";
  var sess = null;
  try { sess = JSON.parse(sessionStorage.getItem(SESS_KEY) || "null"); } catch(e) { sess = null; }
  if (!sess) { location.replace("index.html"); return; }
  var year = sess.year || 3;
  var name = sess.name || "";
  var q = name ? "?s=" + encodeURIComponent(name) : "";

  document.getElementById("sub").textContent = "Year " + year + " · 华文 Chinese";

  // Unit 4 opens the student's next unfinished exercise for their year.
  var nextEx = (name && window.LessonFlow) ? LessonFlow.nextFor(name, year) : null;
  var unit4Href = nextEx ? nextEx + (nextEx.indexOf("?") > -1 ? "&" : "?") + "s=" + encodeURIComponent(name) : "year3-chinesefill-3A.html" + q;

  var UNITS = [
    { n: 1, title: "Unit 1 · 上学的路", stars: 3, status: "done" },
    { n: 2, title: "Unit 2 · 第二单元", stars: 3, status: "done" },
    { n: 3, title: "Unit 3 · 第三单元", stars: 2, status: "done" },
    { n: 4, title: "Unit 4 · 词句填充", stars: 0, status: "current", href: unit4Href },
    { n: 5, title: "Unit 5 · 第五单元", stars: 0, status: "locked" },
    { n: 6, title: "Unit 6 · 第六单元", stars: 0, status: "locked" }
  ];
  var selected = 4;

  var track = document.getElementById("track");
  var nodes = [];
  UNITS.forEach(function(u){
    var done = u.status === "done", current = u.status === "current";
    var edge = done ? "#2f7a4a" : current ? "#2f5e4a" : "#d8cdb8";
    var bg = done ? "#e8f5ec" : current ? "#2f5e4a" : "#f5f0e6";
    var ink = current ? "#fff" : u.status === "locked" ? "#9c9582" : "#2f7a4a";
    var mark = done ? "✓" : current ? "▶" : "×";
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Unit " + u.n + ", " + u.status);
    b.style.cssText = "position:relative;z-index:1;width:120px;display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent;border:none;padding:0;color:#1f3d31;cursor:pointer";
    b.innerHTML =
      '<span class="' + (current ? "pulse" : "") + '" style="width:92px;height:92px;border-radius:50%;background:' + bg +
      ';border:4px solid ' + edge + ';color:' + ink + ';display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;box-shadow:0 6px 0 #efe4cf">' + mark + '</span>' +
      '<span style="font-size:17px;font-weight:800">Unit ' + u.n + '</span>' +
      '<span style="font-size:16px;letter-spacing:2px;color:#b8842a">' + "★".repeat(u.stars) + "☆".repeat(3 - u.stars) + '</span>';
    b.addEventListener("click", function(){ selected = u.n; render(); });
    track.appendChild(b);
    nodes.push(b);
  });

  // Fill the track up to the last completed unit.
  var doneCount = UNITS.filter(function(u){ return u.status === "done"; }).length;
  var fillPct = Math.round(doneCount / (UNITS.length - 1) * 100);
  document.getElementById("fill").style.width = "calc(" + fillPct + "% - 0px)";

  function render(){
    nodes.forEach(function(b, i){
      b.firstChild.style.outline = (i + 1 === selected) ? "4px solid #ecd58a" : "none";
    });
    var u = UNITS[selected - 1];
    var playable = u.status !== "locked";
    var text = u.status === "done" ? "Completed 已完成" : u.status === "current" ? "Your next level 你的下一关" : "Locked 未解锁";
    var stars = "★".repeat(u.stars) + "☆".repeat(3 - u.stars);
    var action = (playable && u.href)
      ? '<a href="' + u.href + '" style="display:flex;align-items:center;justify-content:center;min-height:68px;border-radius:999px;background:#fff6df;color:#2f5e4a;font-size:24px;font-weight:800">Play 开始 ▶</a>'
      : '<div style="display:flex;align-items:center;justify-content:center;min-height:68px;border-radius:999px;background:rgba(255,255,255,.18);font-size:18px;font-weight:700">' +
        (playable ? "Coming soon 即将推出" : "Finish the level before this one 先完成上一关") + '</div>';
    var det = document.getElementById("detail");
    det.innerHTML =
      '<div><div style="font-size:15px;font-weight:700;opacity:.9">Selected level 已选关卡</div>' +
      '<div id="dTitle" style="font-size:34px;font-weight:800;margin-top:6px"></div>' +
      '<div style="font-size:18px;margin-top:8px;opacity:.95">' + text + '</div>' +
      '<div style="font-size:24px;letter-spacing:4px;margin-top:14px;color:#ecd58a">' + stars + '</div></div>' + action;
    document.getElementById("dTitle").textContent = u.title;
  }
  render();
})();
</script>
</body>
</html>
