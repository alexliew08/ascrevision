<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfterSkoolClub Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root{--navy:#263A5A;--orange:#F7913F;--orange-d:#C95F0E;--cream:#FFF8EE;--mute:#5A6680;--off:#6B7488;--offline:#A7B0C2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Fredoka,"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--cream);color:var(--navy);display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
  .screen{display:none;width:100%;max-width:420px}
  .screen.active{display:block}
  .banner{background:#FFF3B0;border:2px dashed #B98A00;border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-align:center;color:#5C4300;margin-bottom:14px}
  .brand{text-align:center;margin:0 0 18px}
  .brand img{width:200px;max-width:60%;height:auto;display:block;margin:0 auto}
  .brand small{display:block;font-size:16px;font-weight:600;color:var(--mute);margin-top:2px}
  .card{background:#fff;border:3px solid var(--navy);border-radius:20px;padding:20px 20px 24px;box-shadow:0 6px 0 var(--navy)}
  label{display:block;font-weight:700;font-size:16px;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,select{width:100%;height:50px;padding:0 14px;font:inherit;font-size:17px;border:3px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy)}
  input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px #FFD9B8}
  .btn{width:100%;margin-top:22px;height:58px;font:inherit;font-size:20px;font-weight:700;color:#fff;background:var(--orange);border:3px solid var(--navy);border-radius:16px;box-shadow:0 5px 0 var(--navy);cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
  .err{color:#C62828;font-weight:700;text-align:center;min-height:20px;margin-top:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .topbar img{width:78px;height:auto}
  .logout{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px;font:inherit;font-size:16px;font-weight:700;color:var(--navy);background:#fff;border:3px solid var(--navy);border-radius:999px;box-shadow:0 4px 0 var(--navy);cursor:pointer;white-space:nowrap}
  .logout:hover{background:#FFE3CC}
  .logout:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
  .hello{font-size:22px;font-weight:700}
  .hello span{color:var(--orange-d)}
  .yr{color:var(--mute);font-weight:600;margin:2px 0 16px}
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  a.tile,div.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:112px;border:3px solid var(--navy);border-radius:16px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;font-size:18px;text-align:center;box-shadow:0 4px 0 var(--navy);padding:6px}
  a.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
  .tile .ic{font-size:30px;line-height:1;font-weight:700;display:flex;align-items:center;justify-content:center;height:32px}
  .tile.math{background:#FFE3CC}
  .tile.cn{background:#FFF3B0}
  .tile.cn .ic{font-weight:900}
  .tile small{font-size:12px;font-weight:600;color:var(--off);display:none}
  a.tile.off,div.tile.off{background:#fff;border:3px dashed var(--offline);box-shadow:none;color:var(--off);font-size:17px;cursor:not-allowed}
  .tile.off .ic{font-size:26px}
  .tile.off small{display:block}
  .yrow{margin-top:16px}.yrow:first-child{margin-top:0}
  .ylabel{font-weight:700;font-size:17px;margin-bottom:8px}
  .yrow a.tile,.yrow div.tile{height:64px;flex-direction:row;gap:8px;font-size:16px}
  .yrow .tile .ic{font-size:20px;height:auto}
  .yrow .tile.off small{display:none}
  .yrow .tiles:has(> :nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr))}
  .yrow .tiles:has(> :nth-child(3)) .tile{font-size:15px;gap:6px;white-space:nowrap;padding:4px}
  .yrow .tiles:has(> :nth-child(3)) .tile.math .ic{display:none}
  [hidden]{display:none!important}
  .tiles.one{grid-template-columns:1fr}
  a.tile.wide,div.tile.wide{height:120px;font-size:22px}
  a.tile.wide .ic{height:38px}
  .tile .sub{font-size:13px;font-weight:600;color:var(--mute)}
  .tile.cn2{background:#DDF0FF}
  .tile.en{background:#E3F7E8}
  .tile.en2{background:#EDE7FF}
  .yrow .tiles:has(> :nth-child(3)) .tile .ic{display:none}
</style>
</head>

    <button class="logout" id="logoutBtn3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-3"/><path d="M9 12h12l-3-3m0 6 3-3"/></svg>登出 Log out</button>
  </div>
  <div class="card">
    <div class="hello" id="subTitle"></div>
    <div class="yr" id="subTag"></div>
    <div class="tiles one" id="subTiles"></div>
  </div>
</div>

<script>
  const hs=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return String(4294967296*(2097151&h2)+(h1>>>0))};
  const norm=s=>s.replace(/[\s\u3000]+/g,"").toLowerCase();
  // Student accounts by year. Only Alex is listed for now.
  const ROST = {"1": [{"n": "Alex", "i": "Alex", "h": "7624984167397427"}], "2": [{"n": "Alex", "i": "Alex", "h": "7624984167397427"}], "3": [{"n": "Alex", "i": "Alex", "h": "7624984167397427"}], "4": [{"n": "Alex", "i": "Alex", "h": "7624984167397427"}], "5": [{"n": "Alex", "i": "Alex", "h": "7624984167397427"}], "6": [{"n": "Alex", "i": "Alex", "h": "7624984167397427"}]};
  const MATHS = {1:"year1-maths.html",2:"year2-maths.html",3:"year3-maths.html",4:"year4-maths.html",5:"year5-maths.html",6:"year6-maths.html"};
  const SESS_KEY = "asc_student";

  const $ = id => document.getElementById(id);
  function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }

  function getSess(){ try{ return JSON.parse(sessionStorage.getItem(SESS_KEY) || "null"); }catch(e){ return null; } }
  function setSess(v){ try{ v ? sessionStorage.setItem(SESS_KEY, JSON.stringify(v)) : sessionStorage.removeItem(SESS_KEY); }catch(e){} }

  function showMenu(sess){
    $('who').textContent = sess.name;
    $('yrTag').textContent = "Year " + sess.year + " · " + "一二三四五六"[sess.year-1] + "年级";
    $('mathBtn').href = MATHS[sess.year] + "?s=" + encodeURIComponent(sess.name);
    [['cnBtn','cn'],['enBtn','en']].forEach(([id,key]) => {
      const b = $(id);
      if(sess.year === 3){ b.classList.remove('off'); b.href = "#"; b.dataset.sub = key; b.dataset.name = sess.name; }
      else { b.classList.add('off'); b.removeAttribute('href'); delete b.dataset.sub; }
    });
    const cnb = $('cnBtn');
    if(sess.year === 1){ cnb.classList.remove('off'); cnb.href = "#"; cnb.dataset.sub = "cn1"; cnb.dataset.name = sess.name; }
    const enb = $('enBtn');
    if(sess.year === 1){ enb.classList.remove('off'); enb.href = "year1-english.html?s=" + encodeURIComponent(sess.name); delete enb.dataset.sub; }
    const bm = $('bmBtn');
    if(sess.year === 3){ bm.classList.remove('off'); bm.href = "#"; bm.dataset.sub = "bm"; bm.dataset.name = sess.name; }
    else { bm.classList.add('off'); bm.removeAttribute('href'); }
    show('menu');
  }

  function showTestMenu(){
    let html = "";
    for(let y = 1; y <= 6; y++){
      const cn = y === 1
        ? `<a class="tile cn" href="#" data-sub="cn1" data-name="Alex"><span class="ic">文</span>华文 Chinese</a><a class="tile en" href="year1-english.html?s=Alex"><span class="ic">Aa</span>English</a>`
        : y === 3
        ? `<a class="tile cn" href="#" data-sub="cn" data-name="Alex"><span class="ic">文</span>华文 Chinese</a><a class="tile en" href="#" data-sub="en" data-name="Alex"><span class="ic">Aa</span>English</a>`
        : `<div class="tile off"><span class="ic">文</span>华文 Chinese<small>Coming soon</small></div><div class="tile off"><span class="ic">Aa</span>English<small>Coming soon</small></div>`;
      const bmT = y === 3
        ? `<a class="tile bm" href="#" data-sub="bm" data-name="Alex"><span class="ic">BM</span>Bahasa Melayu</a>`
        : `<div class="tile off"><span class="ic">BM</span>Bahasa Melayu<small>Coming soon</small></div>`;
      html += `<div class="yrow"><div class="ylabel">Year ${y}</div><div class="tiles">
        <a class="tile math" href="${MATHS[y]}?s=Alex"><span class="ic">+ −</span>数学 Maths</a>${cn}${bmT}</div></div>`;
    }
    $('yearList').innerHTML = html;
    show('testMenu');
  }

  $('loginBtn').addEventListener('click', () => {
    const idRaw = $('uid').value;
    const pw = $('pw').value.replace(/\s+/g, "");
    const year = +$('year').value;
    if(!idRaw.trim() && !pw){ setSess({test:true}); showTestMenu(); return; }
    if(!idRaw.trim() || !pw){ $('loginError').textContent = "请输入 ID 和密码 Please enter ID and password."; return; }
    const id = norm(idRaw);
    const acc = (ROST[year] || []).find(x => norm(x.i) === id && x.h === hs(id + "|" + pw));
    if(!acc){ $('loginError').textContent = "ID 或密码不对 Incorrect ID or password."; return; }
    $('loginError').textContent = "";
    const sess = { name: acc.n, year: year };
    setSess(sess);
    showMenu(sess);
  });

  ['logoutBtn','logoutBtn2','logoutBtn3'].forEach(id => $(id).addEventListener('click', () => {
    setSess(null);
    $('uid').value = ""; $('pw').value = ""; $('loginError').textContent = "";
    show('login');
  }));

  // Year 3 subject pages. Change the file names here if yours are different.
  const SUB = {
    cn1: { title: "华文 Chinese", tag: "Tahun 1 · Pilih buku", items: [
      { t: "华文 1A", s: "课堂评估 · Buku 1A", f: "year1-chinese.html", c: "cn1a", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>' },
      { t: "华文 1B", s: "课堂评估 · Buku 1B", f: "year1-chinese-2.html", c: "cn1b", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>' } ] },
    cn: { title: "文 华文 Chinese", tag: "三年级 · 选一个练习 Choose one", items: [
      { t: "看图学华文", s: "Picture practice", f: "year3-chinese.html", c: "cn", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>' },
      { t: "课堂评估", s: "Classroom assessment", f: "year3-chinese-2.html", c: "cn2", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3"/><path d="m9 13 2 2 4-4"/></svg>' } ] },
    bm: { title: "Bahasa Melayu", tag: "Tahun 3 · Pilih latihan", items: [
      { t: "国语书写填充", s: "Tulis ayat (Latihan 1)", f: "year3-bm.html", c: "bm", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>' },
      { t: "Latihan 2", s: "Akan datang · Coming soon", f: "", c: "bm2", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3"/></svg>' } ] },
    en: { title: "Aa English", tag: "Year 3 · Choose one 选一个练习", items: [
      { t: "English Learning", s: "Praktis Prima KSSR · Year 3", f: "year3-english.html", c: "en", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>' },
      { t: "English Writing Practice", s: "Year 1–3 writing", f: "year3-english-writing.html", c: "en2", i: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>' } ] }
  };
  let subFrom = 'menu';
  function showSub(key, name, from){
    const S = SUB[key]; subFrom = from;
    const q = "?s=" + encodeURIComponent(name);
    $('subTitle').textContent = S.title; $('subTag').textContent = S.tag;
    $('subTiles').innerHTML = S.items.map(x => x.f
      ? `<a class="tile ${x.c} wide" href="${x.f + q}"><span class="ic">${x.i}</span>${x.t}<span class="sub">${x.s}</span></a>`
      : `<div class="tile off wide"><span class="ic">${x.i}</span>${x.t}<small>Coming soon</small></div>`).join('');
    show('subMenu');
  }
  $('subBack').addEventListener('click', () => show(subFrom));

  document.addEventListener('click', e => {
    const t = e.target.closest('.tile.off');
    if(t){ e.preventDefault(); return; }
    const c = e.target.closest('[data-sub]');
    if(c){ e.preventDefault(); showSub(c.dataset.sub, c.dataset.name, c.closest('.screen').id); }
  });

  const existing = getSess();
  if(existing && existing.test) showTestMenu();
  else if(existing && ROST[existing.year]) showMenu(existing);
  else show('login');
</script>
</body>
</html>
