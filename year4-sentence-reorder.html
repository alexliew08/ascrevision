{"no":8,"items":[{"n":0,"text":"“全马华小演讲比赛冠军是——程少商！”台下顿时 ＿＿＿＿＿＿,我走上台，双手捧着奖杯的那一刻，＿＿＿＿＿＿ 。 但 谁 都 没 想 到 ， 两 年 前 的 我 仅 是 个＿＿＿＿＿＿的孩子。"},{"n":0,"text":"我第一次登台是在二年级的时候，老师派我代表班级参加讲故事比赛。我虽没有登台的经验，但老师认为我的记忆力很好，发音也十分标准，于是便让我试一试。在比赛当天，我把讲稿 ＿＿＿＿＿＿ ， 可 在 成 绩 公 布 的 那 一 刻 ， 我 却 落 选 了 ， 连 个 安 慰 奖 也＿＿＿＿＿＿ 。 这 时 ， 我 才 深 深 地 意 识 到 ， 想 要 获 胜 ， 就 必 须＿＿＿＿＿＿。"},{"n":0,"text":"当时我决定要把演讲学好，＿＿＿＿＿＿。我的启蒙老师是我的班级主任——刘爱玲老师。刘老师完全颠覆了我对演讲的观念。她告诉我，演讲最重要的是自然，＿＿＿＿＿＿,只要咬字清晰，一样能够得分。接下来的日子，我 ＿＿＿＿＿＿，以锻炼自己，累积更多的经验。"},{"n":0,"text":"刘老师还教我台风，如何用眼神与台下的观众交流。我先在校园比赛中 ＿＿＿＿＿＿，后来我有幸获得了参加全国演讲比赛的机会。刘老师这才将演讲的 ＿＿＿＿＿＿。原来讲稿是演讲比赛中致胜的关键。讲稿必须要有 ＿＿＿＿＿＿，才能让观众为之动容。刘老师还用放学后的时间陪我一起写演讲稿。"},{"n":0,"text":"终于，我 ＿＿＿＿＿＿，在比赛中夺冠了！这些日子里，我学会了自信，学会了演讲的技巧，更学会了比赛不能只在意结果，应享受过程。我发现只要我肯努力，我也能掌握一门本领，＿＿＿＿＿＿。"}],"instr":"把词语拖到空格里，完成作文填充。","ans":["掌声如雷","心中激动得就快要流出泪来","胆怯羞涩","一字不漏地念了出来","沾不上边","学好一门本领","一雪前耻","不要一味地模仿","积极争取所有参加比赛的机会","崭露头角","必杀绝技传授给我","真情实感","不负众望","实现自己的理想"],"bank":["必杀绝技传授给我","心中激动得就快要流出泪来","学好一门本领","真情实感","掌声如雷","不要一味地模仿","沾不上边","实现自己的理想","积极争取所有参加比赛的机会","崭露头角","不负众望","一字不漏地念了出来","一雪前耻","胆怯羞涩"],"lesson":"（八）作文填充：我学会了……","tab":"fillcomp","top":true,"sec":""},

{"no":15,"items":[{"n":0,"text":"新冠肺炎疫情的关系，我国政府（＿＿＿＿＿＿）了行动管制令，全国人民都不能（＿＿＿＿＿＿）出门。向来（＿＿＿＿＿＿）的我，因成天呆在家里不能出外活而觉得非常无聊。妈妈见我（＿＿＿＿＿＿），于是（＿＿＿＿＿＿）教我玩她儿时常玩的传统游戏——跳绳。"},{"n":0,"text":"首先，妈妈拿出一袋（＿＿＿＿＿＿），教我用这些橡皮筋制作跳绳需用的绳子。只见妈妈的一双巧手将一条条的橡皮筋互相（＿＿＿＿＿＿）起来，不一会儿功夫，一条长长的绳子就完成了。从未玩过跳绳的我，被妈妈手中的这条绳子（＿＿＿＿＿＿）了好奇心。"},{"n":0,"text":"我从妈妈手中接过橡皮筋，开始学着妈妈教的（＿＿＿＿＿＿）串出一条绳子。编好后，妈妈便向我示范跳绳的方法与技巧。妈妈先是将手分别握着绳子的（＿＿＿＿＿＿），接着两只手在身旁像是画圈圈一样，绳子就绕过她的头顶了。随着妈妈的跳动，绳子就这样一圈一圈地从脚下绕到头上，再从头上绕下。她就这么一直跳呀跳，绳子也不停地绕啊绕的，有趣极了！"},{"n":0,"text":"接着，妈妈让我拿起手中的绳子试一试跳绳。怎知我的手一挥，绳子就碰到我的后脑了。妈妈见我还未（＿＿＿＿＿＿）跳绳的技巧，于是握着我的手，再一次教我跳绳的正确方法。我试了几次后，绳子终于成功绕过了我的头顶。妈妈（＿＿＿＿＿＿）我，跳绳时需注意自己的双脚，千万别被绳子（＿＿＿＿＿＿）。"},{"n":0,"text":"我听了妈妈的指点后又反复试了几次，渐渐地我也顺利地跳了好几圈。妈妈见我学得如此的快，不禁（＿＿＿＿＿＿）拇指称赞我。妈妈还向我提议，跳绳可以随着音乐的（＿＿＿＿＿＿）一起跳，这不仅可以锻炼身体，还能（＿＿＿＿＿＿）我们的律动感。"},{"n":0,"text":"我觉得跳绳真有趣，这一条细细的绳子，却能够为我们带来（＿＿＿＿＿＿）好处。我决定在管制令结束后，约上（＿＿＿＿＿＿）一起跳绳去！"}],"instr":"把词语拖到空格里，完成作文填充。","ans":["实行","随意","活泼好动","无所事事","提议","橡皮筋","串连","激起","步骤","两端","掌握","提醒","绊倒","竖起","律动","训练","诸多","三五好友"],"bank":["无所事事","激起","诸多","提醒","步骤","提议","掌握","绊倒","串连","训练","竖起","橡皮筋","实行","三五好友","随意","活泼好动","两端","律动"],"lesson":"（十五）作文填充：学跳绳记","tab":"fillcomp","top":true,"sec":""},

{"no":20,"items":[{"n":0,"text":"人类为了给生活带来更大的（＿＿＿＿＿＿），发明了各式各类的工具与物品。这些发明无疑为我们的生活带来了许多好处，但是有些物品却因人类错误的使用，而造成（＿＿＿＿＿＿）的后果。我认为，世界上最不该发明的东西就是火药。"},{"n":0,"text":"根据记载，火药的发明起（＿＿＿＿＿＿）七世纪的中国。火药最初的使用目的并非用于军事与战场上，而是单纯用于民间表演。后来人类为了攻城守城，开始滥用火药来消灭敌人，因此改变了人类的战争史。随着时代的改变，人类的智慧越来越进步，火药的发展也被不断地（＿＿＿＿＿＿），导致战火纷飞，无辜的人们也因此丧命。"},{"n":0,"text":"那一发发无情的导弹，一颗颗轰炸的炮弹，究竟（＿＿＿＿＿＿）了多少家庭的幸福？若是火药不曾被发明，那么统治者们就不会为了（＿＿＿＿＿＿）而滥用火药，展开战争。枪林弹雨的时代，生灵涂炭，人民的生活（＿＿＿＿＿＿），可谓是叫天不应，叫地不灵。"},{"n":0,"text":"如今，火药除了用作军事用途，也用来帮助国家发展与（＿＿＿＿＿＿）。国家修建道路时，火药能够用来开山劈石。然而一些商人为了（＿＿＿＿＿＿）暴利，不惜使用火药开山采矿。这些举动严重影响了大自然的（＿＿＿＿＿＿），导致地球上的资源日渐匮乏。要是世界上没有火药，大自然就不会因此受到破坏，动物们也不会（＿＿＿＿＿＿）。"},{"n":0,"text":"火药，本用于提供娱乐，但却被人类（＿＿＿＿＿＿）了这项发明，最终导致自己受到伤害。我（＿＿＿＿＿＿）希望火药这项发明，能够完全消失在世界上，让大家都能过上（＿＿＿＿＿＿）的生活。"}],"instr":"把词语拖到空格里，完成作文填充。","ans":["便利","不堪设想","起源","推动","摧毁","争斗权利","民不聊生","建设","谋取","生态","流离失所","滥用","衷心","安居乐业"],"bank":["流离失所","谋取","衷心","滥用","起源","民不聊生","摧毁","安居乐业","生态","推动","不堪设想","建设","便利","争斗权利"],"lesson":"（二十）作文填充：不应该被发明的东西","tab":"fillcomp","top":true,"sec":""},

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLANKSPLIT=/([_＿]{2,})/;
const CN=['零','一','二','三','四','五','六','七','八','九','十'];
function numCN(n){if(n<=10)return CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');if(n<100){const a=Math.floor(n/10),b=n%10;return CN[a]+'十'+(b?CN[b]:'');}return '一百';}

/* deterministic shuffle */
function shuffle(arr,seed){
  let x=seed>>>0;const rnd=()=>{x=(x*1103515245+12345)>>>0;return x/4294967296;};
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const state={};   // card index -> {placed:[], sel:null, done:false, shownKey:null, revealed:false, written:{}, wchecked:false}
let CUR='reorder';   // (the reorder build replaces this line)
let ALL_OPEN=false;   // "全部开放" for checking
const NO_ALL_OPEN=['fill','reorder','fillcomp'];   // these tabs ignore 全部开放 and keep their one-by-one order
const NO_BUTTON=['fill','reorder'];   // the 全部开放 button is hidden on these tabs

function isWrite(c){return c.write===true;}
function isInteractive(c){return !isWrite(c)&&Array.isArray(c.ans)&&c.ans.length>0&&Array.isArray(c.items)&&c.items.length>0;}
function st(ci){return state[ci]||(state[ci]={placed:[],sel:null,done:false,shownKey:null,revealed:false,written:{},wchecked:false});}

/* slots: each blank of the card, in reading order, and the item it belongs to */
const MAPS={};
function slotMap(ci){
  if(MAPS[ci])return MAPS[ci];
  const c=CARDS[ci];const itemOf=[],base=[];let k=0;
  c.items.forEach((it,j)=>{base.push(k);const nb=it.text.split(BLANKSPLIT).filter((p,i)=>i%2===1).length;for(let x=0;x<nb;x++){itemOf.push(j);k++;}});
  return MAPS[ci]={itemOf,base,n:k};
}
function slotCount(ci){return slotMap(ci).n;}

/* every drag question gets its own pool: its own answers plus a few other words from the bank */
function prepareCards(){
  CARDS.forEach((c,ci)=>{
    if(!isInteractive(c)||c.top)return;   // "top" cards share one bank (c.bank) instead of per-question pools
    const m=slotMap(ci);
    c.items.forEach((it,j)=>{
      if(Array.isArray(it.bank))return;
      const ks=[];m.itemOf.forEach((jj,k)=>{if(jj===j)ks.push(k);});
      const ans=ks.map(k=>c.ans[k]);
      let pool=ans.slice();
      if(ks.length&&c.tab!=='reorder'&&Array.isArray(c.bank)){
        const seen=new Set(ans);
        const others=[];
        shuffle(c.bank,ci*131+j*17+7).forEach(w=>{if(!seen.has(w)){seen.add(w);others.push(w);}});
        pool=pool.concat(others.slice(0,4));
      }
      it.bank=shuffle(pool,ci*97+j*31+3);
    });
  });
}

function ensurePlaced(ci){const s=st(ci);const n=slotCount(ci);while(s.placed.length<n)s.placed.push(null);return s;}
/* the word now sitting in slot k (or null) */
function wordAt(ci,k){
  const s=st(ci);const c=CARDS[ci];const ti=s.placed[k];
  if(ti===null||ti===undefined)return null;
  if(c.top)return c.bank[ti];
  const j=slotMap(ci).itemOf[k];
  return c.items[j].bank[ti];
}
function slotRight(ci,k){const w=wordAt(ci,k);return w!==null&&w===CARDS[ci].ans[k];}

/* write-in (関联词) answers: 检查答案 compares what was typed with the key, ignoring spaces and punctuation */
function wnorm(x){return String(x).replace(/[\s，。？！,.?!、；;：:“”"'‘’（）()…—\-]/g,'');}
function wRight(c,s,k){const a=wnorm(s.written[k]||'');return a!==''&&a===wnorm(c.ans[k]||'');}
function wStatus(c,s,k){return s.wchecked?(wRight(c,s,k)?' ok':' bad'):'';}
function wFix(c,s,k){return s.wchecked&&!wRight(c,s,k)?`<div class="ansline">答案：${esc(c.ans[k]||'')}</div>`:'';}
function wRow(c,ci,s){
  const n=c.items.length, right=c.items.filter((_,k)=>wRight(c,s,k)).length;
  const msg=s.wchecked?(right===n?`<div class="muted">全部正确！</div>`:`<div class="muted">${n-right} 题不对，看看红色的方框。</div>`):'';
  return `<div class="row"><button class="btn" data-act="wcheck" data-card="${ci}">✔ 检查答案</button><button class="btn alt sm" disabled data-reveal="${ci}">${s.revealed?'🙈 收起答案':'👀 看答案'}</button></div>${msg}`;
}

function pdfWriteHTML(c,ci){
  const s=st(ci);
  let h=`<section class="card pdfcard" id="card${ci}"><div class="qh"><div class="qn">练习（${numCN(c.no)}）</div></div>`;
  h+=`<div class="pdfinstr"><span class="pdfnum">5.4.1</span><span>${esc(c.instr||'')}</span></div>`;
  c.items.forEach((it,k)=>{
    const toks=it.text.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);
    const hint=toks.find(x=>x.includes('……'))||'';
    const sents=toks.filter(x=>!x.includes('……'));
    h+=`<div class="pdfitem"><div class="pdfq"><b>${it.n}.</b>${sents.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`+
       (hint?`<div class="hintbox">${esc(hint)}</div>`:'')+`</div>`+
       `<textarea class="pdfwrite${wStatus(c,s,k)}" rows="2" data-wk="${ci}:${k}" aria-label="第${it.n}题的答案">${esc(s.written[k]||'')}</textarea>${wFix(c,s,k)}`;
  });
  h+=wRow(c,ci,s);
  if(s.revealed)h+=`<pre class="atxt">${esc(c.items.map((it,k)=>it.n+'. '+(c.ans[k]||'')).join('\n'))}</pre>`;
  return h+`</section>`;
}

function writeHTML(c,ci,head){
  const s=st(ci);
  if(c.pdf)return pdfWriteHTML(c,ci);
  head=head.replace('class="instr"','class="instr strong"');
  let h=`<section class="card" id="card${ci}">${head}`;
  c.items.forEach((it,k)=>{
    h+=`<div class="line"><b>${it.n}.</b> ${esc(it.text)}</div>`+
       `<textarea class="wbox${wStatus(c,s,k)}" rows="2" data-wk="${ci}:${k}" aria-label="第${it.n}题的答案">${esc(s.written[k]||'')}</textarea>${wFix(c,s,k)}`;
  });
  h+=wRow(c,ci,s);
  if(s.revealed)h+=`<pre class="atxt">${esc(c.items.map((it,k)=>it.n+'. '+(c.ans[k]||'')).join('\n'))}</pre>`;
  return h+`</section>`;
}

function tileSpans(ci,j,it,s,m){
  const used=new Set();
  m.itemOf.forEach((jj,k)=>{if(jj===j&&s.placed[k]!==null&&s.placed[k]!==undefined)used.add(s.placed[k]);});
  return it.bank.map((w,i)=>{
    const u=used.has(i), sel=s.sel===`${j}:${i}`;
    return `<span class="tile${u?' used':''}${sel?' sel':''}" data-tc="${ci}" data-ij="${j}" data-ti="${i}"${u?'':' draggable="true"'}>${esc(w)}</span>`;
  }).join('');
}
function tilesHTML(ci,j,it,s,m){
  return `<div class="itiles" aria-label="第${it.n}题的词语">${tileSpans(ci,j,it,s,m)}</div>`;
}

function cardHTML(c,ci){
  const head=`<div class="qh"><div class="qn">练习（${numCN(c.no)}）${c.sec?' · '+esc(c.sec):''}</div><div class="instr">${esc(c.instr||'')}</div></div>`;
  if(isWrite(c))return writeHTML(c,ci,head);
  const s=ensurePlaced(ci);
  const m=slotMap(ci);
  let h=`<section class="card${c.rowB?' rowBsec':''}" id="card${ci}">`;
  if(c.image)h+=`<img class="note-img" src="${esc(c.image)}" alt="笔记">`;
  else if(c.notes&&c.notes.length)h+=`<pre class="notes">${esc(c.notes.join('\n'))}</pre>`;
  h+=head;
  h+=`<div class="hint">拖动词语到空格；或先点词语，再点空格。点已填的空格可拿回。</div>`;
  // "top" cards (作文填充 passages): the passage's word bank sits above the passage, one shared bank
  if(c.top){
    const used=new Set(s.placed.filter(x=>x!==null&&x!==undefined));
    h+=`<div class="itiles topPool" aria-label="词语">`+c.bank.map((w,i)=>{
      const u=used.has(i), sel=s.sel===`t:${i}`;
      return `<span class="tile${u?' used':''}${sel?' sel':''}" data-tc="${ci}" data-ij="t" data-ti="${i}"${u?'':' draggable="true"'}>${esc(w)}</span>`;
    }).join('')+`</div>`;
  }
  if(c.cols)h+=`<div class="grid" style="--rows:${c.cols};--cols:${Math.ceil(c.items.length/c.cols)}">`;
  let slot=0;
  c.items.forEach((it,j)=>{
    const pieces=it.text.split(BLANKSPLIT);
    const nb=pieces.filter((_,i)=>i%2===1).length;
    const chkJ=c.rowB?itemChecked(ci,j):s.done;
    let body='';
    pieces.forEach((p,i)=>{
      if(i%2===0){body+=esc(p);return;}
      const k=slot++;
      const w=wordAt(ci,k);
      const cls=['slot'];
      if(w!==null)cls.push('filled');
      if(chkJ&&w!==null)cls.push(w===c.ans[k]?'ok':'bad');
      body+=`<span class="${cls.join(' ')}" data-sc="${ci}" data-ij="${c.top?'t':j}" data-slot="${k}" role="button" tabindex="0">${w===null?'＿＿':esc(w)}</span>`;
    });
    let fix='';
    if(chkJ){
      const wrong=[];
      for(let q=0;q<nb;q++){const k=slot-nb+q;if(!slotRight(ci,k))wrong.push(c.ans[k]);}
      if(wrong.length)fix=`<div class="ansline">答案：${esc(wrong.join('、'))}</div>`;
    }
    const pool=(!c.top&&Array.isArray(it.bank)&&it.bank.length&&nb>0)?tilesHTML(ci,j,it,s,m):'';
    if(c.rowB){
      // each question is its own card in a column: its word tiles on top, the sentence below
      // one card per question: blanks and its check/clear on the left, its word tiles on the right
      // question by question: question n opens after question n-1 is checked and correct
      if(j>0&&!(itemChecked(ci,j-1)&&itemRight(ci,j-1))){
        h+=`<div class="qcard"><div class="qleft"><div class="qtext">🔒 ${it.n?it.n+'. ':''}未开放</div><div class="instr">先做完上一题，检查正确后才能做这一题。</div></div></div>`;
        return;
      }
      const sp=tileSpans(ci,j,it,s,m);
      h+=`<div class="qcard"><div class="qleft"><div class="qtext">${it.n?`<b>${it.n}.</b> `:''}${body}</div>${fix}`+
         `<div class="row"><button class="btn" data-act="icheck" data-card="${ci}" data-j="${j}">✔ 检查</button><button class="btn alt sm" data-act="iclear" data-card="${ci}" data-j="${j}">清空</button></div></div>`+
         `<div class="qright"><div class="itiles">${sp}</div></div></div>`;
    } else {
      h+=`<div class="${c.cols?'cell':'line'}">${pool}${it.n?`<b>${it.n}.</b> `:''}${body}${fix}</div>`;
    }
  });
  if(c.cols)h+=`</div>`;
  if(!c.rowB)h+=`<div class="row"><button class="btn" data-act="check" data-card="${ci}">✔ 检查</button><button class="btn alt sm" disabled data-act="show" data-card="${ci}">👀 看答案</button><button class="btn alt sm" data-act="clear" data-card="${ci}">清空</button></div>`;
  if(s.done){const n=s.placed.length;let ok=0;for(let k=0;k<n;k++)if(slotRight(ci,k))ok++;h+=`<div class="muted">本练习：${ok} / ${n} 空 正确</div>`;}
  return h+`</section>`;
}

function cardsOf(tab){return CARDS.map((c,ci)=>({c,ci})).filter(x=>x.c.tab===tab);}

/* A card is passed when every blank holds the right word (no 看答案 in the last check),
   or, for write-in cards, when 检查答案 marks every box right. */
/* layout-B questions are checked one at a time; a check stays valid only while that question is unchanged */
function itemKey(ci,j){const s=st(ci);const m=slotMap(ci);const a=[];m.itemOf.forEach((jj,k)=>{if(jj===j)a.push(s.placed[k]===null||s.placed[k]===undefined?'':s.placed[k]);});return a.join(',');}
function itemFull(ci,j){const s=st(ci);const m=slotMap(ci);return m.itemOf.every((jj,k)=>jj!==j||(s.placed[k]!==null&&s.placed[k]!==undefined));}
function itemChecked(ci,j){const s=st(ci);return !!(s.ich&&s.ich[j]!==undefined&&s.ich[j]===itemKey(ci,j));}
function itemRight(ci,j){const m=slotMap(ci);for(let k=0;k<m.itemOf.length;k++)if(m.itemOf[k]===j&&!slotRight(ci,k))return false;return true;}
function passed(ci){
  const c=CARDS[ci],s=state[ci];
  if(!s)return false;
  if(!isInteractive(c))return !!s.wchecked&&c.items.every((_,k)=>wRight(c,s,k));
  if(c.rowB)return c.items.every((_,j)=>itemChecked(ci,j)&&itemRight(ci,j));
  if(!s.done||s.shownKey===s.placed.join(','))return false;
  const n=slotCount(ci);
  if(s.placed.length!==n)return false;
  for(let k=0;k<n;k++)if(!slotRight(ci,k))return false;
  return true;
}
/* exercise n (not the first in its tab) opens only after exercise n-1 is passed */
function locked(list,idx){
  // 作文填充 keeps its order even when 全部开放 is on: only the first passage is open until the one before it is done
  if(ALL_OPEN&&!NO_ALL_OPEN.includes(list[idx].c.tab))return false;
  return idx>0&&!passed(list[idx-1].ci);
}
function lockedHTML(c,ci){
  return `<section class="card" id="card${ci}"><div class="qh"><div class="qn">🔒 练习（${numCN(c.no)}）未开放</div></div>`+
    `<div class="instr">请先做完上一个练习，全部答对后才能做这一题。</div></section>`;
}

function renderTab(){
  const view=document.getElementById('view');
  const list=cardsOf(CUR);
  const name=(TABS.find(t=>t.id===CUR)||{}).name||'';
  let h=`<h2 class="unit">${esc(name)}</h2>`;
  let lastL=null;
  list.forEach(({c,ci},idx)=>{
    if(c.lesson!==lastL){h+=`<div class="lesson">${esc(c.lesson)}</div>`;lastL=c.lesson;}
    h+=locked(list,idx)?lockedHTML(c,ci):cardHTML(c,ci);
  });
  if(!list.length)h+=`<p class="none">暂无内容</p>`;
  view.innerHTML=h;
  score();
}

function tabsBar(){
  const bar=document.getElementById('tabs');
  bar.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className=(t.id===CUR?'btn':'btn alt')+' sm';
    b.setAttribute('aria-pressed',String(t.id===CUR));
    b.textContent=t.name;
    b.addEventListener('click',()=>{CUR=t.id;try{history.replaceState(null,'','#'+t.id);}catch(e){}tabsBar();renderTab();window.scrollTo(0,0);});
    bar.appendChild(b);
  });
  if(true)return;   // 全部开放 is removed from the 4C page and the 词句重组 page
  const all=document.createElement('button');
  all.id='allOpen';
  all.className='btn alt sm openall';
  all.textContent=ALL_OPEN?'🔒 恢复逐题开放':'🔓 全部开放（检查用）';
  all.addEventListener('click',()=>{ALL_OPEN=!ALL_OPEN;tabsBar();renderTab();});
  bar.appendChild(all);
}

function score(){
  let c=0,r=0,t=0;
  CARDS.forEach((card,ci)=>{
    if(!isInteractive(card))return;
    const n=slotCount(ci);
    t+=n;
    const s=state[ci];
    if(!s)return;
    if(card.rowB){
      card.items.forEach((_,j)=>{if(!itemChecked(ci,j))return;const m=slotMap(ci);m.itemOf.forEach((jj,k)=>{if(jj===j){c++;if(slotRight(ci,k))r++;}});});
      return;
    }
    if(!s.done)return;
    c+=s.placed.length;
    for(let k=0;k<n;k++)if(slotRight(ci,k))r++;
  });
  document.getElementById('score').textContent=`✅ ${r} / ${t}　已检查 ${c}`;
}

function place(ci,k,ti){
  const s=ensurePlaced(ci);
  s.placed[k]=ti;
  s.sel=null;
  s.done=false;
}

/* ---- drag & drop (desktop) and tap-to-place (touch); a tile only goes to a blank under the same question ---- */
document.addEventListener('dragstart',ev=>{
  const t=ev.target.closest('[data-tc]');if(!t||t.classList.contains('used'))return;
  const ci=+t.dataset.tc,ij=t.dataset.ij,ti=+t.dataset.ti;
  ev.dataTransfer.setData('text/plain',`${ci}:${ij}:${ti}`);
  ev.dataTransfer.effectAllowed='move';
  st(ci).sel=`${ij}:${ti}`;
});
document.addEventListener('dragover',ev=>{
  if(ev.target.closest('[data-sc]'))ev.preventDefault();
});
document.addEventListener('drop',ev=>{
  const sc=ev.target.closest('[data-sc]');if(!sc)return;
  ev.preventDefault();
  const ci=+sc.dataset.sc,k=+sc.dataset.slot,ij=sc.dataset.ij;
  let parsed=(ev.dataTransfer.getData('text/plain')||'').split(':');
  let ti=null;
  if(parsed.length===3&&+parsed[0]===ci&&parsed[1]===String(ij))ti=+parsed[2];
  else if(st(ci).sel&&st(ci).sel.split(':')[0]===String(ij))ti=+st(ci).sel.split(':')[1];
  if(ti===null)return;
  place(ci,k,ti);
  const y=window.scrollY;renderTab();window.scrollTo(0,y);
});

/* write boxes: keep what is typed (no re-render on typing) */
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(!t.matches||!t.matches('textarea[data-wk]'))return;
  const parts=t.dataset.wk.split(':');const ci=+parts[0],k=+parts[1];
  const s=st(ci);s.written[k]=t.value;s.wchecked=false;
});

document.addEventListener('click',ev=>{
  const r=ev.target.closest('[data-reveal]');
  if(r){
    const ci=+r.dataset.reveal;const s=st(ci);s.revealed=!s.revealed;
    const y=window.scrollY;renderTab();window.scrollTo(0,y);
    return;
  }
  const tile=ev.target.closest('[data-tc]');
  if(tile&&!tile.classList.contains('used')){
    const ci=+tile.dataset.tc,key=`${tile.dataset.ij}:${tile.dataset.ti}`;const s=ensurePlaced(ci);
    s.sel=(s.sel===key)?null:key;
    const y=window.scrollY;renderTab();window.scrollTo(0,y);
    return;
  }
  const slot=ev.target.closest('[data-sc]');
  if(slot){
    const ci=+slot.dataset.sc,k=+slot.dataset.slot,ij=slot.dataset.ij;const s=ensurePlaced(ci);
    if(s.placed[k]!==null){s.placed[k]=null;s.done=false;}
    else if(s.sel&&s.sel.split(':')[0]===String(ij)){s.placed[k]=+s.sel.split(':')[1];s.sel=null;s.done=false;}
    const y=window.scrollY;renderTab();window.scrollTo(0,y);
    return;
  }
  const b=ev.target.closest('[data-act]');if(!b)return;
  const ci=+b.dataset.card,card=CARDS[ci];const s=ensurePlaced(ci);
  if(b.dataset.act==='icheck'){
    const j=+b.dataset.j;
    if(!itemFull(ci,j)){alert('这一题还有空格没有填');return;}
    s.ich=s.ich||{};s.ich[j]=itemKey(ci,j);
    const y=window.scrollY;renderTab();window.scrollTo(0,y);
    return;
  }
  if(b.dataset.act==='iclear'){
    const j=+b.dataset.j;const m=slotMap(ci);
    m.itemOf.forEach((jj,k)=>{if(jj===j)s.placed[k]=null;});
    if(s.ich)delete s.ich[j];
    s.sel=null;s.done=false;
    const y=window.scrollY;renderTab();window.scrollTo(0,y);
    return;
  }
  if(b.dataset.act==='wcheck'){
    s.wchecked=true;
    const y=window.scrollY;renderTab();window.scrollTo(0,y);
    return;
  }
  if(b.dataset.act==='check'){
    const miss=s.placed.filter(x=>x===null).length;
    if(miss>0){alert('还有 '+miss+' 个空格没有填哦！');return;}
    s.done=true;
  }
  if(b.dataset.act==='show'&&card.top){
    const taken=new Set();
    card.ans.forEach((a,k)=>{
      let pick=null;
      for(let i=0;i<card.bank.length;i++){if(!taken.has(i)&&card.bank[i]===a){pick=i;break;}}
      s.placed[k]=pick;if(pick!==null)taken.add(pick);
    });
    s.sel=null;s.done=true;s.shownKey=s.placed.join(',');
  } else if(b.dataset.act==='show'){
    const m=slotMap(ci);
    card.items.forEach((it,j)=>{
      const taken=new Set();
      m.itemOf.forEach((jj,k)=>{
        if(jj!==j)return;
        let pick=null;
        for(let i=0;i<it.bank.length;i++){if(!taken.has(i)&&it.bank[i]===card.ans[k]){pick=i;break;}}
        s.placed[k]=pick;if(pick!==null)taken.add(pick);
      });
    });
    s.sel=null;s.done=true;s.shownKey=s.placed.join(',');
  }
  if(b.dataset.act==='clear'){
    s.placed=s.placed.map(()=>null);s.sel=null;s.done=false;
  }
  const y=window.scrollY;
  renderTab();window.scrollTo(0,y);
});

(function init(){
  prepareCards();
  const h=(location.hash||'').replace('#','');
  if(TABS.some(t=>t.id===h))CUR=h;
  tabsBar();
  renderTab();
})();
</script>
</body>
</html>
