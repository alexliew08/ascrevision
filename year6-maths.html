<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学小乐园 · 六年级</title>
<style>
:root{--bg:#eef3ff;--card:#fff;--text:#1d2347;--mute:#5b638f;--acc:#6c4cff;--ok:#18a864;--bad:#e5484d;--line:#d9e0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1633;--card:#1a2350;--text:#f1f3ff;--mute:#a9b2e6;--acc:#9a85ff;--line:#2f3a78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1633;--card:#1a2350;--text:#f1f3ff;--mute:#a9b2e6;--acc:#9a85ff;--line:#2f3a78;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{margin:6px 0;font-size:26px}h2{margin:4px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.planet{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;transition:.15s}
.planet:hover{transform:translateY(-3px) rotate(-1deg);border-color:var(--acc)}
.planet .e{font-size:38px;display:block}.planet small{color:var(--mute)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
.lv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q{font-size:21px;line-height:1.55;font-weight:600;margin:8px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:19px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prog{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:.3s}
.fb{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);border:2px dashed var(--line);white-space:pre-line}
.hide{display:none}button:disabled{opacity:.4;cursor:not-allowed}.mas{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.mi{font-size:34px;animation:bob 2s ease-in-out infinite}.bub{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;color:var(--mute)}.bub.good{border-color:var(--ok);color:var(--ok);font-weight:700}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@keyframes pop{50%{transform:scale(1.1)}}.opt.ok{animation:pop .4s}mark{background:#ffd54a;color:#1d2347;border-radius:4px;padding:0 4px;font-weight:800}.big{font-size:54px;text-align:center}.badge{display:inline-block;margin:4px;padding:6px 10px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}.badge.off{opacity:.35;filter:grayscale(1)}
@media(max-width:420px){.opts{grid-template-columns:1fr}}

.candyTop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:4px 0 12px}
.candyLogo{height:64px;max-width:100%}
.candyHead h1{margin:2px 0;font-size:22px}
.candyHead small{color:var(--mute)}
.candyChips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px;align-items:center}
.candyModes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.candyBtn{background:#fff;color:var(--text);border:3px solid #1d1f2b;border-radius:18px;padding:12px 8px;font-weight:900;font-size:15px;box-shadow:0 5px 0 #1d1f2b}
.candyBtn.hot{background:#ff8c42;color:#fff}
.jars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jar{border:3px solid #1d1f2b;border-radius:18px 18px 28px 28px;padding:14px 6px 12px;text-align:center;font-weight:900;color:#1d1f2b;box-shadow:0 5px 0 #1d1f2b;display:flex;flex-direction:column;align-items:center;gap:4px}
.jar .e{font-size:32px;line-height:1}
.jar b{font-size:14px}
.jar small{font-size:11px;font-weight:700;opacity:.8}
.jar.j0{background:#ff8fb1}.jar.j1{background:#9b8cff;color:#fff}.jar.j2{background:#ffd166}.jar.j3{background:#9be7c4}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[R(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number.isInteger(n)?n.toLocaleString("en-US"):String(+n.toFixed(2));
const RM=n=>"RM"+n.toFixed(2);
const p2=n=>String(n).padStart(2,"0");
const tf=m=>{m=((m%1440)+1440)%1440;return p2(Math.floor(m/60))+":"+p2(m%60)};
const hm=d=>(d>=60?Math.floor(d/60)+" 小时 ":"")+(d%60?d%60+" 分钟":"");
function mkS(q,ans,wr,exp,hint){const tr0=x=>typeof x==="string"?x.trim():x;ans=tr0(ans);wr=wr.map(tr0);let w=[...new Set(wr)].filter(x=>x!==ans);let k=1;while(w.length<3){const z="("+R(1,12)+", "+R(1,12)+")";if(z!==ans&&!w.includes(z))w.push(z)}return{q,ans,opts:sh([ans,...sh(w).slice(0,3)]),exp,hint}}
function mkN(q,a,ds,f,exp,hint){const s=new Set();sh(ds).forEach(d=>{[a+d,a-d].forEach(x=>{x=+x.toFixed(2);if(x>=0&&x!==a)s.add(x)})});let i=1;while(s.size<3){s.add(+(a+i*7).toFixed(2));i++}const w=sh([...s]).slice(0,3);return{q,ans:f(a),opts:sh([a,...w]).map(f),exp,hint}}
const id=n=>fmt(n);
const CL=["红","蓝","绿","黄"];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const simp=(n,d)=>{const g=gcd(n,d);return `${n/g}/${d/g}`};
const q2=x=>+x.toFixed(2);
const SV=(h,i,w=340)=>`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;display:block;margin:8px auto" role="img" aria-label="题目图示">${i}</svg>`;
const TX=(x,y,t,a="middle",s=13,c="var(--text)")=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${s}" fill="${c}" font-family="sans-serif">${t}</text>`;
const LN=(a,b,c,d,col="var(--text)",dash="",w=2)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:""}/>`;
const EMO=(x,y,e,s=22)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle">${e}</text>`;
const RC=(x,y,w,h,f="none",o=.25,sw=2,r=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" fill-opacity="${o}" stroke="var(--text)" stroke-width="${sw}"/>`;
const AC="var(--acc)",BD="var(--bad)";
const XX=(x,y,r=11)=>LN(x-r,y-r,x+r,y+r,BD,"",3)+LN(x+r,y-r,x-r,y+r,BD,"",3);
const picEm=g=>{let s="",y=26;g.forEach(o=>{if(o.lab){s+=TX(10,y-6,o.lab,"start",13,"var(--mute)");y+=20;return}if(o.sign){s+=TX(170,y+2,o.sign,"middle",24);y+=26;return}for(let i=0;i<o.n;i++){const cx=24+(i%10)*31,cy=y+Math.floor(i/10)*32;s+=EMO(cx,cy,o.e);if(i>=o.n-(o.x||0))s+=XX(cx,cy-7)}y+=Math.ceil(o.n/10)*32+6});return SV(y,s)};
const picAddE=(a,b,e)=>picEm([{e,n:a},{sign:"＋"},{e,n:b}]);
const picSubE=(a,b,e)=>picEm([{e,n:a,x:b}]);
const blk=(n,x0,y0,sc=1)=>{const t=Math.floor(n/10),o=n%10;let s="";for(let i=0;i<t;i++){const x=x0+i*12*sc;s+=`<rect x="${x}" y="${y0}" width="${10*sc}" height="${50*sc}" fill="${AC}" fill-opacity=".55" stroke="var(--text)" stroke-width="1.2"/>`;for(let j=1;j<10;j++)s+=LN(x,y0+j*5*sc,x+10*sc,y0+j*5*sc,"var(--text)","",.6)}const ox=x0+t*12*sc+8*sc;for(let i=0;i<o;i++)s+=`<rect x="${ox+(i%3)*12*sc}" y="${y0+50*sc-(Math.floor(i/3)+1)*12*sc}" width="${10*sc}" height="${10*sc}" fill="#D85A30" fill-opacity=".6" stroke="var(--text)" stroke-width="1.2"/>`;return s};
const picBlocks=(n,cap=true)=>SV(cap?96:76,blk(n,90,10)+(cap?TX(170,88,`${n} = ${Math.floor(n/10)} 个十 + ${n%10} 个一`,"middle",13):""));
const picBlocks2=(a,b,sg)=>SV(96,blk(a,10,10,.9)+TX(170,40,sg,"middle",28)+blk(b,190,10,.9)+TX(85,88,a,"middle",13)+TX(255,88,b,"middle",13));
const picNL=(a,b,o={})=>{const W=300,x0=20,k=W/(b-a),y=62,step=(b-a)<=24?1:(b-a)<=60?5:(b-a)<=130?10:(b-a)<=600?50:100;let s=LN(x0,y,x0+W,y);const lst=(String(b).length>=5&&(b-a)/((b-a)<=24?1:(b-a)<=60?5:(b-a)<=130?10:(b-a)<=600?50:100)>6)?((b-a)<=24?1:(b-a)<=60?5:(b-a)<=130?10:(b-a)<=600?50:100)*5:step;const stp=(b-a)<=24?1:(b-a)<=60?5:(b-a)<=130?10:(b-a)<=600?50:100;for(let v=a;v<=b;v++){const x=x0+(v-a)*k;if((v-a)%stp==0||v==b){s+=LN(x,y-5,x,y+5,"var(--text)","",1.5);if((v-a)%lst==0)s+=(v===o.qm?"":TX(x,y+22,v,"middle",11))}}(o.hi||[]).forEach(v=>s+=`<circle cx="${x0+(v-a)*k}" cy="${y}" r="7" fill="${AC}"/>`);if(o.qm!=null)s+=`<circle cx="${x0+(o.qm-a)*k}" cy="${y}" r="9" fill="none" stroke="${BD}" stroke-width="2.5"/>`+TX(x0+(o.qm-a)*k,y-18,"?","middle",16,BD);(o.jumps||[]).forEach(j=>{const xa=x0+(j[0]-a)*k,xb=x0+(j[1]-a)*k;s+=`<path d="M ${xa} ${y} Q ${(xa+xb)/2} ${y-36} ${xb} ${y}" fill="none" stroke="${AC}" stroke-width="2.5"/>`+TX((xa+xb)/2,y-30,j[2]||"","middle",12)});return SV(92,s)};
const picSeq=v=>{const n=v.length,w=Math.min(54,300/n);let s="";v.forEach((x,i)=>{const X=(340-n*w)/2+i*w;s+=RC(X,20,w-4,38,x=="?"?"var(--bad)":AC,.2,2,6)+TX(X+(w-4)/2,45,x,"middle",16,x=="?"?BD:"var(--text)")});return SV(78,s)};
const picBond=(t,a,b)=>SV(140,LN(170,52,110,92)+LN(170,52,230,92)+`<circle cx="170" cy="32" r="24" fill="${AC}" fill-opacity=".25" stroke="var(--text)" stroke-width="2"/>`+`<circle cx="110" cy="108" r="24" fill="none" stroke="var(--text)" stroke-width="2"/>`+`<circle cx="230" cy="108" r="24" fill="none" stroke="var(--text)" stroke-width="2"/>`+TX(170,38,t,"middle",18)+TX(110,114,a,"middle",18,a=="?"?BD:"var(--text)")+TX(230,114,b,"middle",18,b=="?"?BD:"var(--text)"));
const picPieF=(k,d)=>{const cx=110,cy=80,r=68;let s="";for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;s+=`<path d="M ${cx} ${cy} L ${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A ${r} ${r} 0 0 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} Z" fill="${i<k?AC:"none"}" fill-opacity=".55" stroke="var(--text)" stroke-width="2"/>`}return SV(165,s)};
const picRectF=(k,d)=>{const w=240/d,x=50;let s="";for(let i=0;i<d;i++)s+=RC(x+i*w,16,w,56,i<k?AC:"none",.55);return SV(80,s)};
const picBoxes=(m,n,e,eaten=0,lab="")=>{if(m>12)return picBoxesL(m,String(n),lab);const bw=Math.min(m<=2?130:76,320/m-8),sp=(bw-18)/4.2,fz=Math.min(16,sp*.95);let s="";for(let i=0;i<m;i++){const x=(340-m*(bw+8))/2+i*(bw+8);s+=RC(x,14,bw,64,"none",0,2,8);for(let j=0;j<n;j++){const px=x+12+(j%5)*((bw-18)/4.2),py=36+Math.floor(j/5)*22;s+=e==="•"?`<circle cx="${px}" cy="${py}" r="5" fill="${AC}"/>`:EMO(px,py+5,e,fz)}if(i>=m-eaten)s+=XX(x+bw/2,46,22)}return SV(96,s+TX(170,94,lab,"middle",13))};
const NOTE={1:"#378ADD",5:"#1D9E75",10:"#D85A30",20:"#BA7517",50:"#2A9DA8",100:"#7F77DD"};
const noteS=(x,y,v)=>`<rect x="${x}" y="${y}" width="64" height="34" rx="4" fill="${NOTE[v]||"#888"}" fill-opacity=".3" stroke="var(--text)" stroke-width="1.5"/>`+TX(x+32,y+22,"RM"+v,"middle",14);
const coinS=(x,y,t)=>`<circle cx="${x}" cy="${y}" r="21" fill="#EF9F27" fill-opacity=".5" stroke="var(--text)" stroke-width="1.5"/>`+TX(x,y+4,t,"middle",12);
const picNotes=(v,n)=>{let s="";const per=4,rows=Math.ceil(n/per);for(let i=0;i<n;i++)s+=noteS(14+(i%per)*80,10+Math.floor(i/per)*44,v);return SV(rows*44+16,s)};
const picCoins=(t,n)=>{let s="";for(let i=0;i<n;i++)s+=coinS(30+(i%6)*52,28+Math.floor(i/6)*48,t);return SV(Math.ceil(n/6)*48+14,s)};
const picTags=(r)=>{let s="";r.forEach((t,i)=>{const x=16+i*104;s+=RC(x,16,92,58,"#EF9F27",.2,2,8)+TX(x+46,38,t[0],"middle",13)+TX(x+46,62,"RM"+t[1],"middle",16)});return SV(90,s)};
const picWeek=(i,j)=>{const nm="一二三四五六日";let s="";for(let k=0;k<7;k++){const x=10+k*46;s+=RC(x,16,42,50,k===i?AC:k===j?"#1D9E75":"none",.45,2,6)+TX(x+21,46,nm[k],"middle",18)}return SV(86,s+TX(170,82,"星期一 到 星期日","middle",12))};
const picMonths=(i,j)=>{let s="";for(let k=0;k<12;k++){const x=14+(k%6)*54,y=12+Math.floor(k/6)*46;s+=RC(x,y,48,38,k===i?AC:k===j?"#1D9E75":"none",.45,2,6)+TX(x+24,y+25,(k+1)+"月","middle",14)}return SV(104,s)};
const picClock=(h,m)=>{const cx=100,cy=100,r=84;let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--text)" stroke-width="3"/>`;for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;s+=TX(cx+(r-17)*Math.sin(a),cy-(r-17)*Math.cos(a)+5,i,"middle",14)}for(let i=0;i<60;i++){const a=i*6*Math.PI/180,l=i%5?3:6;s+=LN(cx+(r-l)*Math.sin(a),cy-(r-l)*Math.cos(a),cx+r*Math.sin(a),cy-r*Math.cos(a),"var(--text)","",1)}const ah=((h%12)*30+m*.5)*Math.PI/180,am=m*6*Math.PI/180;s+=LN(cx,cy,cx+46*Math.sin(ah),cy-46*Math.cos(ah),"var(--text)","",4)+LN(cx,cy,cx+68*Math.sin(am),cy-68*Math.cos(am),AC,"",3)+`<circle cx="${cx}" cy="${cy}" r="4" fill="var(--text)"/>`;return SV(200,s,200)};
const picBarsH=(rows,u="cm")=>{const mx=Math.max(...rows.map(r=>r[1])),k=190/mx;let s="";rows.forEach((r,i)=>{const y=14+i*40;s+=TX(60,y+22,r[0],"end",14)+RC(70,y,r[1]*k,28,["#378ADD","#1D9E75","#D85A30"][i%3],.35,2,4)+TX(70+r[1]*k+6,y+20,r[1]+" "+u,"start",13)});return SV(rows.length*40+14,s)};
const picRopes=(a,b,u="cm")=>{const k=Math.min(10,270/(a+b)),x=20;return SV(86,RC(x,14,a*k,28,"#378ADD",.35,2,4)+RC(x+a*k,14,b*k,28,"#1D9E75",.35,2,4)+TX(x+a*k/2,34,a+" "+u,"middle",13)+TX(x+a*k+b*k/2,34,b+" "+u,"middle",13)+TX(x+(a+b)*k/2,72,"合起来 = ?","middle",14,BD))};
const picRopeCut=(a,b,c,u="cm")=>{const k=Math.min(10,290/Math.max(a,a-b+c)),x=20;return SV(110,RC(x,12,a*k,26,"#378ADD",.35,2,4)+RC(x+(a-b)*k,12,b*k,26,BD,.35,2,4)+TX(x+(a-b)*k+b*k/2,30,"剪去 "+b,"middle",12)+TX(x+a*k/2-b*k/2,30,a+" "+u,"middle",13)+TX(170,70,`再接上 ${c} ${u}，现在多长？`,"middle",14,BD))};
const picBal=(l,r,ul,ur,u="kg",tilt=true)=>{const t=!tilt?0:l>r?-12:l<r?12:0;return SV(140,`<g transform="rotate(${t} 170 40)">`+LN(60,40,280,40,"var(--text)","",4)+RC(40,52,76,44,"#378ADD",.25,2,6)+TX(78,80,ul+" "+l+" "+u,"middle",12)+LN(78,40,78,52,"var(--text)","",2)+RC(224,52,76,44,"#D85A30",.25,2,6)+TX(262,80,ur+" "+r+" "+u,"middle",12)+LN(262,40,262,52,"var(--text)","",2)+`</g>`+LN(170,40,170,118,"var(--text)","",4)+LN(130,118,210,118,"var(--text)","",4))};
const picJug=(v,mx,u="ℓ",x0=130,lab)=>{const H=110,top=14,h=v/mx*H;let s=RC(x0,top,80,H,"none",0,2.5,4)+`<rect x="${x0+2}" y="${top+H-h}" width="76" height="${h}" fill="#378ADD" fill-opacity=".45"/>`;const st=mx>12?Math.ceil(mx/6):1;for(let i=0;i<=mx;i+=st){const y=top+H-i/mx*H;s+=LN(x0+80,y,x0+90,y,"var(--text)","",1.5)+TX(x0+96,y+4,i,"start",11)}return SV(top+H+14,s+TX(x0-12,top+H/2,lab||v+" "+u,"end",14))};

const THINGS=[["颗","糖","🍬"],["个","苹果","🍎"],["块","饼干","🍪"],["张","贴纸","⭐"],["个","气球","🎈"]],ITEM_PIE=["圆饼","披萨","蛋糕","西瓜"],ITEM_BAR=["巧克力","面包","蛋糕条"];
const fr0=()=>{const [d,k]=P([[2,1],[4,1],[4,2],[4,3]]),pie=R(0,1),it=pie?P(ITEM_PIE):P(ITEM_BAR),nm=`${k}/${d}`,w=d==2?["1/4","1/3","2/3"]:["1/2","1/4","2/4","3/4"].filter(x=>x!==nm);return pc(mkS(`一个${it}平均分成 ${d} 份，吃了 ${k} 份，吃了几分之几？`,nm,w,`分成 ${d} 份是分母，吃了 ${k} 份是分子：${nm}`,"分母是平均分成几份，分子是取了几份。"),pie?picPieF(k,d):picRectF(k,d))};
const fr1=()=>{const [u,t,e]=P(THINGS),n=R(2,10);return pc(mkN(`${2*n} ${u}${t}平均分成 2 份，每份是它的二分之一，是多少${u}？`,n,[1,2,n+1],id,`${2*n} ÷ 2 = ${n}`,"平均分成 2 份。"),picBoxes(2,n,e,0,"平均分成 2 份"))};
const fr2=()=>{const [u,t,e]=P(THINGS),n=R(2,6);return pc(mkN(`${4*n} ${u}${t}平均分成 4 份，每份是它的四分之一，是多少${u}？`,n,[1,2,n+1],id,`${4*n} ÷ 4 = ${n}`,"平均分成 4 份。"),picBoxes(4,n,e,0,"平均分成 4 份"))};
const fr3=()=>{const [u,t,e]=P(THINGS),n=R(2,6);return pc(mkN(`${4*n} ${u}${t}，吃了 3/4，吃了几${u}？`,3*n,[n,1,2],id,`每份 ${n} ${u}，3 份就是 ${3*n} ${u}`,"先求每一份是几个。"),picBoxes(4,n,e,3,"4 份里吃了 3 份"))};
const PR=[[3,"三角形",5,9,6],[4,"四边形",6,12,8],[5,"五边形",7,15,10],[6,"六边形",8,18,12],[7,"七边形",9,21,14],[8,"八边形",10,24,16]];
const prism=()=>{const [n,nm,f,e,v]=P(PR),p=P([["面",f],["棱",e],["顶点",v]]);return pc(mkN(`底面是${nm}的棱柱体，有几个${p[0]}？`,p[1],[1,2,n],x=>x+" 个",`棱柱体：面 = ${n} + 2 = ${f}；棱 = ${n} × 3 = ${e}；顶点 = ${n} × 2 = ${v}`,"数一数底面和侧面。"),picPoly(n))};
const polyN=()=>{const [n,nm]=P([[5,"五边形"],[6,"六边形"],[7,"七边形"],[8,"八边形"],[9,"九边形"],[10,"十边形"]]);return pc(mkN("图中的多边形有几条边？",n,[1,2,3],x=>x+" 条",`数一数，有 ${n} 条边`,"一条一条数。"),picPoly(n))};
const AX=[[3,"等边三角形",3],[4,"正方形",4],[5,"正五边形",5],[6,"正六边形",6],[8,"正八边形",8]];
const axis=()=>{const [n,nm,a]=P(AX);return pc(mkN(`${nm}有几条对称轴？`,a,[1,2,n+1],x=>x+" 条",`${nm}的对称轴和边数一样多：${a} 条`,"想一想怎样对折能完全重合。"),picPoly(n))};
const chart=()=>{const [q,a]=P([["要比较各班人数的多少","条形统计图"],["要比较四种水果的销量","条形统计图"],["要看各部分占整体的百分之几","饼分图"],["要看班上男生和女生各占百分之几","饼分图"],["要用图案表示数量","象形统计图"],["要用一个图案代表几个来表示数量","象形统计图"],["要比较各种宠物的数量","条形统计图"],["要看零用钱各项用途占多少百分比","饼分图"],["要比较三个班的得分","条形统计图"],["要看全班喜欢的颜色各占几成","饼分图"]]);return mkS(`${q}，用什么统计图最合适？`,a,["条形统计图","饼分图","象形统计图","折线统计图"].filter(x=>x!==a).slice(0,3),`${q}：${a}`,"想一想每种图的用处。")};
const polySum=()=>{const n=R(3,12),nm={3:"三",4:"四",5:"五",6:"六",7:"七",8:"八",9:"九",10:"十",11:"十一",12:"十二"}[n];return pc(mkN(`${nm}边形的内角和是多少度？`,(n-2)*180,[180,90,360],v=>v+"°",`(${n} − 2) × 180° = ${(n-2)*180}°`,"多边形内角和 = (边数 − 2) × 180°。"),picPoly(n))};
const triMiss=()=>{const a=R(30,80),b=R(30,70);return pc(mkN("看图，三角形的第三个角是多少度？",180-a-b,[5,10,20],x=>x+"°",`180 − ${a} − ${b} = ${180-a-b}°`,"三角形内角和 = 180°。"),picTriAng(a,b))};
const lineAng=()=>{const a=R(20,160);return pc(mkN(`一条直线上有两个角，其中一个是 ${a}°，另一个是多少度？`,180-a,[5,10,20],x=>x+"°",`180 − ${a} = ${180-a}°`,"直线上的角加起来是 180°。"),picStraightAng(a))};
const around=()=>{const a=R(60,140),b=R(60,140);return pc(mkN(`一个点周围有三个角，其中两个是 ${a}° 和 ${b}°，第三个角是多少度？`,360-a-b,[5,10,20],x=>x+"°",`360 − ${a} − ${b} = ${360-a-b}°`,"一个点周围的角加起来是 360°。"),picAround(a,b))};
const mm=(x)=>x;
const G=typeof GR==="undefined"?6:GR;
if(G==1){mixIn(6,0,[objGen,recGen]);mixIn(6,1,[shapeId,sideGen,cornGen,nmSide,nmCorn]);mixIn(6,2,[nShape]);mixIn(6,3,[mix3]);mixIn(2,0,[fr0]);mixIn(2,1,[fr1]);mixIn(2,2,[fr2]);mixIn(2,3,[fr3,fr1,fr2])}
if(G==2){mixIn(6,0,[objGen,recGen]);mixIn(6,1,[faceGen,edgeTxt]);mixIn(6,2,[shapeId,sideGen,cornGen,nmSide,nmCorn]);mixIn(6,3,[nCube,unfold]);
 const U2=s=>x=>fmt(x)+" "+s;mixIn(5,0,[()=>{const x=R(2,19);return mkN(`${x} m = 多少 cm？`,100*x,[10,100,50],U2("cm"),`${x} × 100 = ${100*x} cm`,"1 m = 100 cm。")},()=>{const k=R(2,19);return mkN(`${k} kg = 多少 g？`,1000*k,[100,500,1000],U2("g"),`${k} × 1 000 = ${fmt(1000*k)} g`,"1 kg = 1 000 g。")},()=>{const l=R(2,19);return mkN(`${l} ℓ = 多少 mℓ？`,1000*l,[100,500,1000],U2("mℓ"),`${l} × 1 000 = ${fmt(1000*l)} mℓ`,"1 ℓ = 1 000 mℓ。")}])}
if(G==3){mixIn(6,0,[prism,faceGen]);mixIn(6,1,[polyN,axis]);mixIn(6,2,[prism,axis]);mixIn(6,3,[polyN,axis,prism]);mixIn(8,2,[chart])}
if(G==6){mixIn(5,0,[polySum,triMiss,lineAng,around]);mixIn(5,1,[polySum,triMiss,lineAng,around]);mixIn(5,2,[polySum,triMiss])}
})();

 try{const q=new URLSearchParams(location.search).get("s");if(q)return q}catch(e){}return null}
