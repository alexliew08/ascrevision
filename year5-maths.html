<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学星球探险队 · 五年级</title>
<style>
:root{--bg:#eef3ff;--card:#fff;--text:#1d2347;--mute:#5b638f;--acc:#6c4cff;--ok:#18a864;--bad:#e5484d;--line:#d9e0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1633;--card:#1a2350;--text:#f1f3ff;--mute:#a9b2e6;--acc:#9a85ff;--line:#2f3a78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1633;--card:#1a2350;--text:#f1f3ff;--mute:#a9b2e6;--acc:#9a85ff;--line:#2f3a78;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{margin:6px 0;font-size:26px}h2{margin:4px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.planet{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;transition:.15s}
.planet:hover{transform:translateY(-3px) rotate(-1deg);border-color:var(--acc)}
.planet .e{font-size:38px;display:block}.planet small{color:var(--mute)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.btn.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
.lv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q{font-size:21px;line-height:1.55;font-weight:600;margin:8px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:19px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prog{height:12px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:.3s}
.fb{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);border:2px dashed var(--line);white-space:pre-line}
.hide{display:none}.opt{display:flex;align-items:center;gap:10px;text-align:left}.ol{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--text);font-weight:800;flex:none}.ov{flex:1;text-align:center}.opt.ok .ol{background:#fff;color:var(--ok)}.opt.no .ol{background:#fff;color:var(--bad)}button:disabled{opacity:.4;cursor:not-allowed}.mas{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.mi{font-size:34px;animation:bob 2s ease-in-out infinite}.bub{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;color:var(--mute)}.bub.good{border-color:var(--ok);color:var(--ok);font-weight:700}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@keyframes pop{50%{transform:scale(1.1)}}.opt.ok{animation:pop .4s}mark{background:#ffd54a;color:#1d2347;border-radius:4px;padding:0 4px;font-weight:800}.big{font-size:54px;text-align:center}.badge{display:inline-block;margin:4px;padding:6px 10px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}.badge.off{opacity:.35;filter:grayscale(1)}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[R(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number.isInteger(n)?n.toLocaleString("en-US"):String(+n.toFixed(2));
const RM=n=>"RM"+n.toFixed(2);
const p2=n=>String(n).padStart(2,"0");
let TFMT="ampm";const tf=m=>{const day=Math.floor(m/1440),mm=((m%1440)+1440)%1440,h=Math.floor(mm/60),mi=mm%60,h12=h%12||12,t=TFMT==="h24"?`${p2(h)}:${p2(mi)}`:TFMT==="cn"?`${h<12?"上午":"下午"} ${h12}:${p2(mi)}`:`${h12}:${p2(mi)} ${h<12?"a.m.":"p.m."}`;return t+(day>=1?"（第二天）":"")};
const hm=d=>((d>=60?Math.floor(d/60)+" 小时 ":"")+(d%60?d%60+" 分钟":"")).trim();
function mkS(q,ans,wr,exp,hint){const tr0=x=>typeof x==="string"?x.trim():x;ans=tr0(ans);wr=wr.map(tr0);let w=[...new Set(wr)].filter(x=>x!==ans);let k=1;while(w.length<3){const z="("+R(1,12)+", "+R(1,12)+")";if(z!==ans&&!w.includes(z))w.push(z)}return{q,ans,opts:sh([ans,...sh(w).slice(0,3)]),exp,hint}}
function mkN(q,a,ds,f,exp,hint){const s=new Set();sh(ds).forEach(d=>{[a+d,a-d].forEach(x=>{x=+x.toFixed(2);if(x>=0&&x!==a)s.add(x)})});let i=1;while(s.size<3){s.add(+(a+i*7).toFixed(2));i++}const w=sh([...s]).slice(0,3);return{q,ans:f(a),opts:sh([a,...w]).map(f),exp,hint}}
const id=n=>fmt(n);
const CL=["红","蓝","绿","黄"];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const simp=(n,d)=>{const g=gcd(n,d);return `${n/g}/${d/g}`};
const q2=x=>+x.toFixed(2);
const T0=[
{n:"整数与运算",e:"🪐",g:[
 L=>{const a=R(100000,499999),b=R(100000,499999);return mkN(`${fmt(a)} + ${fmt(b)} = ?`,a+b,[1,10,100],id,`逐位相加，满十进一。\n${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}`,"个位对齐，从个位开始加。")},
 L=>{const a=R(500000,999999),b=R(100000,499999);return mkN(`${fmt(a)} − ${fmt(b)} = ?`,a-b,[1,10,100],id,`逐位相减，不够减就向前一位借 1。\n${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}`,"不够减时，向左边借 1 当 10。")},
 L=>{const a=R(1200,9999),b=R(23,99);return mkN(`${fmt(a)} × ${b} = ?`,a*b,[10,100,a],id,`先算 ${fmt(a)} × ${b%10}，再算 ${fmt(a)} × ${Math.floor(b/10)*10}，最后相加。\n= ${fmt(a*b)}`,"把乘数拆成十位和个位，分开乘再加。")},
 L=>{const d=R(4,12),m=R(20,90),b=R(1000,9000),a=b+d*m,c=R(12,60);return mkN(`(${fmt(a)} − ${fmt(b)}) × ${c} ÷ ${d} = ?`,m*c,[10,100,c],id,`括号先算：${fmt(a)} − ${fmt(b)} = ${fmt(d*m)}\n再 × ${c} = ${fmt(d*m*c)}，最后 ÷ ${d} = ${fmt(m*c)}`,"有括号先算括号，乘除从左到右算。")}]},
{n:"分数小数百分比",e:"🍕",g:[
 L=>{const d=P([3,4,5,6,8,10,12]),k=R(1,d-1),t=d*R(12,60);return mkN(`${t} 的 ${k}/${d} 是多少？`,k*t/d,[k,t/d,10],id,`${t} ÷ ${d} = ${t/d}，再 × ${k} = ${k*t/d}`,"先除以分母，再乘分子。")},
 L=>{const p=P([15,35,45,60,75,85]),t=20*R(10,60);return mkN(`${fmt(t)} 的 ${p}% 是多少？`,p*t/100,[5,10,20],id,`${fmt(t)} × ${p} ÷ 100 = ${fmt(p*t/100)}`,"百分比就是分母为 100 的分数。")},
 L=>{let a,b,c,d,k,dd,k2,d2,x,p,v;do{dd=P([4,5,8,20,25]);k=R(1,dd-1);x=R(1,9);p=5*R(1,19);d2=P([3,4,5,8,10]);k2=R(1,d2-1);v=[k/dd,x/10,p/100,k2/d2]}while(new Set(v.map(z=>Math.round(z*1000))).size<4);
  const o=[`${k}/${dd}`,(x/10).toFixed(1),`${p}%`,`${k2}/${d2}`],mx=v.indexOf(Math.max(...v));return{q:"下面哪一个数最大？",ans:o[mx],opts:sh(o),exp:`全部化成小数：${o.map((s,i)=>s+" = "+q2(v[i])).join("，")}\n最大的是 ${o[mx]}`,hint:"把分数、百分比都化成小数再比较。"}},
 L=>{const d=P([2,4,5,10,20,25]),k=R(1,d-1),p=5*R(1,10),xp=R(1,9)*10,a=100*k/d,s=a+p+xp;return mkN(`${k}/${d} + ${p}% + ${xp/100} = ?（用百分比表示）`,s,[5,10,15],x=>fmt(x)+"%",`${k}/${d} = ${a}%，${xp/100} = ${xp}%\n${a}% + ${p}% + ${xp}% = ${s}%`,"先把每一项都化成百分比，再相加。")}]},
{n:"钱币",e:"💰",g:[
 L=>{const n=R(3,9),p=R(25,95)/2,tot=n*p,m=Math.ceil((tot+1)/50)*50;return mkN(`一件玩具 RM${fmt(p)}，买 ${n} 件，付了 RM${m}，应找回多少？`,m-tot,[.5,1,5],RM,`总价 ${n} × ${fmt(p)} = ${RM(tot)}\n找回 ${m} − ${fmt(tot)} = ${RM(m-tot)}`,"先求总价，再用付的钱减去总价。")},
 L=>{const p=20*R(5,50),d=P([10,15,20,25,30,40]),s=p*(100-d)/100;return mkN(`一部电话原价 RM${p}，打 ${d}% 折扣，折后价是多少？`,s,[2,5,10],RM,`折扣 = ${p} × ${d}% = ${RM(p*d/100)}\n折后价 = ${p} − ${fmt(p*d/100)} = ${RM(s)}`,"折后价 = 原价 × (100 − 折扣)%。")},
 L=>{const p=20*R(5,30),q=20*R(3,20),d=P([10,20,25,30,40,50]),e=P([10,20,25,30,40,50]),a=p*(100-d)/100,b=q*(100-e)/100;return mkN(`一件衬衫原价 RM${p}，打 ${d}% 折扣；一条裤子原价 RM${q}，打 ${e}% 折扣。两件一共要付多少？`,a+b,[5,10,20],RM,`衬衫 ${RM(a)}，裤子 ${RM(b)}\n共 ${RM(a+b)}`,"先分别算出两件的折后价，再相加。")},
 L=>{const t=100*R(10,80),r=P([2,3,4,5,6]),y=R(2,5),i=t*r*y/100;return mkN(`把 RM${fmt(t)} 存进银行，年利率 ${r}%，存 ${y} 年（单利）。到期时，本金和利息共多少令吉？`,t+i,[i/y,100,i/2],RM,`每年利息 = ${fmt(t)} × ${r}% = ${fmt(t*r/100)}\n${y} 年利息 = ${fmt(i)}\n本金 + 利息 = ${RM(t+i)}`,"利息 = 本金 × 利率 × 年数。")}]},
{n:"时间与时刻",e:"⏰",g:[
 L=>{const s=R(7,11)*60+5*R(0,11),d=5*R(36,84);return mkS(`从 ${tf(s)} 到 ${tf(s+d)}，经过了多长时间？`,hm(d),[hm(d+30),hm(d-30),hm(d+60)],`${tf(s+d)} − ${tf(s)} = ${hm(d)}`,"先算到整点，再算剩下的分钟。")},
 L=>{const s=R(6,16)*60+5*R(0,11),d=5*R(24,72),e=s+d;return mkS(`火车 ${tf(s)} 出发，行驶 ${hm(d)}，几点到站？`,tf(e),[tf(e+30),tf(e-30),tf(e+60)],`${tf(s)} + ${hm(d)} = ${tf(e)}`,"先加小时，再加分钟。")},
 L=>{const n=R(2,5),h=R(1,2),m=5*R(3,11),t=n*(h*60+m);return mkS(`每节课 ${h} 小时 ${m} 分钟，连续上 ${n} 节课，一共多长时间？`,hm(t),[hm(t+30),hm(t-30),hm(t+60)],`(${h} × 60 + ${m}) × ${n} = ${t} 分钟 = ${hm(t)}`,"先把每节课换成分钟，再乘节数。")},
 L=>{const s=R(19,22)*60+5*R(0,11),d=5*R(60,150),e=s+d;return mkS(`火车 ${tf(s)} 出发，行驶 ${hm(d)}，几点到站？（可能已经是第二天）`,tf(e),[tf(e+30),tf(e-30),tf(e+60)],`${tf(s)} + ${hm(d)}，过了晚上 12 点就是第二天，所以是 ${tf(e)}`,"过了半夜 12 点，就到了第二天。")}]},
{n:"测量",e:"📏",g:[
 L=>{const [b,s,u]=P([["km","m",1000],["kg","g",1000],["ℓ","mℓ",1000],["m","cm",100]]),x=R(101,999)/100,a=Math.round(x*u);return mkN(`${x} ${b} = 多少 ${s}？`,a,[10,100,u],v=>fmt(v)+" "+s,`1 ${b} = ${fmt(u)} ${s}，${x} × ${fmt(u)} = ${fmt(a)} ${s}`,"大单位换小单位要乘。")},
 L=>{const [b,s,u]=P([["km","m",1000],["kg","g",1000],["ℓ","mℓ",1000],["m","cm",100]]),v=u==1000?10*R(101,999):R(101,999),a=v/u;return mkN(`${fmt(v)} ${s} = 多少 ${b}？`,a,[.01,.1,1],x=>fmt(+x.toFixed(3))+" "+b,`${fmt(v)} ÷ ${fmt(u)} = ${fmt(a)} ${b}`,"小单位换大单位要除。")},
 L=>{const [b,s]=P([["km","m"],["kg","g"],["ℓ","mℓ"]]),a=R(2,9),x=50*R(2,18),c=50*R(2,18),add=R(0,1)==0,r=a*1000+x+(add?c:-c);return mkN(`${a} ${b} ${x} ${s} ${add?"+":"−"} ${c} ${s} = 多少 ${s}？`,r,[50,100,1000],v=>fmt(v)+" "+s,`${a} ${b} = ${fmt(a*1000)} ${s}，所以 ${fmt(a*1000)} + ${x} ${add?"+":"−"} ${c} = ${fmt(r)} ${s}`,`先把 ${b} 换成 ${s}。`)},
 L=>{const a=R(30,70),x=P([250,330,350,500,750]),n=R(10,Math.min(80,Math.floor(a*1000/x)-1));return mkN(`一桶油有 ${a} ℓ，倒进 ${n} 个瓶子里，每个瓶子装 ${x} mℓ。桶里还剩下多少 mℓ 的油？`,a*1000-n*x,[x,100,1000],v=>fmt(v)+" mℓ",`${a} × 1 000 − ${n} × ${x} = ${fmt(a*1000-n*x)} mℓ`,"先把 ℓ 换成 mℓ。")}]},
{n:"空间",e:"📦",g:[
 L=>{const l=R(12,48),w=R(8,35);return mkN(`长方形长 ${l} cm、宽 ${w} cm，面积是多少 cm²？`,l*w,[l,w,10],v=>fmt(v)+" cm²",`${l} × ${w} = ${l*w} cm²`,"面积 = 长 × 宽。")},
 L=>{const l=R(8,25),w=R(6,18),h=R(5,15);return mkN(`长方体长 ${l} cm、宽 ${w} cm、高 ${h} cm，体积是多少 cm³？`,l*w*h,[l*w,10,l*h],v=>fmt(v)+" cm³",`${l} × ${w} × ${h} = ${fmt(l*w*h)} cm³`,"体积 = 长 × 宽 × 高。")},
 L=>{const A=R(30,60),B=R(20,40),a=R(8,18),b=R(5,12);return mkN(`一块 ${A} cm × ${B} cm 的长方形纸板，剪掉一个 ${a} cm × ${b} cm 的长方形。剩下的面积是多少 cm²？`,A*B-a*b,[a*b,2*a*b,10],v=>fmt(v)+" cm²",`${A} × ${B} − ${a} × ${b} = ${fmt(A*B-a*b)} cm²`,"总面积减去被剪掉的面积。")},
 L=>{const a=R(40,100),b=R(30,80),c=10*R(3,6),V=a*b*c,x=R(5,Math.floor(V/1000)-5);return mkN(`长方体水箱长 ${a} cm、宽 ${b} cm、高 ${c} cm，里面已有 ${x} ℓ 水。水箱还可以再装多少 ℓ 水？（1 ℓ = 1 000 cm³）`,q2(V/1000-x),[.5,1,5],v=>fmt(v)+" ℓ",`容量 ${a} × ${b} × ${c} = ${fmt(V)} cm³ = ${fmt(V/1000)} ℓ\n${fmt(V/1000)} − ${x} = ${fmt(q2(V/1000-x))} ℓ`,"先求体积，再换成 ℓ。")}]},
{n:"坐标比与比例",e:"🧭",g:[
 L=>{const x=R(3,9),y=R(3,9),r=R(1,6),u=R(1,6),l=R(1,Math.min(x+r-1,5)),d=R(1,Math.min(y+u-1,5)),ex=x+r-l,ey=y+u-d;return mkS(`点 A 在 (${x}, ${y})，先向右移 ${r} 格、向上移 ${u} 格，再向左移 ${l} 格、向下移 ${d} 格。新的坐标是？`,`(${ex}, ${ey})`,[`(${ey}, ${ex})`,`(${x+r+l}, ${y+u+d})`,`(${x+r-l}, ${y+u+d})`],`x：${x} + ${r} − ${l} = ${ex}；y：${y} + ${u} − ${d} = ${ey}`,"向右、向左改变 x；向上、向下改变 y。")},
 L=>{const [p,q]=P([[3,4],[5,6],[4,7],[7,9],[5,8],[9,11],[7,12]]),g=R(3,15);return mkS(`把比 ${g*p} : ${g*q} 化成最简比。`,`${p} : ${q}`,[`${q} : ${p}`,`${p+1} : ${q}`,`${p} : ${q+1}`],`两个数同时 ÷ ${g}：${p} : ${q}`,"找出两个数的最大公因数，同时除。")},
 L=>{const [p,q]=P([[2,3],[3,5],[3,4],[5,7],[4,9]]),k=R(6,30);return mkN(`红珠与蓝珠的比是 ${p} : ${q}，红珠有 ${p*k} 颗。红珠和蓝珠共有多少颗？`,(p+q)*k,[k,q*k,10],id,`${p*k} ÷ ${p} = ${k}（每份），蓝珠 ${k} × ${q} = ${q*k}\n共 ${p*k} + ${q*k} = ${(p+q)*k}`,"先求每一份是多少。")},
 L=>{const [p,q]=P([[2,3],[3,5],[3,4],[2,5],[4,7]]),k=R(6,40);return mkN(`红笔与蓝笔的比是 ${p} : ${q}，蓝笔比红笔多 ${(q-p)*k} 支。红笔和蓝笔一共有多少支？`,(p+q)*k,[k,(q-p)*k,10],id,`相差 ${q-p} 份 = ${(q-p)*k} 支，每份 ${k} 支\n共 ${p+q} 份 = ${(p+q)*k} 支`,"相差的支数对应相差的份数。")}]},
{n:"数据处理",e:"📊",g:[
 L=>{let M=R(40,90),o,l;do{o=[R(-20,20),R(-20,20),R(-20,20),R(-20,20),R(-20,20)];l=-o.reduce((a,b)=>a+b)}while(Math.abs(l)>25);const v=sh([...o,l].map(x=>M+x));return mkN(`数据：${v.join("，")}。平均数是多少？`,M,[1,2,5],id,`总和 ${v.reduce((a,b)=>a+b)} ÷ 6 = ${M}`,"平均数 = 总和 ÷ 个数。")},
 L=>{const M=R(45,90),a=M+R(-12,12),b=M+R(-12,12),c=M+R(-12,12),d=M+R(-12,12),s=a+b+c+d;return mkN(`五位同学的平均分是 ${M} 分，其中四位分别得 ${a}、${b}、${c}、${d} 分。第五位同学得多少分？`,5*M-s,[1,2,5],id,`总分 ${M} × 5 = ${5*M}；${5*M} − ${s} = ${5*M-s}`,"先用平均数 × 个数求出总和。")},
 L=>{let a,b,x,y;do{a=R(10,20);b=R(10,20);x=R(60,85);y=R(60,85)}while((a*x+b*y)%(a+b)!==0);return mkN(`甲组 ${a} 人平均 ${x} 分，乙组 ${b} 人平均 ${y} 分。两组合起来，平均每人多少分？`,(a*x+b*y)/(a+b),[1,2,3],id,`(${a} × ${x} + ${b} × ${y}) ÷ (${a} + ${b}) = ${(a*x+b*y)/(a+b)}`,"先分别求出两组的总分。")},

 ()=>{const n=6*R(10,40);return WQ(`同学掷一粒骰子 ${n} 次。大约有多少次出现偶数，多少次出现大于 4 的数？这两种结果的次数大约相差多少次？`,[n/6*3,n/6*2,n/6],"次",`综合算式：${n} ÷ 6 × 3 − ${n} ÷ 6 × 2 = ${n/6}`)},
 ()=>{const r=R(8,15),x=R(2,6),b=R(5,10),y=R(2,5),tt=r-x+b+y,n=tt*R(4,12);return WQ(`袋中原有 ${r} 个红球和 ${b} 个蓝球，取走 ${x} 个红球，再放入 ${y} 个蓝球。从袋中取一个球，记下颜色再放回，共取 ${n} 次，大约有多少次取到红球？`,[r-x,tt,n/tt*(r-x)],"次",`综合算式：${n} ÷ (${r} − ${x} + ${b} + ${y}) × (${r} − ${x}) = ${n/tt*(r-x)}`)}]
];
const NW=12;const CAPW=[12, 12, 12, 12, 12, 12, 12, 12, 12];const LIMW=[3, 3, 3, 3, 3, 3, 3, 3, 3];const NWT=u=>Math.min(NW,CAPW[u]!=null?CAPW[u]:NW);
const WKEY="m5_wp";
const getW=()=>{try{return JSON.parse(localStorage.getItem(WKEY)||"[]")}catch(e){return[]}};
const setW=a=>{try{localStorage.setItem(WKEY,JSON.stringify(a))}catch(e){}};
S.wpStars={};let WS=null;
function wpHome(){clearInterval(timer);
 app.innerHTML=`<button class="btn alt" onclick="home()">← 返回</button><h1>📝 应用题</h1>
 <div class="card"><b>怎么做：</b>先读题，圈出<mark>重点字</mark>，想一想怎么算，再把答案写进空格里。每个单元最多 ${NW} 题，每题有 2 次机会。<br>需要帮忙时可以点「💡 提示」，但提示不会直接告诉你算式哦！<br><small style="color:var(--mute)">重点字：共 / 总共 / 一共 / 相差 / 差 / 原有 / 平分 / 平均</small></div>
 <div class="grid">${T.map((t,i)=>`<button class="planet" onclick="wpStart(${i})"><span class="e">${t.e}</span><b>${t.n}</b><br><small>${"⭐".repeat(S.wpStars[i]||0)||"尚未挑战"}</small></button>`).join("")}</div>`}
function wpStart(t){WS={t,i:0,ok:0,pts:0,qs:[],wrongs:[]};const used=new Set(),n=WG[t].length;let tr=0,order=[];
 const need=NWT(t),lim=LIMW[t]!=null?LIMW[t]:3,cnt={},ansS=new Set();while(WS.qs.length<need&&tr<4000){if(!order.length)order=sh([...Array(n).keys()]);const q=addPicW(WG[t][order.pop()]());tr++;const kk=q.q+"|"+(q.pic||""),m=TMPL(q),aa=m+"=>"+QANS(q);if(used.has(kk)||ansS.has(aa)||(cnt[m]||0)>=lim)continue;used.add(kk);ansS.add(aa);cnt[m]=(cnt[m]||0)+1;WS.qs.push(q)}WS.n=WS.qs.length;wpShow()}
function wpShow(){const q=WS.qs[WS.i];WS.tries=0;WS.hint=0;WS.done=false;
 app.innerHTML=`<div class="bar"><button class="btn alt" onclick="wpHome()">✕ 退出</button><span class="pill">${T[WS.t].e} ${T[WS.t].n}</span><span class="pill">🏆 ${WS.pts}</span></div>
 <div class="prog" style="margin:10px 0"><i style="width:${WS.i/WS.n*100}%"></i></div>
 <div class="card"><small style="color:var(--mute)">第 ${WS.i+1} / ${WS.n} 题</small><div class="mas"><span class="mi">🚀</span><div class="bub" id="mt">${P(TIPS)}</div></div><div class="q">${hl(q.q)}</div>${q.pic||""}
 <div style="margin:14px 0;font-weight:800;font-size:20px">答：<input id="wpa" inputmode="decimal" style="width:130px;text-align:center;font-size:20px"> ${q.u}</div>
 <p><button class="btn alt" id="wph" onclick="wpHint()">💡 提示（得分减半）</button> <button class="btn" id="wpc" onclick="wpCheck()">检查答案 ✔</button></p><div id="fb" class="fb hide"></div><p id="nx"></p></div>`;
 const e=document.getElementById("wpa");e.addEventListener("keydown",ev=>{if(ev.key==="Enter")wpCheck()});e.focus()}
const TIPS=["仔细读题，看看图！","慢慢来，你可以的！","先想一想，再选答案。","图里有线索哦，找找看！"],CHEER=["太棒了！","你真聪明！","答对啦，继续加油！","哇，好厉害！"],COMFORT=["没关系，看看讲解，下次一定行！","错了也没关系，我们一起学！"];
function mas(t,ok){const e=document.getElementById("mt");if(e){e.textContent=t;e.className="bub"+(ok?" good":"")}}
function burst(n){if(typeof document.createElement!=="function"||!document.body)return;const w=document.createElement("div");w.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:50";for(let i=0;i<n;i++){const s=document.createElement("span");s.textContent=P(["⭐","🎉","✨","🎈","🌟"]);s.style.cssText=`position:absolute;left:${R(0,96)}%;top:-30px;font-size:${R(18,34)}px;animation:fall ${R(18,34)/10}s ease-in forwards;animation-delay:${R(0,8)/10}s`;w.appendChild(s)}document.body.appendChild(w);setTimeout(()=>w.remove(),4400)}

function gateStep(){const b=document.getElementById("gok");if(b)b.disabled=false}

const BACKL=/claude/i.test(location.hostname)?"":`<a class="pill" href="index.html" style="text-decoration:none;display:inline-block">🏠 回到主目录</a>`;
document.addEventListener("keydown",e=>{if(typeof G==="undefined"||!G||G.ans||e.ctrlKey||e.metaKey||e.altKey)return;const tg=document.activeElement&&document.activeElement.tagName;if(tg==="INPUT"||tg==="TEXTAREA")return;const k="abcd".indexOf((e.key||"").toLowerCase());if(k>=0&&document.querySelectorAll(".opt:not([disabled])").length>k)ans(k)});
function say(h){const f=document.getElementById("fb");f.classList.remove("hide");f.innerHTML=h}
function wpHint(){if(WS.done)return;const q=WS.qs[WS.i];WS.hint++;const kw=kwOf(q.q);
 if(WS.hint==1)say(kw.length?"💡 重点字提示：<br>"+kw.map(w=>`<mark>${w[0]}</mark> ${w[1]}`).join("<br>"):"💡 先读清楚题目：问的是什么？已经知道什么？");
 else say(`💡 这题要经过 ${q.s.length} 个运算步骤。想一想：要先求出什么，再求什么？有括号的部分要先算。`)}
function wpCheck(){if(WS.done)return;const q=WS.qs[WS.i],e=document.getElementById("wpa"),raw=e.value.trim();
 if(!raw)return say("✏️ 请先把答案写进空格里哦！");const v=parseFloat(raw.replace(/,/g,"")),a=q.s[q.s.length-1][1];WS.tries++;
 if(Math.abs(v-a)<0.005){const pts=Math.round((WS.tries==1?10:5)/(WS.hint?2:1));WS.pts+=pts;S.score+=pts;WS.ok++;WS.done=true;e.disabled=true;e.style.background="var(--ok)";e.style.color="#fff";
  say(`🎉 答对了！+${pts} 分<br>${q.e}`);mas(P(CHEER),1);burst(12);fin()}
 else if(WS.tries==1){e.style.borderColor="var(--bad)";say("再想一想～检查一下重点字和运算顺序，还有一次机会！💪")}
 else{WS.done=true;WS.wrongs.push(q);e.disabled=true;e.style.background="var(--bad)";e.style.color="#fff";say(`没关系！<b>正确答案：${fmt(a)} ${q.u}</b><br>${q.e}`);fin()}}
function fin(){document.getElementById("wpc").classList.add("hide");document.getElementById("wph").classList.add("hide");document.getElementById("nx").innerHTML=`<button class="btn" onclick="wpNext()">${WS.i<WS.n-1?"下一题 →":"查看成绩 🏁"}</button>`}
function wpNext(){WS.i++;WS.i>=WS.n?wpEnd():wpShow()}
function wpEnd(){const ok=WS.ok,r=ok/WS.n,s=r>=1?3:r>=.8?2:r>=.6?1:0;S.wpStars[WS.t]=Math.max(S.wpStars[WS.t]||0,s);
 const rc={n:S.name,t:WS.t,ok,N:WS.n,pts:WS.pts,ts:Date.now()};const a=getW();a.push(rc);setW(a);const cd=[rc.n,"WP",rc.t,ok,WS.n,rc.pts,rc.ts].join("|");
 app.innerHTML=`<div class="card"><div class="big">${["🌱","⭐","⭐⭐","⭐⭐⭐"][s]}</div><h2 style="text-align:center">${ok==WS.n?"全对！太厉害了！":r>=.6?"做得好！":"继续加油！"}</h2>
 <p style="text-align:center">👤 ${S.name} · ${T[WS.t].n}应用题<br>答对 <b>${ok}/${WS.n}</b> 题 · 本次得分 <b>${WS.pts}</b> · 总分 <b>${S.score}</b></p><div class="prog"><i style="width:${r*100}%"></i></div>
 ${WS.wrongs.length?`<details><summary><b>📝 要再练习的题（点开看）</b></summary>${WS.wrongs.map(q=>`<div class="fb" style="margin:6px 0">${hl(q.q)}${q.pic||""}<br>${q.e}</div>`).join("")}</details>`:"<p>🎯 没有错题！</p>"}
 <p><a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${formURL(cd)}" onclick="gateStep()">📤 提交成绩给老师</a><br><small>点按钮后，在表单页面按「提交」。如果打不开，请复制下面的成绩代码发给老师。</small></p><p><small>📋 成绩代码（请复制发给老师）：</small><br><input readonly value="${cd}" onclick="this.select()" style="width:100%"></p><p><button class="btn alt" id="gcp" onclick="copyCode('${cd}')">📋 复制成绩代码</button></p><p id="gate" class="fb">请先提交成绩：<br>① 点「📤 提交成绩给老师」，在表单页面按「提交」；<br>② 回到这里，点下面的「✅ 我已经提交了」，才能继续玩。<br>（打不开表单？请点「复制成绩代码」，发给老师后再点「我已经提交了」。）<br><button class="btn" id="gok" disabled onclick="gateUnlock()">✅ 我已经提交了</button></p>

function impWP(p){const r={n:p[0],t:+p[2],ok:+p[3],N:+p[4],pts:+p[5],ts:+p[6]};if(!ROSTER.includes(r.n)||[r.t,r.ok,r.N,r.pts,r.ts].some(isNaN)||!T[r.t]||r.N<1||r.ok<0||r.ok>r.N)return false;const a=getW();if(a.some(x=>x.n===r.n&&x.ts===r.ts))return false;a.push(r);setW(a);return true}
function wpCard(){const A=getW();const rows=ROSTER.map(n=>{const a=A.filter(x=>x.n===n);if(!a.length)return `<tr><td>${n}</td><td colspan="4" style="color:var(--mute)">尚未游玩</td></tr>`;
 const pc=z=>Math.round(z.reduce((s,x)=>s+x.ok,0)/z.reduce((s,x)=>s+x.N,0)*100);let wk="–",wa=101;T.forEach((t,i)=>{const z=a.filter(x=>x.t===i);if(z.length&&pc(z)<wa){wa=pc(z);wk=t.n+" "+wa+"%"}});
 return `<tr><td><b>${n}</b></td><td>${a.length}次</td><td>${pc(a)}%</td><td>${a.reduce((s,x)=>s+x.pts,0)}</td><td>${wk}</td></tr>`}).join("");
 return `<div class="card" style="overflow-x:auto"><b>📝 应用题成绩</b><table style="border-collapse:collapse;min-width:480px;text-align:center;font-size:14px;margin-top:6px"><tr style="color:var(--mute)"><th>学生</th><th>次数</th><th>完全答对率</th><th>总分</th><th>最弱单元</th></tr>${rows}</table></div>`}
