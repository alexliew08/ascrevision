'use strict';
const DATA = [{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":1,"instr":"把适当的词语填在横线上。","bank":["柴火","煤气","开斋节","不宜","燃烧"],"items":[{"n":1,"text":"_____________来临前，大街小巷都会出现许多摆卖食物的探望摊位。"},{"n":2,"text":"露天____________垃圾会造成严重的空气污染。"},{"n":3,"text":"奶奶小时住在乡下，当时没有煤气，都是燃烧____________来煮饭的。"},{"n":4,"text":"我国常年夏天，所以____________种植苹果和橙子。"},{"n":5,"text":"随着时代的进步，电子炉逐渐取代____________炉。"}],"ans":["开斋节","燃烧","柴火","不宜","煤气"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":2,"instr":"把适当的词语填在横线上。","bank":["砍","唇齿留香","粘","则","浓香扑鼻"],"items":[{"n":1,"text":"那棵枯树摇摇欲坠，爸爸便将它____________了下来。"},{"n":2,"text":"小熊偷吃蜂蜜时____________得满脸都是，结果被蜜蜂穷追不舍。"},{"n":3,"text":"打开棕叶，粽子____________，让人迫不及待地大咬一口。"},{"n":4,"text":"榴莲的味道浓郁，吃完之后____________。"},{"n":5,"text":"有些人喜欢吃白米饭，有些人____________喜欢吃糙米饭。"}],"ans":["砍","粘","浓香扑鼻","唇齿留香","则"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":3,"instr":"把适当的词语填在横线上。","bank":["辛辣","而且","辣椒","价钱","负担"],"items":[{"n":1,"text":"弟弟因为受不了咖喱____________的味道，所以吃印度甩饼时都是沾白糖吃。"},{"n":2,"text":"妈妈把____________剁碎后，用来炒一道香辣虾。"},{"n":3,"text":"姐姐的性情温顺____________心地善良。"},{"n":4,"text":"夜市集里卖的物品琳琅满目，而且____________合理，深受大众的欢迎。"},{"n":5,"text":"父母因为____________不起哥哥出国留学的费用，所以哥哥选择在国内深造。"}],"ans":["辛辣","辣椒","而且","价钱","负担"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":4,"instr":"把适当的词语填在横线上。","bank":["宾客","婚宴","著名","宴会","柴火"],"items":[{"n":1,"text":"我和家人盛装出席表哥的____________。"},{"n":2,"text":"今年是爷爷八十岁诞辰，家人决定为爷爷举行盛大的生日____________。"},{"n":3,"text":"宴会的主人站在门口迎接到来的____________。"},{"n":4,"text":"椰浆饭和沙爹是我国____________的美食。"},{"n":5,"text":"奶奶习惯用____________煮开水。"}],"ans":["婚宴","宴会","宾客","著名","柴火"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":5,"instr":"把适当的词语填在横线上。","bank":["不宜","负担","辛辣","席子","价钱"],"items":[{"n":1,"text":"妹妹迟到____________的咖喱，嘴唇又红又肿。"},{"n":2,"text":"我们把食物放在____________上，然后迫不及待投入大海的怀抱。"},{"n":3,"text":"由于经济不好，林叔叔无法____________孩子升大学的费用。"},{"n":4,"text":"哥哥有哮喘病，____________做激烈的运动。"},{"n":5,"text":"那家百货市场的物品应有尽有，而且____________也便宜。"}],"ans":["辛辣","席子","负担","不宜","价钱"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":6,"instr":"选出正确的词语，填在句子的横线上。","bank":[],"items":[{"n":1,"text":"志明每天都会帮父母做家务，以减轻他们的（负担，分担）。"},{"n":2,"text":"妈妈煮的咖喱（浓密，浓香）扑鼻，我远远地就闻到了这股诱人的味儿。"},{"n":3,"text":"云顶高原是我国（著名，著作）的旅游胜地，每年都有成千上万的游客到哪里游玩。"},{"n":4,"text":"奶奶用（火柴，柴火）烧烤鸡翅。"},{"n":5,"text":"妹妹把（火柴，柴火）排成星星的形状。"}],"ans":["负担","浓香","著名","柴火","火柴"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":7,"instr":"把适当的词语填在横线上。","bank":["婚宴","燃烧","著名","负担"],"items":[{"n":1,"text":"昨天晚上，妈妈带我到酒店参加表哥的____________。"},{"n":2,"text":"黑风洞是吉隆坡____________的景点，吸引很多游客前来。"},{"n":3,"text":"乡下的奶奶每次煮饭时都要____________柴火。"},{"n":4,"text":"椰浆饭是马来西亚____________的国民美食。"},{"n":5,"text":"竹筒饭经济便宜，一般民众都____________得起。"}],"ans":["婚宴","著名","燃烧","著名","负担"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":8,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"（燃料，燃烧）了一个月的大火终于被扑灭了。"},{"n":2,"text":"为了晚上的营火会，舅舅早上就上山去砍柴当（火柴，柴火）。"},{"n":3,"text":"自从有了电子炉，鲜少有人用（煤气，煤油）。"},{"n":4,"text":"我们要保护环境，不能随意（砍伐，砍价）树木。"},{"n":5,"text":"《静夜思》是唐代诗人李白最（著名，著者）的诗句之一。"}],"ans":["燃烧","柴火","煤气","砍伐","著名"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":9,"instr":"把适当的词语填在横线上。","bank":["浓香扑鼻","粘","开斋节","不宜用","唇齿留香"],"items":[{"n":1,"text":"每逢____________，邻居会邀请我们到家做客。"},{"n":2,"text":"泡脚有禁忌，例如儿童____________过热的水来泡脚。"},{"n":3,"text":"一不留神，麦芽糖就____________在一块了。"},{"n":4,"text":"妈妈今天煮的饭菜，真是____________，让好久没回家的哥哥都流口水了。"},{"n":5,"text":"别看榴莲表面很多硬刺，果肉可让人____________呢！"}],"ans":["开斋节","不宜用","粘","浓香扑鼻","唇齿留香"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":10,"instr":"把适当的词语填在横线上。","bank":["而且","则","价钱","辛辣","负担"],"items":[{"n":1,"text":"有些人喜欢吃冰激凌，有些人____________喜欢吃蛋糕。"},{"n":2,"text":"这一家店的韩国炸鸡，真的是好____________，让人一口接一口不停地喝水。"},{"n":3,"text":"润润不只班上第一，____________运动比赛还得冠军呢！"},{"n":4,"text":"这里新开的餐厅有做促销，____________比别的餐厅便宜了一半。"},{"n":5,"text":"雷拉每天放学后都会去餐厅打零工，以减轻家庭的____________。"}],"ans":["则","辛辣","而且","价钱","负担"]},{"u":11,"unit":"舌尖上的美味","lesson":"（一）竹筒饭","no":11,"instr":"把适当的词语填在横线上。","bank":["闭上","婚宴","砍下","宾客","辛辣"],"items":[{"n":1,"text":"隔壁邻居今天上午举 ______下，校园的各个角落都打扫得干干净净。"},{"n":5,"text":"____________的战士获得全国人民的尊重与爱戴。"}],"ans":["棕狗","所逼","教训","努力","英勇"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":3,"instr":"把适当的词语填在横线上。","bank":["弓","褪色","婴儿鞋","炮弹","轰走"],"items":[{"n":1,"text":"王大哥看见酒杯里有一条蛇，其实那是挂在墙上的____________的倒影。"},{"n":2,"text":"两国在战争中发射的____________造成了许多建筑物被摧毁。"},{"n":3,"text":"小狗吠了一声，把院子里的乌鸦都____________了。"},{"n":4,"text":"这种布料虽然有点贵，但是却不容易____________。"},{"n":5,"text":"外婆给我刚出世的妹妹买了两双____________。"}],"ans":["弓","炮弹","轰走","褪色","婴儿鞋"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":4,"instr":"把适当的词语填在横线上。","bank":["教训","心花怒放","哑然失笑","梯级","你争我抢"],"items":[{"n":1,"text":"小明的嘴巴甜，几句话就把奶奶哄得____________。"},{"n":2,"text":"弟弟下楼梯时不小心，结果从____________上摔了下来。"},{"n":3,"text":"我和兄弟姐妹相亲相爱，玩玩具时从来没有____________的现象。"},{"n":4,"text":"三岁儿子那拙劣的表演，令父亲____________。"},{"n":5,"text":"我们要从错误中吸取____________，改进自己。"}],"ans":["心花怒放","梯级","你争我抢","哑然失笑","教训"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":5,"instr":"把适当的词语填在横线上。","bank":["退休","褪色","英勇","抢答","鞭炮"],"items":[{"n":1,"text":"马老师今年____________了，同学们都不舍得她。"},{"n":2,"text":"那名____________的兵士为国家奋斗，值得大家学习。"},{"n":3,"text":"除夕夜里，____________声此起彼伏，连绵不断。"},{"n":4,"text":"那个流浪汉在垃圾桶里找到一只____________的皮鞋。"},{"n":5,"text":"今天上华文课时，老师让我们玩____________游戏"}],"ans":["退休","英勇","鞭炮","褪色","抢答"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":6,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"最近弟弟沉迷于电脑游戏，学习上（退步，褪去）很严重。"},{"n":2,"text":"明星（退步，褪去）闪耀的光环之后，也是一个普普通通的人。"},{"n":3,"text":"哥哥（怒气，努力）冲冲地甩门出去了。"},{"n":4,"text":"我们要从小（努力，怒气）学习，将来报效祖国。"},{"n":5,"text":"一棵小草顽强地从石头的（裂缝，裂开）中冒出来。"}],"ans":["退步","褪去","怒气","努力","裂缝"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":7,"instr":"把适当的词语填在横线上。","bank":["退休","裂开","箩筐","派","捡起"],"items":[{"n":1,"text":"爷爷____________了，在家过着舒适的生活。"},{"n":2,"text":"这个____________虽然很小，但是能装很多东西。"},{"n":3,"text":"婶婶掉了满地的水果，幸好热心的路人帮忙____________。"},{"n":4,"text":"天气太寒冷了，我的嘴唇要____________了。"},{"n":5,"text":"经理____________了这个星期的任务给我们处理。"}],"ans":["退休","箩筐","捡起","裂开","派"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":8,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"铭豪长得很帅，（棕毛，棕色）的眼睛和头发，大家都喜欢他。"},{"n":2,"text":"蜡人馆里的人像实在是太（逼真，逼供）了，让人怀疑自己的眼睛。"},{"n":3,"text":"我们要从错误中吸取（教训，训话），避免以后重犯类似的错误。"},{"n":4,"text":"你一定要（努嘴，努力）学习，不辜负老师的教导。"},{"n":5,"text":"（英俊，英勇）的兵士守护国家的安全。"}],"ans":["棕色","逼真","教训","努力","英勇"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":9,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"亚马逊人擅用于长矛和（弓箭，宫廷）。"},{"n":2,"text":"敌军发射（火炮弹，鞭炮）炸毁了指挥台，一些士兵也不幸被炸伤了。"},{"n":3,"text":"天空（轰隆隆，轰炸）的一声，突然打了一声响雷，接着开始下起倾盆大雨来。"},{"n":4,"text":"那件（褪色，退步）的衣服已经穿了很多年。"},{"n":5,"text":"叶伟在巴士里主动把位子让给一位抱着（婴儿，长辈）的妇女。"}],"ans":["弓箭","火炮弹","轰隆隆","褪色","婴儿"]},{"u":16,"unit":"童话故事会","lesson":"（一）退休的鞋子","no":10,"instr":"把适当的词语填在横线上。","bank":["心花怒放","哑然失笑","梯级","教训","抢"],"items":[{"n":1,"text":"巧儿绘画比赛得到第一名， 她高兴得____________。"},{"n":2,"text":"黑风洞著名的 272____________在去年时已经换上了七彩色。"},{"n":3,"text":"大卖场为了____________生意，推出超便宜优惠，吸引了很多顾客。"},{"n":4,"text":"方杰不小心错穿了爸爸的衬衫，弟弟看了不禁____________。"},{"n":5,"text":"他从这次的事件中吸取____________，决心改掉懒散的坏习惯。"}],"ans":["心花怒放","梯级","抢","哑然失笑","教训"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":1,"instr":"把适当的词语填在横线上。","bank":["吩咐","墨水","嘱咐","亚军","一篇"],"items":[{"n":1,"text":"妈妈出门前，再三____________我锁好门窗，不要开门给陌生人。"},{"n":2,"text":"今天是开学的第一天，老师____________同学们要好好学习，天天向上。"},{"n":3,"text":"老师今天给我们布置了一份作业——写____________有关友情的文章。"},{"n":4,"text":"米克先生签名时，不小心把____________溅到合同上，秘书只好重新打印一份新合同。"},{"n":5,"text":"我在这次比赛中获得了____________，我会再接再厉，向冠军宝座迈进。"}],"ans":["吩咐","嘱咐","一篇","墨水","亚军"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":2,"instr":"把适当的词语填在横线上。","bank":["一副","后肘","成绩","后悔","念头"],"items":[{"n":1,"text":"自从子康考获第一名后，便____________自以为了不起的样子。"},{"n":2,"text":"那个小偷因为一时贪心的____________而入门偷窃，结果被捉到关进了牢房。"},{"n":3,"text":"吃饭时，坐在我旁边的弟弟不小心用____________碰了我一下，结果我喝到一半的汤便洒了出来。"},{"n":4,"text":"弟弟因为没有听妈妈的劝而摔断了腿，____________不已。"},{"n":5,"text":"妈妈对我这次的考试____________很满意。"}],"ans":["一副","念头","后肘","后悔","成绩"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":3,"instr":"把适当的词语填在横线上。","bank":["优良","曾经","心烦","清楚","悲哀"],"items":[{"n":1,"text":"我们要____________的中华传统一代一代地传承下去。"},{"n":2,"text":"哥哥以前很爱说话，我真不____________他如今为什么变得沉默寡言了。"},{"n":3,"text":"这个地方____________闹过水灾，所以很多村民都搬走了。"},{"n":4,"text":"看着新闻里灾民们流离失所的____________样子，让人忍不住流下了眼泪。"},{"n":5,"text":"虽然妈妈每天都要处理家里的许多琐碎事务，却一点都不觉得____________。"}],"ans":["优良","清楚","曾经","悲哀","心烦"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":4,"instr":"把适当的词语填在横线上。","bank":["拳头","罚","和蔼","检讨","吩咐"],"items":[{"n":1,"text":"弟弟第一次上台演讲，感到很紧张，____________握得紧紧的。"},{"n":2,"text":"每当看见奶奶慈祥 ____________的笑容，我就觉得自己很幸福。"},{"n":3,"text":"老板要求员工们____________工作中的失误，并从中探索解决方案。"},{"n":4,"text":"弟弟因为浪费食物，所以被妈妈____________站在角落面壁四过。"},{"n":5,"text":"林老师____________我把练习簿搬到办公室。"}],"ans":["拳头","和蔼","检讨","罚","吩咐"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":5,"instr":"把适当的词语填在横线上。","bank":["不安","和蔼","把脸一沉","心烦","亚军"],"items":[{"n":1,"text":"邻居家的老奶奶是一个____________可亲的老人。"},{"n":2,"text":"街道上，车辆的鸣笛此起彼落，令人____________。"},{"n":3,"text":"我忐忑____________地跟着班长走进教师的办公室。"},{"n":4,"text":"爸爸____________，弟弟吓得立刻把地上的玩具收起来。"},{"n":5,"text":"表姐在舞蹈比赛中获得了____________，她开心极了。"}],"ans":["和蔼","心烦","不安","把脸一沉","亚军"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":6,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"志成（反悔，后悔）刚才责骂妹妹，所以立刻向她道歉。"},{"n":2,"text":"这里的景色太美了，让大家都没有想回家的（念旧，念头）。"},{"n":3,"text":"向杰不但成绩（优良，优美），在课外活动方面也表现出色。"},{"n":4,"text":"弟弟因贪玩而把花瓶打破了，妈妈要他好好（检查，检讨）。"},{"n":5,"text":"啄木鸟是森林的医生，也是虫子的（天敌，敌视）。"}],"ans":["后悔","念头","优良","检讨","天敌"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":7,"instr":"把适当的词语填在横线上。","bank":["把脸一沉","不安","后悔","悲哀","心烦"],"items":[{"n":1,"text":"爸爸知道哥哥又在外面闹事，他____________，什么话也没说，独自在房间里生闷气。"},{"n":2,"text":"爷爷常说他这一辈子最____________的事就是小时候没有好好读书。"},{"n":3,"text":"一想起即将面临考试，我就____________。"},{"n":4,"text":"听到那孩子不幸的消息，我心里很____________。"},{"n":5,"text":"老乞丐为自己一生悲惨的遭遇感到____________。"}],"ans":["把脸一沉","后悔","心烦","不安","悲哀"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":8,"instr":"把适当的词语填在横线上。","bank":["墨水","一副","吩咐","亚军","一篇"],"items":[{"n":1,"text":"由于游乐场很多人，因此爸爸____________我们不要到处乱跑。"},{"n":2,"text":"老师让我们每日写____________观察日记，这有助于我们观察能力和写作能力。"},{"n":3,"text":"明真打翻了一瓶____________，弄脏同学的衣服。"},{"n":4,"text":"吴明和陈明在羽球比赛中经过一番苦战后，终于分出了冠____________。"},{"n":5,"text":"屋外的那个人____________慌慌张张的脸，很可疑，还是不要开门比较好。"}],"ans":["吩咐","一篇","墨水","亚军","一副"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":9,"instr":"把适当的词语填在横线上。","bank":["后悔","念头","成绩","后肘","优良"],"items":[{"n":1,"text":"因为土崩，爸爸打消了去福隆港的____________。"},{"n":2,"text":"警方提醒，手肘是身体最有力的部位，要是遇到危险，就善用____________。"},{"n":3,"text":"他一时失误造成严重意外，现在____________极了。"},{"n":4,"text":"马克以优异的____________从著名大学毕业，全家人都高兴不已。"},{"n":5,"text":"我们要保持中华民族的____________传统，并且把它发扬光大。"}],"ans":["念头","后肘","后悔","成绩","优良"]},{"u":17,"unit":"真正的友情","lesson":"（一）争吵","no":10,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"你把缺课的原因向老师说（清楚，凄楚），不然老师会以为你无故旷课。"},{"n":2,"text":"奶奶因交通事故突然过世，美怡失去了至亲，感到很（悲哀，悲求）。"},{"n":3,"text":"手指里的小鸡还不到一个（拳头，拳术）大，毛茸茸的，整天都在院子里面东奔西跑。"},{"n":4,"text":"黄老师虽然不苟言笑，却是个很（蔼然，和蔼）的人。"},{"n":5,"text":"他深刻地（检验，检讨）了自己的错误，并决心吸取这个沉痛的教训。"}],"ans":["清楚","悲哀","拳头","和蔼","检讨"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":1,"instr":"把适当的词语填在横线上。","bank":["压力","高峰","沃土","秩序井然","鞭打"],"items":[{"n":1,"text":"这种玻璃的抗____________很强，即使用锤子敲打也不易破碎。"},{"n":2,"text":"学校禁止老师____________或体罚学生。"},{"n":3,"text":"成功登上世界第一____________——珠穆朗玛峰的登山队都会在峰顶插上国家的旗帜。"},{"n":4,"text":"国庆当天，____________的游行队伍缓缓前行。"},{"n":5,"text":"要把荒地变成____________，首先要给土地施肥。"}],"ans":["压力","鞭打","高峰","秩序井然","沃土"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":2,"instr":"把适当的词语填在横线上。","bank":["披上","秩序","毯子","压力","解释"],"items":[{"n":1,"text":"下雨天时，家长们都____________雨衣、撑着伞到校门口接孩子放学。"},{"n":2,"text":"寒冷的雨天里，盖上厚厚的____________，缩在被窝里，十分缓和。"},{"n":3,"text":"下课时，同学们都遵守____________，耐性地排队购买食物。"},{"n":4,"text":"许多学生因承受不了沉重的学习____________而患上精神疾病。"},{"n":5,"text":"科学老师用心地向同学们____________科学原理。"}],"ans":["披上","毯子","秩序","压力","解释"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":3,"instr":"把适当的词语填在横线上。","bank":["压力","平凡","解释","守护","秩序井然"],"items":[{"n":1,"text":"父母的工作____________大，我们一定要学会体谅他们。"},{"n":2,"text":"慧文耐性地听嘉琪____________这件事发生的原因。"},{"n":3,"text":"下课时，同学们都____________地走到食堂去吃早餐。"},{"n":4,"text":"弟弟生病住院时，妈妈彻夜不眠____________在他的身旁。"},{"n":5,"text":"芦荟的样子虽然____________，但它的用处可多呢！"}],"ans":["压力","解释","秩序井然","守护","平凡"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":4,"instr":"把适当的词语填在横线上。","bank":["秩序","压力","沃土","鞭打","高峰"],"items":[{"n":1,"text":"最近的考试____________让哥哥喘不过气来，爸爸决定在来临的周末带我们到槟城游玩。"},{"n":2,"text":"马戏团的驯兽师使用____________的方式来训练狮子。"},{"n":3,"text":"一向喜爱爬山的爸爸终于到达沙巴神山的____________了。"},{"n":4,"text":"乘客们有____________地排队上巴士，不会争先恐后。"},{"n":5,"text":"爷爷在那片____________种下的芒果树，如今长出甜美的果实。（二）自然界的时钟"}],"ans":["压力","鞭打","高峰","秩序","沃土"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":1,"instr":"把适当的词语填在横线上。","bank":["飞禽走兽","不妨","梨树","万丈阳光","李子树"],"items":[{"n":1,"text":"既然收割的青菜都吃不完，____________把它们都制成干菜，可以存放更久。"},{"n":2,"text":"____________下，农人们汗流浃背地在田里劳动着。"},{"n":3,"text":"____________上结满果实，让人垂涎欲滴。"},{"n":4,"text":"一大片的____________开花了，白茫茫一片，看花了人的双眼。"},{"n":5,"text":"踏入动物园，看到各种各样的____________，我和弟弟觉得很新鲜。"}],"ans":["不妨","万丈阳光","李子树","梨树","飞禽走兽"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":2,"instr":"把适当的词语填在横线上。","bank":["啄木鸟","天敌","巡视","产卵","猫头鹰"],"items":[{"n":1,"text":"大树伯伯生病了，小鸟们便去请____________医生来替大树治病。"},{"n":2,"text":"____________白天睡觉，晚上就会在田野巡视，捕捉田鼠。"},{"n":3,"text":"老鼠一看见____________——猫来了，便拔腿就逃。"},{"n":4,"text":"老鹰在空中盘旋____________，锁定目标后便直冲而下。"},{"n":5,"text":"海龟在夜晚上岸挖洞____________后，会用沙土把洞覆盖起来，不让人发现。"}],"ans":["啄木鸟","猫头鹰","天敌","巡视","产卵"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":3,"instr":"把适当的词语填在横线上。","bank":["习性","解释","测量"],"items":[{"n":1,"text":"这件事是一个误会，请给机会我____________。"},{"n":2,"text":"猫头鹰有白天睡觉、晚上起来捕食的____________。"},{"n":3,"text":"同学们排队让老师____________身高和体重。"},{"n":4,"text":"在老师的____________下，我才知道自己错怪了班长。"},{"n":5,"text":"弟弟全身滚烫，妈妈赶紧拿来体温计给他____________体温。"}],"ans":["解释","习性","测量","解释","测量"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":4,"instr":"把适当的词语填在横线上。","bank":["不妨","梨树","万丈","飞禽","李子"],"items":[{"n":1,"text":"空闲时，我们____________多进行一些有益身心的活动，如下棋、游泳、阅读等等。"},{"n":2,"text":"经过长途跋涉的我们终于到达峰顶，勤眼看到了____________光芒劈开云层的那一刻。"},{"n":3,"text":"____________味道甘甜，是人们喜爱的水果之一。"},{"n":4,"text":"果园里一排排____________、苹果树和桃树，个个长得很茂盛，谁也不让谁。"},{"n":5,"text":"原来蝙蝠不是____________，而是哺乳动物。"}],"ans":["不妨","万丈","李子","梨树","飞禽"]},{"u":18,"unit":"自然的规律","lesson":"（一）草的告白","no":5,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"每天清晨，（啄木鸟，老师）医生就开始给一棵棵树木看病了。"},{"n":2,"text":"（猫头鹰，老鹰）是农民的捕鼠好帮手。"},{"n":3,"text":"蛇是田鼠的（天敌，敌视），是农田作物的卫士。"},{"n":4,"text":"深夜，保安人员每个小时都会（巡视，巡回）这一区，确保没有罪案发生。"},{"n":5,"text":"海龟在沙滩上（产卵，卵生）后用沙子埋起来。"}],"ans":["啄木鸟","猫头鹰","天敌","巡视","产卵"]},{"u":19,"unit":"站在高楼看世界","lesson":"（一）建筑界的长颈鹿","no":1,"instr":"把适当的词语填在横线上。","bank":["富有","长颈鹿","餐饮","预测","不减"],"items":[{"n":1,"text":"____________伸长脖子吃树上的叶子。"},{"n":2,"text":"专家____________，未来几年环保家具将会陆续推出市场。"},{"n":3,"text":"爷爷的年纪虽老了，下田干起活儿还是____________当年。"},{"n":4,"text":"本地水果便宜又____________营养，深受大众的喜爱。"},{"n":5,"text":"各国的美食进入了我国市场后，使我国的____________业百花齐放。"}],"ans":["长颈鹿","预测","不减","富有","餐饮"]},{"u":19,"unit":"站在高楼看世界","lesson":"（一）建筑界的长颈鹿","no":2,"instr":"把适当的词语填在横线上。","bank":["绿肺","泳池","玉米","寺庙","雄伟"],"items":[{"n":1,"text":"许多小孩在儿童____________里戏水玩乐。"},{"n":2,"text":"每逢初一十五，很多信众都会到____________去烧香拜佛。"},{"n":3,"text":"人们应该停止无规律地砍伐森林，负起保护地球____________的责任。"},{"n":4,"text":"城市里，除了有先进的交通设施，还有许多____________的建筑物。"},{"n":5,"text":"妈妈把蒸熟后的____________抹上一层黄油，然后撒上一点盐，再分给我们吃。"}],"ans":["泳池","寺庙","绿肺","雄伟","玉米"]},{"u":19,"unit":"站在高楼看世界","lesson":"（一）建筑界的长颈鹿","no":3,"instr":"把适当的词语填在横线上。","bank":["长达","兴隆","仿佛","预测","横越"],"items":[{"n":1,"text":"拉让江____________590 公里，是我国最长的河流。"},{"n":2,"text":"绿油油的草地____________一张铺在地面的绿毛毯。"},{"n":3,"text":"大桥____________两岸，给两岸的居民带来了方便。"},{"n":4,"text":"王叔叔的餐馆开张了，我们送去了花篮，预祝他的生意____________。"},{"n":5,"text":"红青两队的篮球赛，大家纷纷____________青队会获得胜利。"}],"ans":["长达","仿佛","横越","兴隆","预测"]},{"u":19,"unit":"站在高楼看世界","lesson":"（一）建筑界的长颈鹿","no":4,"instr":"把适当的词语填在横线上。","bank":["兴隆","仿佛","热情","启用","雄 的结构是非常危险的，而且水位是突然像一个碗一样的倾斜深入，所以我们必须远离那里。"},{"n":4,"text":"马来西亚曾经是世界最大的____________出产国。"},{"n":5,"text":"考古学家在山谷里发现石器，还有已灭绝的野生动物遗骨等多个____________。"}],"ans":["州属","红砖绿瓦","矿湖","锡矿","遗迹"]},{"u":20,"unit":"特别的体验","lesson":"（一）不一样的表演","no":7,"instr":"圈出正确的答案。","bank":[],"items":[{"n":1,"text":"在超市内可以看到不同种类的（茄子，汽车），有短胖型与瘦长型的。"},{"n":2,"text":"护士帮彩风涂药（毒品，消毒），再用纱布包扎伤口，最后叮咛彩风要小心保护伤口。"},{"n":3,"text":"姐姐要配新眼镜，她（选择，抉择）了最近很流行的款式。"},{"n":4,"text":"妹妹站在（镜子，眼镜）前刷牙洗脸。"},{"n":5,"text":"营火熄灭后，我们准备回（帐篷，房间）睡觉，突然传来凄厉叫喊声，我们不禁毛骨悚然。"}],"ans":["茄子","消毒","选择","镜子","帐篷"]}];
/* DATA: [{u, unit, lesson, no, instr, bank:[], items:[{n,text}], ans:[]}] */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLANK=/[_＿]{2,}/;
const CHOICE=/（([^（）]+?)[、，,]([^（）]+?)）/;
let total=0,right=0,checked=0;
const state={}; // key -> {picked:[], done:bool}

function parts(e,it){
  // returns {before, after, opts, kind} where kind: 'blank' | 'choice' | 'none'
  const t=it.text;
  let m=t.match(BLANK);
  if(m){return {kind:'blank',before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts:e.bank||[]};}
  m=t.match(CHOICE);
  if(m){const opts=[m[1].trim(),m[2].trim()];return {kind:'choice',before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts};}
  return {kind:'none',before:t,after:'',opts:[]};
}
function exHTML(e,ei){
  const key=ei;
  const st=state[key]||(state[key]={picked:{},done:false});
  const hasAns=Array.isArray(e.ans)&&e.ans.length>0&&e.ans.some(x=>x);
  let h=`<section class="card" id="ex${ei}"><div class="qh"><div class="qn">练习（${numCN(e.no)}）</div><div class="instr">${esc(e.instr||'')}</div></div>`;
  if(e.bank&&e.bank.length)h+=`<div class="bank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  e.items.forEach((it,k)=>{
    const p=parts(e,it);
    const pk=st.picked[k]||'';
    const cls=st.done&&hasAns?((pk===e.ans[k])?'ok':'bad'):'';
    let sel=`<select data-ex="${ei}" data-k="${k}" class="${cls}" aria-label="第${it.n}题"><option value="">＿＿</option>${p.opts.map(o=>`<option value="${esc(o)}"${pk===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    let body=p.kind==='none'?esc(p.before):esc(p.before)+sel+esc(p.after);
    const numTag=`<b>${it.n}.</b> `;
    const ansTxt=st.done&&hasAns&&pk!==e.ans[k]&&e.ans[k]?`<div class="ansline">答案：${esc(e.ans[k])}</div>`:'';
    h+=`<div class="line">${numTag}${body}${ansTxt}</div>`;
  });
  h+=`<div class="row">`;
  if(hasAns)h+=`<button class="btn" data-act="check" data-ex="${ei}">✔ 检查</button>`;
  else h+=`<span class="none">暂无答案（资料里没有这一练习的答案）</span>`;
  h+=`</div>`;
  if(st.done&&hasAns){const ok=e.items.filter((_,k)=>st.picked[k]===e.ans[k]).length;h+=`<div class="muted">本练习：${ok} / ${e.items.length} 对</div>`;}
  return h+`</section>`;
}
const CN=['零','一','二','三','四','五','六','七','八','九','十'];
function numCN(n){if(n<=10)return CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');if(n<100){const a=Math.floor(n/10),b=n%10;return CN[a]+'十'+(b?CN[b]:'');}return '一百';}
function render(){
  const view=document.getElementById('view');
  let h='',lastU=null,lastL=null;
  DATA.forEach((e,ei)=>{
    if(e.unit!==lastU){h+=`<h2 class="unit">第 ${e.u} 单元　${esc(e.unit||'')}</h2>`;lastU=e.unit;lastL=null;}
    if(e.lesson&&e.lesson!==lastL){h+=`<div class="lesson">${esc(e.lesson)}</div>`;lastL=e.lesson;}
    h+=exHTML(e,ei);
  });
  view.innerHTML=h;
  score();
}
function score(){
  let c=0,r=0,t=0;
  DATA.forEach((e,ei)=>{const st=state[ei];if(!st||!st.done)return;const hasAns=e.ans&&e.ans.some(x=>x);if(!hasAns)return;
    e.items.forEach((_,k)=>{c++;if(st.picked[k]===e.ans[k])r++;});});
  DATA.forEach(e=>{if(e.ans&&e.ans.some(x=>x))t+=e.items.length;});
  document.getElementById('score').textContent=`✅ ${r} / ${t}　已检查 ${c}`;
}
document.addEventListener('change',ev=>{
  const s=ev.target;if(s.tagName!=='SELECT'||s.dataset.ex===undefined)return;
  const ei=+s.dataset.ex,k=+s.dataset.k;const st=state[ei]||(state[ei]={picked:{},done:false});
  st.picked[k]=s.value;
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const ei=+b.dataset.ex,e=DATA[ei];const st=state[ei]||(state[ei]={picked:{},done:false});
  // capture current selects first
  document.querySelectorAll(`select[data-ex="${ei}"]`).forEach(s=>{st.picked[+s.dataset.k]=s.value;});
  if(b.dataset.act==='check'){
    const miss=e.items.filter((_,k)=>!st.picked[k]).length;
    if(miss>0){alert('还有 '+miss+' 格没有选哦！');return;}
    st.done=true;
  }
  if(b.dataset.act==='show'){
    e.ans.forEach((a,k)=>{st.picked[k]=a;});st.done=true;
  }
  const y=window.scrollY;
  const saved=document.getElementById('ex'+ei);
  render();window.scrollTo(0,y);
});
document.getElementById('jump').addEventListener('change',ev=>{
  const u=+ev.target.value;if(!u)return;
  const idx=[...new Set(DATA.map(e=>e.u))].indexOf(u);
  const tgt=document.querySelectorAll('#view h2.unit')[idx];
  if(tgt)tgt.scrollIntoView({block:'start'});
  ev.target.value='';
});
(function(){const j=document.getElementById('jump');const seen=new Set();
  j.innerHTML='<option value="">跳到单元…</option>';
  DATA.forEach(e=>{if(seen.has(e.u))return;seen.add(e.u);const o=document.createElement('option');o.value=e.u;o.textContent='第 '+e.u+' 单元';j.appendChild(o);});})();
render();
</script>
<script>
(function(){
  const BOOK='3B';
  const units=[...new Set(DATA.map(e=>e.u))];
  const FIRST=units[0];
  const ukey=u=>'fill-'+BOOK+'-u'+String(u).padStart(2,'0');
  const isDone=u=>{try{return localStorage.getItem(ukey(u))==='1';}catch(e){return false;}};
  const setDone=u=>{try{localStorage.setItem(ukey(u),'1');}catch(e){}};
  const prevOf=u=>units[units.indexOf(u)-1];
  const unlocked=u=>u===FIRST||isDone(prevOf(u));
  function exPassed(ei){
    const e=DATA[ei];
    if(!e.ans||!e.ans.some(x=>x)) return true;
    const st=state[ei];
    return !!(st&&st.done&&!st.revealed&&e.items.every((_,k)=>st.picked[k]===e.ans[k]));
  }
  function unitComplete(u){ return DATA.every((e,ei)=>e.u!==u||exPassed(ei)); }
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-act="show"]');if(!b)return;
    const i=+b.dataset.ex;state[i]=state[i]||{picked:{},done:false};state[i].revealed=true;
  },true);
  function hashUnit(){
    const m=location.hash.match(/^#u(\d+)$/);
    const u=m?+m[1]:null;
    return (u!==null&&units.includes(u)&&unlocked(u))?u:null;
  }
  let CUR=hashUnit()||units.find(u=>!isDone(u)&&unlocked(u))||FIRST;
  function buildUnits(){
    const box=document.getElementById('units');if(!box)return;
    box.innerHTML='';
    units.forEach(u=>{
      const ok=unlocked(u);
      const b=document.createElement('button');
      b.className=(u===CUR?'btn':'btn alt')+' sm';
      b.setAttribute('aria-pressed',String(u===CUR));
      b.textContent=!ok?'🔒 第 '+u+' 单元':(isDone(u)?'✅ 第 '+u+' 单元':'第 '+u+' 单元');
      if(!ok){b.disabled=true;b.style.opacity='.5';}
      b.addEventListener('click',()=>{location.hash='u'+u;});
      box.appendChild(b);
    });
  }
  function lockedCard(e,ei){
    return '<section class="card" id="ex'+ei+'"><div class="qh"><div class="qn">🔒 练习（'+numCN(e.no)+'）未开放</div></div><div class="instr">请先做完上一个练习，全部答对后才能做这一题。</div></section>';
  }
  render=function(){
    const ex=DATA.map((e,ei)=>({e,ei})).filter(x=>x.e.u===CUR);
    let h='<h2 class="unit">第 '+CUR+' 单元　'+esc(ex[0]?ex[0].e.unit||'':'')+'</h2>';
    let lastL=null;
    ex.forEach(({e,ei},k)=>{
      if(e.lesson&&e.lesson!==lastL){h+='<div class="lesson">'+esc(e.lesson)+'</div>';lastL=e.lesson;}
      h+=(k>0&&!exPassed(ex[k-1].ei))?lockedCard(e,ei):exHTML(e,ei);
    });
    document.getElementById('view').innerHTML=h;
    score();
    buildUnits();
  };
  const origScore=score;
  score=function(){
    origScore();
    if(!isDone(CUR)&&unitComplete(CUR)){ setDone(CUR); buildUnits(); }
    if(isDone(CUR)){
      const el=document.getElementById('score');
      if(el&&!el.textContent.includes('已完成')) el.textContent+='　🎉 本单元已完成';
    }
  };
  window.addEventListener('hashchange',()=>{const u=hashUnit();if(u!==null){CUR=u;render();}});
  const j=document.getElementById('jump');if(j)j.style.display='none';
  render();
})();
</script>
<script src="lesson.js"></script>
</body>
</html>
