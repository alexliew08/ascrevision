<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahasa Melayu · Latihan Pemahaman Tahun 1</title>

<style>
:root{--bg:#f6f3ea;--panel:#fffdf8;--ink:#1f3d31;--muted:#6d6a5c;--line:#e3dac6;--green:#2f5e4a;--green2:#3f7a60;--accent:#e8914a;--good:#2e8b57;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fbe9e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:16px;line-height:1.6}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;margin:0 auto 0 0}
.top a{color:var(--green)}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;max-width:1280px;margin:0 auto;padding:16px}
@media (max-width:860px){.wrap{grid-template-columns:1fr;padding:12px 16px}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;max-height:84vh;overflow:auto;position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.list{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:6px}}
.tab{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:12px;border:1px solid transparent;background:none;color:var(--ink);font-size:15px;font-weight:700}
.tab.ok{color:var(--good)}
.tab.on{background:var(--green);color:#fff}
@media (max-width:860px){.tab{width:auto;min-width:48px;text-align:center;border-color:var(--line);background:#fff}.tab.on{border-color:var(--green)}}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.info{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.info b{font-size:18px;margin-right:auto}
.score{font-weight:700;background:#f1ede2;border-radius:999px;padding:4px 12px}
.score:empty{display:none}
.btn{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn:disabled{opacity:.4;cursor:default}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.split.single .left{display:none}
@media (min-width:900px){
  .split:not(.single){grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
  .split:not(.single) .left,.split .panel{position:sticky;top:90px;max-height:82vh;overflow:auto}
}
.left{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.foot .hint{font-size:14px;color:var(--muted)}
.foot .blank{font-size:15px;color:var(--muted);font-weight:600}
.foot .bts{display:flex;gap:8px}
/* left: worksheet pictures and passages */
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pcard h3{margin:0 0 6px;font-size:16px;color:var(--green)}
.ph{font-weight:800;color:var(--green);margin-bottom:8px}
.ptext{margin:6px 0;font-size:17px;line-height:1.75}
.vocab .vline{margin:4px 0;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pgrid.few{grid-template-columns:minmax(0,1fr)}
.pfig{margin:0;position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:4px;text-align:center;overflow:hidden}
.pfig img{width:100%;height:auto;display:block;max-width:100%}
.pgrid.few .pfig img{max-height:460px;width:auto;margin:0 auto;object-fit:contain}
.pfig figcaption{position:absolute;left:6px;top:6px;background:var(--green);color:#fff;border-radius:999px;font-weight:800;font-size:13px;padding:0 8px}
.rpic{display:inline-block;vertical-align:middle;max-width:150px;max-height:110px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:4px 0}
.thumb{max-width:180px;border:1px solid var(--line);border-radius:10px}
.shared{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.muted{color:var(--muted)}
/* right: answers */
.qsec{border-bottom:1px dashed var(--line);padding:6px 0 12px;margin-bottom:10px}
.qsec:last-child{border-bottom:none}
.qsec h3{margin:6px 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:800;flex:none}
.instr{margin:2px 0 8px;font-weight:600;color:var(--muted);font-size:14px}
.q{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.qn{font-weight:800;color:var(--green);min-width:24px;flex:none}
.qb{flex:1;min-width:0}
.qt{flex:1;min-width:0;font-size:15.5px;line-height:2.1}
.qt .gap{display:inline-block;min-width:60px;border-bottom:2px solid #9a8c6a;margin:0 2px;color:transparent}
.scr{font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--green);margin-right:4px;white-space:nowrap}
.paren{font-size:14px;font-weight:700;white-space:nowrap}
.qt .ans.short{width:80px;height:28px;padding:2px 6px;margin:0 2px}
.scr{letter-spacing:.02em}
.paren{font-size:17px;font-weight:700;margin:0 2px}
input.ans,select.ans,textarea.ans{font:inherit;font-size:15px;padding:4px 8px;border:2px solid #cfc3a6;border-radius:10px;background:#fff;color:var(--ink);max-width:100%;vertical-align:middle}
input.ans.inl{width:130px;margin:0 3px}
input.ans.short{width:100px;margin:0 2px}
input.ans.wide{display:block;width:100%;margin-top:6px}
select.ans.inl{min-width:130px;margin:0 3px}
select.ans{min-width:200px}
textarea.ans{display:block;width:100%;margin-top:6px}
.ans.ok{border-color:var(--good)!important;background:var(--okbg)}
.ans.bad{border-color:var(--bad)!important;background:var(--badbg)}
.ans:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px #dfeee5}
.bank{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px;padding:8px;border:1.5px dashed #b9ab86;border-radius:14px;background:#fff}
.bank .bl{font-weight:800;color:var(--green);margin-right:4px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:15px;font-weight:700;cursor:grab;user-select:none;touch-action:manipulation}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.drop{display:inline-block;min-width:110px;min-height:30px;margin:0 4px;padding:2px 10px;border:2px dashed #b9ab86;border-radius:10px;background:#fff;font-weight:700;vertical-align:middle;cursor:pointer;text-align:center}
.drop.ok{border:2px solid var(--good);background:var(--okbg)}
.drop.bad{border:2px solid var(--bad);background:var(--badbg)}
.uword .w{cursor:pointer;padding:2px 3px;border-radius:6px;border-bottom:2.5px solid transparent}
.uword .w:hover{background:#eef6ef}
.uword .w.on{border-bottom-color:#2d5f9a;color:#2d5f9a;font-weight:700}
.tblwrap{overflow-x:auto;margin:6px 0 10px}
.gtbl{width:100%;border-collapse:collapse;font-size:15px}
.gtbl th,.gtbl td{border:1px solid var(--line);padding:5px 7px;text-align:center;background:#fff}
.gtbl th{background:#f6efe0}
.gtbl .rn{width:40px;font-weight:800;color:var(--green)}
.rlist{margin:6px 0 10px;padding-left:4px;list-style:none;font-size:15px}
.rlist li{margin:4px 0}
.q.dq{align-items:center}
.q.dq .qt{flex:1;min-width:0}
.dsel{min-width:150px;max-width:100%;flex:none;padding:3px 4px;margin:0;font-size:14px}
.bw{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:15px;font-weight:700;cursor:pointer;user-select:none;margin:2px 0}
.bw.used{opacity:.3;cursor:default}
.bwd{display:inline-block;background:#eef6ef;border:1.5px solid var(--green2);border-radius:10px;padding:3px 9px;font-size:15px;font-weight:700;cursor:pointer;margin:2px 0}
.built{min-height:38px;border-bottom:2px solid #cfc3a6;padding:4px 2px;line-height:2.1;border-radius:6px}
.built.ok{background:var(--okbg);border-color:var(--good)}
.built.bad{background:var(--badbg);border-color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px;align-items:start}
.col{min-width:0}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
</style>
</head>

{ no:13, part:"L", unitTitle:"Latihan 13", sections:[

{ no:19, part:"L", unitTitle:"Latihan 19", sections:[
  { key:"P", type:"passage", title:"Baca petikan. Kemudian, jawab soalan.", lines:[

{ no:20, part:"L", unitTitle:"Latihan 20", sections:[

{ no:21, part:"L", unitTitle:"Latihan 21", sections:[

<script>

  st.v = st.v || {};
  st.done = st.done || {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var LAT = (window.TB || []).slice().sort(function (a, b) { return a.no - b.no; });
  var cur = Math.min(Math.max(+st.cur || 1, 1), LAT.length);

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[‘’“”"'.,;:!?()\[\]\-–—_]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }

  // Build the list of blanks for one latihan. Every scored item becomes one or more "slots".
  function slotsOf(lat) {
    var out = [];
    lat.sections.forEach(function (sec, si) {
      if (sec.type !== 'circle' && sec.type !== 'fill') return;
      sec.items.forEach(function (it, ii) {
        if (sec.type === 'circle') {
          out.push({ key: si + '|' + ii + '|0', si: si, ii: ii, bi: 0, kind: 'circle', answer: it.a, opts: it.o, scored: true });
        } else if (sec.type === 'free' || it.free) {
          out.push({ key: si + '|' + ii + '|0', si: si, ii: ii, bi: 0, kind: 'free', scored: false });
        } else {
          var n = (it.q.match(/_{3,}/g) || []).length || 1;
          for (var b = 0; b < n; b++) {
            var ans = Array.isArray(it.a) ? it.a : [it.a];
            out.push({ key: si + '|' + ii + '|' + b, si: si, ii: ii, bi: b, kind: 'fill', answer: Array.isArray(it.a) ? it.a : it.a, list: Array.isArray(it.a), kw: !!it.kw, scored: true });
          }
        }
      });
    });
    return out;
  }

  function isRightCircle(user, answer) { return user === answer; }
  function isRightFill(user, slot) {
    var u = norm(user);
    if (!u) return false;
    if (slot.list) {
      // a list of answers: the blank must match one of them
      return slot.answer.some(function (a) { return norm(a) === u; });
    }
    var a = norm(slot.answer);
    return slot.kw ? u.indexOf(a) >= 0 : u === a;
  }

  function fillInputs(sec, it) {
    // returns html for the question text with one input per blank
    var parts = it.q.split(/_{3,}/);
    var html = '';
    for (var b = 0; b < parts.length; b++) {
      html += esc(parts[b]).replace(/\n/g, '<br>');
      if (b < parts.length - 1) {
        var key = 'x';
        html += '<input class="ans" data-b="' + b + '" autocomplete="off">';
      }
    }
    return html;
  }

  function renderLeft(lat) {
    var html = '';
    lat.sections.forEach(function (sec) {
      if (sec.type === 'passage') {
        html += '<div class="pcard"><h3>' + esc(sec.title) + '</h3>' +
          sec.lines.map(function (l) { return '<p class="ptext">' + esc(l).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>';
      } else if (sec.type === 'info') {
        html += '<div class="pcard vocab"><h3>' + esc(sec.title) + '</h3>' +
          sec.lines.map(function (l) { return '<p class="vline">' + esc(l).replace(/\s·\s/g, '</p><p class="vline">') + '</p>'; }).join('') + '</div>';
      }
    });
    return html || '<p class="muted">—</p>';
  }

  function renderRight(lat, no) {
    var html = '';
    lat.sections.forEach(function (sec, si) {
      if (sec.type !== 'circle' && sec.type !== 'fill' && sec.type !== 'free') return;
      html += '<div class="qsec"><h3><span class="letter">' + esc(sec.key) + '</span> ' + esc(sec.title) + '</h3>';
      if (sec.instr) html += '<p class="instr">' + esc(sec.instr) + '</p>';
      sec.items.forEach(function (it, ii) {
        var base = no + '|' + si + '|' + ii;
        if (sec.type === 'circle') {
          var k = base + '|0';
          var v = st.v[k] || '';
          var opts = '<option value="">— Pilih jawapan —</option>' + it.o.map(function (o) {
            return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
          }).join('');
          html += '<div class="q"><span class="qn">' + it.n + '.</span><div class="qb"><div class="qt">' + esc(it.q) +
            '</div><select class="ans" data-k="' + k + '">' + opts + '</select></div></div>';
        } else if (sec.type === 'free' || it.free) {
          var fk = base + '|0';
          html += '<div class="q"><span class="qn">' + it.n + '.</span><div class="qb"><div class="qt">' + esc(it.q).replace(/\n/g, '<br>') +
            '</div><textarea class="ans wide" data-k="' + fk + '" rows="2" data-free="1">' + esc(st.v[fk] || '') + '</textarea></div></div>';
        } else {
          var inner = it.q.split(/_{3,}/);
          var body = '';
          for (var b = 0; b < inner.length; b++) {
            body += esc(inner[b]).replace(/\n/g, '<br>');
            if (b < inner.length - 1) {
              var bk = base + '|' + b;
              body += ' <input class="ans" data-k="' + bk + '" autocomplete="off" value="' + esc(st.v[bk] || '') + '"> ';
            }
          }
          if (inner.length === 1) {
            var ek = base + '|0';
            body += '<input class="ans wide" data-k="' + ek + '" autocomplete="off" value="' + esc(st.v[ek] || '') + '">';
          }
          html += '<div class="q"><span class="qn">' + it.n + '.</span><div class="qb"><div class="qt">' + body + '</div></div></div>';
        }
      });
      html += '</div>';
    });
    return html;
  }
  function render() {
    var lat = LAT[cur - 1];
    // tabs
    $('tabs').innerHTML = LAT.map(function (l, i) {
      var n = l.no;
      var cls = 'tab' + (i === cur - 1 ? ' on' : '') + (st.done[n] ? ' ok' : '');
      return '<button class="' + cls + '" type="button" data-i="' + (i + 1) + '">Latihan ' + n + (st.done[n] ? ' ✓' : '') + '</button>';
    }).join('');
    $('pagehead').textContent = lat.unitTitle;
    $('counter').textContent = cur + ' / ' + LAT.length;
    $('left').innerHTML = renderLeft(lat);
    $('right').innerHTML = renderRight(lat, lat.no);
    $('score').textContent = '';
    $('blank').textContent = '';
    $('prev').disabled = cur === 1;
    $('next').disabled = cur === LAT.length;
    st.cur = cur; save();
    window.scrollTo(0, 0);
    bindInputs();
  }

  function bindInputs() {
    document.querySelectorAll('#right [data-k]').forEach(function (el) {
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
        st.v[el.dataset.k] = el.value; save();
        el.classList.remove('ok', 'bad');
        $('score').textContent = ''; $('blank').textContent = '';
      });
    });
  }

  function check() {
    var lat = LAT[cur - 1];
    var slots = slotsOf(lat);
    var scored = slots.filter(function (s) { return s.scored; });
    var right = 0, blank = 0, used = {};
    scored.forEach(function (s) {
      var k = lat.no + '|' + s.key;
      var el = document.querySelector('#right [data-k="' + k + '"]');
      if (!el) return;
      var val = el.value;
      var ok = false;
      if (s.kind === 'circle') {
        ok = isRightCircle(val, s.answer);
      } else {
        if (s.list) {
          // each list answer may be used once
          var u = norm(val);
          var hit = s.answer.filter(function (a) { return !used[a] && norm(a) === u; })[0];
          if (hit) { ok = true; used[hit] = true; }
        } else {
          ok = isRightFill(val, s);
        }
      }
      if (!val.trim()) blank++;
      el.classList.toggle('ok', ok);
      el.classList.toggle('bad', !ok && val.trim() !== '');
      if (ok) right++;
    });
    var total = scored.length;
    $('score').textContent = right + '/' + total;
    if (blank > 0) $('blank').textContent = 'Masih ada ' + blank + ' soalan kosong.';
    else if (right === total) $('blank').textContent = 'Tahniah! Semua jawapan betul.';
    else $('blank').textContent = 'Cuba semula. Jawapan merah perlu disemak.';
    if (total > 0 && right === total) { st.done[lat.no] = true; } else { delete st.done[lat.no]; }
    save();
    renderTabsOnly();
  }

  function renderTabsOnly() {
    var nodes = document.querySelectorAll('#tabs .tab');
    nodes.forEach(function (b, i) {
      var n = LAT[i].no;
      b.classList.toggle('ok', !!st.done[n]);
      b.textContent = 'Latihan ' + n + (st.done[n] ? ' ✓' : '');
    });
  }

  function redo() {
    var lat = LAT[cur - 1];
    slotsOf(lat).forEach(function (s) { delete st.v[lat.no + '|' + s.key]; });
    delete st.done[lat.no];
    save(); render();
  }

  // wire up
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    cur = +b.dataset.i; render();
  });
  $('prev').addEventListener('click', function () { if (cur > 1) { cur--; render(); } });
  $('next').addEventListener('click', function () { if (cur < LAT.length) { cur++; render(); } });
  $('checkBtn').addEventListener('click', check);
  $('resetAll').addEventListener('click', redo);

  render();
})();

</script>
</body>
</html>
