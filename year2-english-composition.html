  // answers that differ only in case, punctuation or spacing count as the same;
  // for typed sentences, most of the model's words must appear in the answer
  function norm(s){ return (s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function sameDrop(a, b){ return a === b; }
  function sameText(a, b){
    const A = norm(a), B = norm(b);
    if(!A || !B) return false;
    if(A === B) return true;
    const ta = new Set(A.split(' ')), tb = new Set(B.split(' '));
    let hit = 0; tb.forEach(w => { if(ta.has(w)) hit++; });
    return hit / tb.size >= 0.75 && hit / ta.size >= 0.6;
  }

  function buildToolbar(){
    const tb = $('toolbar');
    tb.innerHTML = '<button class="btn" id="checkBtn">✓ Check answer</button>'
                 + '<button class="btn alt" id="showBtn">👀 Show</button>'
                 + '<button class="btn alt" id="redoBtn">↺ Redo</button>'
                 + '<span id="score"></span>';
    $('checkBtn').addEventListener('click', checkPage);
    $('showBtn').addEventListener('click', showPage);
    $('redoBtn').addEventListener('click', redoPage);
  }

  function render(i){
    idx = Math.max(0, Math.min(PAGES.length - 1, i));
    const L = label();
    $('pageImg').src = IMG_DIR + 'p-' + pad(L + 1) + '.jpg';
    $('pageImg').alt = 'Page ' + L;
    $('pageNo').textContent = 'Page ' + L + ' / ' + PAGES[PAGES.length - 1];
    $('prevBtn').disabled = idx === 0;
    $('nextBtn').disabled = idx === PAGES.length - 1;
    const ov = $('ov'); ov.innerHTML = '';
    const d = DATA[L] || { blanks: [] };
    const vals = state[L] = state[L] || [];
    d.blanks.forEach((b, k) => {
      let el;
      if(MODE === 'drop'){
        el = document.createElement('select');
        el.className = 'fld';
        const opts = (ANS[L] || []).slice().sort((a, c) => a.localeCompare(c, 'en', { sensitivity: 'base' }));
        el.innerHTML = '<option value="">—</option>' + opts.map(w => '<option>' + w.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</option>').join('');
        if(vals[k] !== undefined) el.value = vals[k];
        el.addEventListener('change', () => { vals[k] = el.value; el.classList.remove('ok','bad'); updateScore(); });
      } else {
        el = document.createElement('textarea');
        el.rows = 1; el.spellcheck = false; el.className = 'fld txt';
        if(vals[k] !== undefined) el.value = vals[k];
        el.addEventListener('input', () => { vals[k] = el.value; el.classList.remove('ok','bad'); updateScore(); });
      }
      el.style.left = b.x + '%';
      el.style.top = (MODE === 'drop' ? b.y - 2.3 : b.y) + '%';
      el.style.width = Math.max(b.w, 6) + '%';
      el.style.height = (b.h || 2.5) + '%';
      el.setAttribute('aria-label', 'Answer ' + (k + 1));
      ov.appendChild(el);
      if(MODE !== 'drop' && L <= NUM_MAX && !NUM_SKIP.includes(L)){ const num = document.createElement('span'); num.className = 'num'; num.textContent = (k + 1) + '.'; num.style.left = Math.max(0, b.x - 3.4) + '%'; num.style.top = (b.y + 0.4) + '%'; ov.appendChild(num); }
    });
    $('note').textContent = d.blanks.length ? '' : 'No boxes on this page.';
    updateScore();
  }

  function fields(){ return [...document.querySelectorAll('#ov select, #ov textarea')]; }

  function checkPage(){
    const L = label(), ans = ANS[L] || [];
    const same = MODE === 'drop' ? sameDrop : sameText;
    let ok = 0, asked = 0;
    fields().forEach((el, k) => {
      el.classList.remove('ok','bad');
      if(!ans[k]) return;
      asked++;
      if(el.value.trim() === '') return;
      if(same(el.value, ans[k])){ el.classList.add('ok'); ok++; } else el.classList.add('bad');
    });
    $('score').textContent = ans.length ? ok + ' / ' + asked + (MODE === 'drop' ? ' correct' : ' match model') : 'No model answer';
  }
  function showPage(){
    const L = label(), ans = ANS[L] || [];
    fields().forEach((el, k) => {
      if(!ans[k]) return;
      el.value = ans[k];
      state[L][k] = el.value;
      el.classList.remove('bad'); el.classList.add('ok');
    });
    $('score').textContent = 'Model answers shown';
  }
  function redoPage(){
    const L = label();
    state[L] = [];
    fields().forEach(el => { el.value = ''; el.classList.remove('ok','bad'); });
    $('score').textContent = '';
    updateScore();
  }
  function updateScore(){
    const sc = $('score'); if(!sc) return;
    const f = fields();
    if(!f.length){ sc.textContent = ''; return; }
    const filled = f.filter(el => el.value.trim() !== '').length;
    sc.textContent = filled + ' / ' + f.length + ' filled';
  }

  $('prevBtn').addEventListener('click', () => render(idx - 1));
  $('nextBtn').addEventListener('click', () => render(idx + 1));
  document.addEventListener('keydown', e => {
    if(e.target.matches('input,select,textarea')) return;
    if(e.key === 'ArrowRight') render(idx + 1);
    if(e.key === 'ArrowLeft') render(idx - 1);
  });

  buildToolbar();
  render(0);
</script>
</body>
</html>
