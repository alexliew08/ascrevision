const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={};     // "u|s|i|b" -> value
const secState={};  // "u|s" -> {checked, shown}
let CUR=0, selChip=null, dragInfo=null, ghost=null, justDropped=false;

const kid=(u,s,i,b)=>`${u}|${s}|${i}|${b}`;
const sk=(u,s)=>`${u}|${s}`;
const sec=(u,s)=>secState[sk(u,s)]||{};
const norm=t=>String(t||'').replace(/\s+/g,'').replace(/[·．.]/g,'');
function isRight(b,v){
  if(b.tb) return (v==='on')===(b.a==='on');
  if(v==null||v==='') return false;
  if(b.p) return norm(v).includes(norm(b.p));
  return [b.a].concat(b.alt||[]).some(x=>norm(x)===norm(v));
}
const kindOf=(s,it)=>it.k||s.k;
const isFreeItem=(s,it)=>kindOf(s,it)==='free' || !(it.b&&it.b.length);
// blanks for an item; a 'mark' item has its wrong-character check as blank 0
const blanksOf=it=>it.k==='mark' ? [{a:it.w}].concat(it.b) : it.b;

function widgetHTML(u,si,s,ii,it,bi,b){
  const k=b.k||kindOf(s,it), id=kid(u,si,ii,bi), v=state[id]||'', st=sec(u,si), chk=!!st.checked;
  const ok=chk&&isRight(b,v);
  if(b.nc) return `<input class="fill sm" data-id="${id}" value="${esc(v)}" aria-label="小格" autocomplete="off">`;
  if(b.xw) return `<input class="fill${chk?(ok?' ok':' bad'):''}" style="width:12em" data-id="${id}" value="${esc(v)}" aria-label="第 ${bi+1} 空" autocomplete="off">`;
  if(k==='text'){
    const wide=b.p?' wide':'';
    return `<input class="fill${wide}${chk?(ok?' ok':' bad'):''}" data-id="${id}" value="${esc(v)}" aria-label="第 ${bi+1} 空" autocomplete="off">`;
  }
  if(k==='drop'){
    const opts=(b.o&&b.o.length)?b.o:(s.bk&&s.bk.length?s.bk:[b.a]);
    return `<select data-id="${id}" class="${chk?(ok?'ok':'bad'):''}" aria-label="第 ${bi+1} 空"><option value="">＿＿</option>${opts.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(k==='hl'){
    const opts=b.o||[b.a];
    return `<span class="hlgrp" role="group">${opts.map(o=>{
      const on=v===o; let c=on?' on':'';
      if(chk&&on) c+=ok?' ok':' bad';
      return `<button type="button" class="hlc${c}" data-hl="${id}" data-val="${esc(o)}">${esc(o)}</button>`;
    }).join('')}</span>`;
  }
  if(k==='drag') return `<span class="zone${chk?(ok?' ok':' bad'):''}" data-zone="${id}">${v?esc(v):'＿＿'}</span>`;
  return '';
}

function markHTML(u,si,s,ii,it){
  const mid=kid(u,si,ii,0), chosen=state[mid]||'', chk=!!sec(u,si).checked;
  const okMark=chosen===it.w;
  let chars='';
  for(const ch of it.q){
    if(ch===it.w && chosen===ch){ chars+=`<span class="ch on${chk?(okMark?' ok':' bad'):''}" data-mark="${mid}" data-ch="${esc(ch)}">${esc(ch)}</span>`; }
    else if(ch===it.w){ chars+=`<span class="ch${chk&&chosen===ch?(okMark?' ok':' bad'):''}" data-mark="${mid}" data-ch="${esc(ch)}">${esc(ch)}</span>`; }
    else if(ch===chosen && chosen!==it.w){ chars+=`<span class="ch on${chk?' bad':''}" data-mark="${mid}" data-ch="${esc(ch)}">${esc(ch)}</span>`; }
    else chars+=`<span class="ch" data-mark="${mid}" data-ch="${esc(ch)}">${esc(ch)}</span>`;
  }
  const b=it.b[0], bid=kid(u,si,ii,1), v=state[bid]||'', ok=chk&&isRight(b,v);
  return `<div class="uline">${chars}<span class="mk">← 点出错的字，再在下面写正确的字</span><div>改正：<input class="fill${chk?(ok?' ok':' bad'):''}" data-id="${bid}" value="${esc(v)}" aria-label="正确的字" autocomplete="off"></div></div>`;
}

function sectionHTML(u,si,s){
  const st=sec(u,si);
  let h=`<section class="card" id="s${si}"><h3 class="sec-h">${esc(s.t)}</h3>`;
  if(s.img) h+=`<img class="pic" style="${s.imgw?'width:'+s.imgw+';margin-left:auto;margin-right:auto':''}" src="${IMG}${esc(s.img)}" alt="题目图片" loading="lazy">`;
  if(s.img2) h+=`<img class="pic" src="${IMG}${esc(s.img2)}" alt="题目图片" loading="lazy">`;
  if(s.bk&&s.bk.length){
    if(s.k==='drag') h+=`<div class="bank" data-bank="${u}|${si}">${s.bk.map(w=>`<span class="chip${s.sq?' sq':''}" data-chip="${esc(w)}" data-sec="${u}|${si}">${esc(w)}</span>`).join('')}</div>`;
    else h+=`<div class="bank">${s.bk.map(w=>`<span class="hint">${esc(w)}</span>`).join('')}</div>`;
  }
  if(s.cols) h+='<div class="cols2" style="column-count:'+s.cols+'">';
  let graded=0;
  s.it.forEach((it,ii)=>{
    if(it.cells){
      h+=`<div class="gridrow"><span class="qlab">${esc(it.q)}</span>`+it.cells.map((c,j)=>{
        const cid=kid(u,si,ii,j), on=state[cid]==='on', ck=!!st.checked, good=isRight(it.b[j],state[cid]);
        return `<span class="cellhl${on?' on':''}${ck?(good?' ok':' bad'):''}" data-cellid="${cid}">${esc(c)}</span>`;
      }).join('')+'</div>';
      graded+=it.cells.length; return;
    }
    if(it.grid){
      let t='<table class="cgrid"><tr>';
      it.grid.forEach((row)=>{ t+='<tr>'; row.forEach((cell)=>{
        if(cell==='{}'){ const bid=kid(u,si,ii,0), v=state[bid]||'', chk=!!st.checked, ok=chk&&isRight(it.b[0],v);
          t+=`<td><span class="zone${chk?(ok?' ok':' bad'):''}" data-zone="${bid}">${v?esc(v):'＿'}</span></td>`; }
        else t+=`<td>${esc(cell)}</td>`;
      }); t+='</tr>'; });
      h+=`<div class="gridrow"><span class="qlab">${esc(it.q)}</span>${t}</table></div>`;
      graded+=it.b.length; return;
    }
    if(kindOf(s,it)==='mark'){
      h+=markHTML(u,si,s,ii,it); graded+=blanksOf(it).length; return;
    }
    if(isFreeItem(s,it)){
      if(it.rows){ h+='<table class="ftab">'+it.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')+'</table>'; }
      if(it.q&&it.b){ let line=''; String(it.q).split('{}').forEach((p,bi)=>{ line+=esc(p); if(bi<it.b.length) line+=widgetHTML(u,si,s,ii,it,bi,it.b[bi]); }); h+=`<div class="uline">${line}</div>`; }
      else if(it.q) h+=`<div class="uline">${esc(it.q)}</div>`;
      const fid=kid(u,si,ii,0);
      if(!(it.b&&it.b.length)) h+=`<textarea class="free" data-free="${fid}" aria-label="自由作答">${esc(state[fid]||'')}</textarea>`;
      return;
    }
    const parts=String(it.q).split('{}');
    let line='';
    parts.forEach((p,bi)=>{ line+=esc(p).replace(/\n/g,'<br>'); if(bi<it.b.length) line+=widgetHTML(u,si,s,ii,it,bi,it.b[bi]); });
    graded+=it.b.length;
    h+=`<div class="uline">${line}</div>`;
  });
  if(s.cols) h+='</div>';
  if(graded||s.btn){
    h+=`<div class="row"><button class="btn" data-act="check" data-s="${si}">✔ 检查</button><button class="btn alt sm" disabled data-act="show" data-s="${si}">👀 看答案</button><button class="btn alt sm" data-act="redo" data-s="${si}">↺ 重做</button></div>`;
    if(st.checked&&graded){ const r=scoreSec(u,si); h+=`<div class="muted">本节：${r.ok} / ${r.tot} 对${r.ok===r.tot?' 🎉 全对了！':''}</div>`; }
  }
  if(st.shown){
    const refs=s.it.filter(it=>it.ref).map(it=>it.ref);
    if(s.ref) refs.push(s.ref);
    refs.forEach(r=>{ h+=`<div class="ansline">${esc(r)}</div>`; });
  }
  h+='</section>';
  return h;
}

function scoreSec(u,si){
  const s=DATA[u].secs[si]; let ok=0,tot=0;
  s.it.forEach((it,ii)=>{ if(isFreeItem(s,it)) return;
    blanksOf(it).forEach((b,bi)=>{ tot++; if(isRight(b,state[kid(u,si,ii,bi)])) ok++; }); });
  return {ok,tot};
}

function bankRefresh(){
  document.querySelectorAll('.bank[data-bank]').forEach(bk=>{
    const [u,si]=bk.dataset.bank.split('|').map(Number);
    const s=DATA[u].secs[si];
    const used=new Set();
    s.it.forEach((it,ii)=>{ if(isFreeItem(s,it)) return;
      blanksOf(it).forEach((_,bi)=>{ const v=state[kid(u,si,ii,bi)]; if(v) used.add(v); }); });
    bk.querySelectorAll('.chip').forEach(c=>c.classList.toggle('used',!s.reuse&&used.has(c.dataset.chip)));
  });
}

function scoreLine(){
  let r=0,t=0,n=0;
  DATA.forEach((unit,u)=>unit.secs.forEach((s,si)=>{
    if(!secState[sk(u,si)]||!secState[sk(u,si)].checked) return;
    n++; const x=scoreSec(u,si); r+=x.ok; t+=x.tot;
  }));
  document.getElementById('score').textContent=`✅ ${r} / ${t}　已检查 ${n} 节`;
}

let passedUnits=new Set();
try{ passedUnits=new Set(JSON.parse(localStorage.getItem('ex3A-passed')||'[]')); }catch(err){}
function savePassedUnits(){ try{ localStorage.setItem('ex3A-passed',JSON.stringify([...passedUnits])); }catch(err){} }
function unitUnlocked(u){ return u===0 || passedUnits.has(u-1); }
function unitComplete(u){
  const unit=DATA[u]; let graded=0;
  for(let si=0;si<unit.secs.length;si++){
    const s=unit.secs[si];
    const hasGraded=s.it.some(it=>!isFreeItem(s,it));
    if(!hasGraded) continue;
    const st=secState[sk(u,si)];
    if(!st||!st.checked||st.shown) return false;
    const r=scoreSec(u,si);
    if(r.tot===0||r.ok!==r.tot) return false;
    graded++;
  }
  return graded>0;
}
function updatePassedUnits(){
  DATA.forEach((_,u)=>{ if(!passedUnits.has(u)&&unitComplete(u)){ passedUnits.add(u); savePassedUnits(); } });
}
function renderUnit(){
  updatePassedUnits();
  if(!unitUnlocked(CUR)){ CUR=Math.max(0,DATA.findIndex((_,u)=>unitUnlocked(u)&&!passedUnits.has(u))); }
  const unit=DATA[CUR];
  let h='<h2 class="unit">第 '+unit.u+' 单元　'+esc(unit.name)+'</h2>';
  unit.secs.forEach((s,si)=>{ h+=sectionHTML(CUR,si,s); });
  document.getElementById('view').innerHTML=h;
  buildUnitButtons();
  bankRefresh(); scoreLine();
}

function buildUnitButtons(){
  const box=document.getElementById('units');
  box.innerHTML='';
  DATA.forEach((u,i)=>{
    const b=document.createElement('button');
    b.className='btn alt sm'; b.type='button';
    const ok=unitUnlocked(i);
    b.textContent=ok?('第 '+u.u+' 单元'+(passedUnits.has(i)?' ✅':'')):('🔒 第 '+u.u+' 单元');
    b.setAttribute('aria-pressed',String(i===CUR));
    b.disabled=!ok;
    b.addEventListener('click',()=>{ if(!ok) return; CUR=i; renderUnit(); window.scrollTo(0,0); });
    box.appendChild(b);
  });
}

document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip');
  if(!c||c.classList.contains('used')) return;
  dragInfo={el:c,val:c.dataset.chip,x:e.clientX,y:e.clientY,moved:false};
});
document.addEventListener('pointermove',e=>{
  if(!dragInfo) return;
  if(!dragInfo.moved && Math.hypot(e.clientX-dragInfo.x,e.clientY-dragInfo.y)>8){
    dragInfo.moved=true;
    ghost=dragInfo.el.cloneNode(true); ghost.className='chip ghost'; document.body.appendChild(ghost);
  }
  if(dragInfo.moved&&ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; }
});
document.addEventListener('pointerup',e=>{
  if(!dragInfo) return;
  const d=dragInfo; dragInfo=null;
  if(ghost){ ghost.remove(); ghost=null; }
  if(d.moved){
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const z=under&&under.closest('[data-zone]');
    if(z){ placeInZone(z,d.val); justDropped=true; }
  } else {
    if(selChip) selChip.classList.remove('sel');
    selChip=(selChip===d.el)?null:d.el;
    if(selChip) selChip.classList.add('sel');
  }
});

document.addEventListener('click',e=>{
  if(justDropped){ justDropped=false; return; }
  const z=e.target.closest('[data-zone]');
  if(z){
    if(selChip){ placeInZone(z,selChip.dataset.chip); selChip.classList.remove('sel'); selChip=null; }
    else if(state[z.dataset.zone]) clearZone(z);
    return;
  }
  const cc=e.target.closest('[data-cellid]');
  if(cc){ const id=cc.dataset.cellid; state[id]=(state[id]==='on')?'':'on'; cc.classList.toggle('on',state[id]==='on'); return; }
  const mk=e.target.closest('[data-mark]');
  if(mk){ markPick(mk); return; }
  const hl=e.target.closest('[data-hl]');
  if(hl){ hlPick(hl); return; }
  const b=e.target.closest('[data-act]');
  if(!b) return;
  const si=+b.dataset.s, u=CUR, s=DATA[u].secs[si];
  if(b.dataset.act==='check'){
    document.querySelectorAll(`#s${si} input.fill`).forEach(x=>state[x.dataset.id]=x.value);
    document.querySelectorAll(`#s${si} select`).forEach(x=>state[x.dataset.id]=x.value);
    const st=secState[sk(u,si)]||(secState[sk(u,si)]={});
    st.checked=true;
  } else if(b.dataset.act==='show'){
    s.it.forEach((it,ii)=>{ if(isFreeItem(s,it)) return;
      blanksOf(it).forEach((bb,bi)=>{ state[kid(u,si,ii,bi)]=bb.a; }); });
    const st=secState[sk(u,si)]||(secState[sk(u,si)]={});
    st.checked=true; st.shown=true;
  } else if(b.dataset.act==='redo'){
    s.it.forEach((it,ii)=>{ if(isFreeItem(s,it)) return;
      blanksOf(it).forEach((_,bi)=>{ delete state[kid(u,si,ii,bi)]; }); });
    delete secState[sk(u,si)];
  }
  renderUnit();
});

renderUnit();
buildUnitButtons();
</script>
</body>
</html>
