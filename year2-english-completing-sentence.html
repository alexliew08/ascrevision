<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Completing Sentence · Tahun 2</title>
<style>
  :root{ --bg:#fff6df; --card:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b; --green:#2f5e4a; --green2:#3f7a60;
         --field:#fffbe6; --field-b:#c9b77a; --focus:#3f7a60; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1d1f1c; --card:#262a26; --ink:#eee; --muted:#aaa; --field:#34382f; --field-b:#6d6a45; }
  }
  :root[data-theme="dark"]{ --bg:#1d1f1c; --card:#262a26; --ink:#eee; --muted:#aaa; --field:#34382f; --field-b:#6d6a45; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Segoe UI",system-ui,sans-serif}
  body{min-height:100vh;background:var(--bg)}
  header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--field-b)}
  header h1{font-size:18px;margin:0;color:var(--green)}
  .nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--green2);background:var(--green);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;text-decoration:none;font-family:inherit}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.alt{background:transparent;color:var(--green)}
  .btn.ghost{background:transparent;color:var(--green)}
  #pageNo{font-size:14px;color:var(--muted);min-width:110px;text-align:center}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px 0}
  #score{font-size:14px;color:var(--muted);min-width:90px;text-align:center}
  main{padding:12px 16px 40px;display:flex;flex-direction:column;align-items:center}
  .sheet{position:relative;width:100%;max-width:860px;background:var(--card);border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.12);overflow:hidden;container-type:inline-size}
  .sheet img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
  .ov{position:absolute;inset:0}
  .fld{position:absolute;border:0;background:var(--field);color:var(--ink);border-radius:4px;outline:none;padding:0 4px;font-family:inherit;font-size:2.1cqw;line-height:1.2;box-shadow:inset 0 0 0 1px var(--field-b)}
  .fld:focus{box-shadow:inset 0 0 0 2px var(--focus)}
  select.fld{padding:0 2px;cursor:pointer}
  textarea.fld{resize:none;padding:2px 6px;line-height:1.35;overflow:hidden;background:rgba(255,251,230,.45)}
  textarea.fld:focus{background:rgba(255,251,230,.8)}
  .fld.ok{background:#dff3e4;box-shadow:inset 0 0 0 2px #3c9a5a}
  .fld.bad{background:#fbe1dc;box-shadow:inset 0 0 0 2px #c0503c}
  .num{position:absolute;font-size:2.2cqw;font-weight:bold;color:var(--green);pointer-events:none;line-height:1}
  .hint{max-width:860px;margin:10px auto 0;font-size:13px;color:var(--muted);text-align:center}
  @media (max-width:520px){ header{padding:8px 10px} main{padding:10px 8px 30px} }
</style>

<body>

<script>

  const DATA = {"1":{"blanks":[{"x":51.98,"y":54.74,"w":28.35},{"x":23.96,"y":60.5,"w":28.35},{"x":12.42,"y":66.17,"w":35.6},{"x":12.42,"y":71.93,"w":26.7},{"x":6.37,"y":77.68,"w":22.75}]},"2":{"blanks":[{"x":6.37,"y":64.85,"w":29.12},{"x":6.37,"y":70.53,"w":32.42},{"x":17.8,"y":76.21,"w":26.7},{"x":6.37,"y":81.96,"w":31.54},{"x":51.21,"y":81.96,"w":26.7}]},"3":{"blanks":[{"x":30.88,"y":60.5,"w":42.86},{"x":18.46,"y":68.04,"w":32.31},{"x":21.87,"y":75.51,"w":31.54},{"x":57.47,"y":81.26,"w":21.87},{"x":51.21,"y":89.11,"w":28.35}]},"4":{"blanks":[{"x":34.62,"y":49.07,"w":24.4},{"x":6.37,"y":56.92,"w":20.33},{"x":52.97,"y":56.92,"w":19.56},{"x":24.51,"y":65.47,"w":25.82},{"x":28.02,"y":74.11,"w":31.54}]},"5":{"blanks":[{"x":40.44,"y":57.47,"w":38.79},{"x":25.27,"y":65.4,"w":37.14},{"x":30,"y":73.33,"w":39.67},{"x":13.3,"y":81.34,"w":26.7},{"x":56.81,"y":81.34,"w":27.47}]},"6":{"blanks":[{"x":54.95,"y":48.52,"w":25.16},{"x":46.7,"y":57.15,"w":29.12},{"x":26.26,"y":65.71,"w":21.87},{"x":14.51,"y":74.26,"w":29.12},{"x":10.66,"y":82.89,"w":26.7}]},"7":{"blanks":[{"x":48.57,"y":54.2,"w":30.66},{"x":43.3,"y":62.29,"w":16.26},{"x":53.85,"y":69.52,"w":16.15},{"x":6.37,"y":77.29,"w":12.2},{"x":50.55,"y":77.29,"w":12.2},{"x":31.54,"y":84.99,"w":14.73},{"x":69.89,"y":84.99,"w":19.45}]},"8":{"blanks":[{"x":24.07,"y":55.91,"w":19.45},{"x":20.66,"y":64.54,"w":31.65},{"x":6.37,"y":73.09,"w":19.45},{"x":58.9,"y":73.09,"w":22.64},{"x":27.69,"y":81.73,"w":33.19}]},"9":{"blanks":[{"x":30.11,"y":57.15,"w":27.58},{"x":26.7,"y":62.83,"w":25.16},{"x":29.45,"y":68.51,"w":28.46},{"x":29.56,"y":74.26,"w":24.29},{"x":28.02,"y":79.39,"w":19.89},{"x":59.56,"y":79.39,"w":18.46}]},"10":{"blanks":[{"x":26.81,"y":57,"w":26.7},{"x":34.07,"y":62.75,"w":47.69},{"x":47.14,"y":68.43,"w":40.33},{"x":19.67,"y":74.18,"w":32.42},{"x":51.54,"y":79.94,"w":30.77}]},"11":{"blanks":[{"x":34.62,"y":49.07,"w":17.03},{"x":48.57,"y":54.74,"w":19.45},{"x":34.84,"y":63.37,"w":21.1},{"x":23.85,"y":69.13,"w":26.7},{"x":57.91,"y":74.88,"w":18.68}]},"12":{"blanks":[{"x":33.08,"y":53.42,"w":21.21},{"x":13.19,"y":60.89,"w":19.12},{"x":60.44,"y":60.89,"w":17.14},{"x":21.32,"y":68.35,"w":21.21},{"x":29.01,"y":75.82,"w":19.67}]},"13":{"blanks":[{"x":28.79,"y":50.78,"w":53.3},{"x":38.13,"y":56.53,"w":29.12},{"x":37.47,"y":62.29,"w":48.57},{"x":19.23,"y":70.84,"w":28.24}]},"14":{"blanks":[{"x":32.2,"y":57.85,"w":34.73},{"x":28.46,"y":63.61,"w":29.12},{"x":43.74,"y":69.28,"w":29.89},{"x":23.63,"y":75.04,"w":35.71},{"x":35.05,"y":80.79,"w":24.4}]},"15":{"blanks":[{"x":39.67,"y":55.83,"w":25.16},{"x":30.66,"y":61.51,"w":30.77},{"x":30.66,"y":67.26,"w":17.91},{"x":36.04,"y":73.02,"w":45.27},{"x":28.9,"y":78.69,"w":31.54}]},"16":{"blanks":[{"x":36.92,"y":55.21,"w":35.71},{"x":32.86,"y":60.89,"w":30.77},{"x":46.48,"y":66.64,"w":40.55},{"x":28.02,"y":72.32,"w":40.44},{"x":49.34,"y":78.07,"w":31.54}]},"17":{"blanks":[{"x":55.82,"y":54.98,"w":31.54},{"x":41.54,"y":60.73,"w":26.7},{"x":52.2,"y":66.49,"w":28.35},{"x":47.91,"y":72.16,"w":25.93},{"x":47.8,"y":77.92,"w":29.23}]},"18":{"blanks":[{"x":23.63,"y":48.06,"w":20.66},{"x":6.26,"y":55.52,"w":28.35},{"x":6.26,"y":62.99,"w":19.89},{"x":6.26,"y":70.45,"w":24.07},{"x":54.73,"y":70.45,"w":15.6},{"x":35.05,"y":77.92,"w":23.3}]},"19":{"blanks":[{"x":33.74,"y":50.54,"w":24.84},{"x":6.26,"y":58.01,"w":23.41},{"x":50.11,"y":58.01,"w":13.52},{"x":18.35,"y":65.47,"w":12.75},{"x":8.24,"y":75.51,"w":27.03},{"x":64.07,"y":75.51,"w":14.18}]},"20":{"blanks":[{"x":25.27,"y":57.85,"w":42.09},{"x":29.45,"y":63.61,"w":39.67},{"x":26.37,"y":69.28,"w":36.37},{"x":24.73,"y":75.04,"w":16.26},{"x":33.19,"y":80.79,"w":23.41}]},"21":{"blanks":[{"x":20.88,"y":60.5,"w":18.46},{"x":60.22,"y":60.5,"w":22.75},{"x":20.66,"y":67.96,"w":19.12},{"x":62.09,"y":67.96,"w":18.46},{"x":37.14,"y":75.51,"w":26.26}]},"22":{"blanks":[{"x":24.84,"y":50.54,"w":19.89},{"x":65.6,"y":50.54,"w":18.46},{"x":48.57,"y":58.01,"w":16.26},{"x":6.26,"y":65.47,"w":18.35},{"x":67.69,"y":65.47,"w":14.84},{"x":42.86,"y":73.02,"w":14.18},{"x":20.55,"y":80.48,"w":14.29}]},"23":{"blanks":[{"x":23.52,"y":49.77,"w":22.09},{"x":24.4,"y":54.74,"w":25.49},{"x":32.09,"y":59.72,"w":34.73},{"x":38.46,"y":64.7,"w":29.78},{"x":26.81,"y":69.67,"w":38.9}]},"24":{"blanks":[{"x":28.9,"y":53.11,"w":18.46},{"x":64.73,"y":53.11,"w":17.69},{"x":11.32,"y":60.58,"w":21.21},{"x":50.44,"y":60.58,"w":12.75},{"x":41.21,"y":73.09,"w":25.49},{"x":19.23,"y":80.56,"w":19.89},{"x":52.97,"y":80.56,"w":20.55}]},"25":{"blanks":[{"x":22.2,"y":46.81,"w":28.35},{"x":21.98,"y":52.8,"w":28.35},{"x":13.96,"y":57.23,"w":15.6},{"x":20.88,"y":63.3,"w":20.55},{"x":36.92,"y":69.52,"w":22.75}]}};             // label -> { blanks:[{x,y,w,h}] } in % of the page image
  const ANS = {"1":["neighbour","tall","dresses","storybooks","kind"],"2":["party","food","colourful","presents","sing"],"3":["near the train station","a large car park","park their bicycle","hall and toilet","in front of the garden"],"4":["cycle","park","mother","goes","naps"],"5":["went to a farm","walked to the field","near the pond","milking the cows","feed the animals"],"6":["stamps","two","neatly","bookshelf","cousins"],"7":["have a picnic","bring","swim","sits","reads","eats","home"],"8":["the market","carry the things","carries","walk to the","many things"],"9":["toothache","painful","dentist","pulls out","much better","bad tooth"],"10":["has","the time","nearby clinic","doctor says","for"],"11":["buy","sees","to put out","fire engine","quickly"],"12":["circus","animals","tricks","acrobats","funny"],"13":["is crying","where","her","look"],"14":["blind man","to cross the","holds his hand","helps the blind man","grateful"],"15":["class","eat","cycle","the beach","enjoy"],"16":["the market","fish","father\u0027s car","for breakfast","cooks"],"17":["at home","matches","fire","frightened","apartment"],"18":["helping her","flour and butter","a few","wooden spoon","the mixture","nice smell"],"19":["May","second Sunday","card","words","love her and thank her","likes"],"20":["Teachers\u0027 Day","having a party","food and drinks","buy gifts","very happy"],"21":["windy day","to fly a kite","his kite","open field","high up in the sky"],"22":["celebrating","invites","present","shopping","decide","doll","like"],"23":["watch","all","wooden spoon","the mixture","bakes"],"24":["sandwiches","to school","spreads butter","bread","bread together","very much","delicious"],"25":["a card","an apple","likes","write","will like"]};               // label -> model answers, one per box (in order)
  const NUM_SKIP = [];      // pages without question numbers
  const NUM_MAX = 0;        // question numbers are shown on boxes up to this page
  const IMG_DIR = "year2-english/sentence-pages/";

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(3, '0');
  let idx = 0;
  const state = {};                  // label -> [values]

  function label(){ return PAGES[idx]; }

  // answers that differ only in case, punctuation or spacing count as the same;
  // for typed sentences, most of the model's words must appear in the answer
  function norm(s){ return (s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function sameDrop(a, b){ return a === b; }
  function sameText(a, b){
    const A = norm(a), B = norm(b);
    if(!A || !B) return false;
    if(A === B) return true;
    const ta = new Set(A.split(' ')), tb = new Set(B.split(' '));
    let hit = 0; tb.forEach(w => { if(ta.has(w)) hit++; });
    return hit / tb.size >= 0.75 && hit / ta.size >= 0.6;
  }

  function buildToolbar(){
    const tb = $('toolbar');
    tb.innerHTML = '<button class="btn" id="checkBtn">✓ Check answer</button>'
                 + '<button class="btn alt" id="showBtn">👀 Show</button>'
                 + '<button class="btn alt" id="redoBtn">↺ Redo</button>'
                 + '<span id="score"></span>';
    $('checkBtn').addEventListener('click', checkPage);
    $('showBtn').addEventListener('click', showPage);
    $('redoBtn').addEventListener('click', redoPage);
  }

  function render(i){
    idx = Math.max(0, Math.min(PAGES.length - 1, i));
    const L = label();
    $('pageImg').src = IMG_DIR + 'p-' + pad(L + 1) + '.jpg';
    $('pageImg').alt = 'Page ' + L;
    $('pageNo').textContent = 'Page ' + L + ' / ' + PAGES[PAGES.length - 1];
    $('prevBtn').disabled = idx === 0;
    $('nextBtn').disabled = idx === PAGES.length - 1;
    const ov = $('ov'); ov.innerHTML = '';
    const d = DATA[L] || { blanks: [] };
    const vals = state[L] = state[L] || [];
    d.blanks.forEach((b, k) => {
      let el;
      if(MODE === 'drop'){
        el = document.createElement('select');
        el.className = 'fld';
        const opts = (ANS[L] || []).slice().sort((a, c) => a.localeCompare(c, 'en', { sensitivity: 'base' }));
        el.innerHTML = '<option value="">—</option>' + opts.map(w => '<option>' + w.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</option>').join('');
        if(vals[k] !== undefined) el.value = vals[k];
        el.addEventListener('change', () => { vals[k] = el.value; el.classList.remove('ok','bad'); updateScore(); });
      } else {
        el = document.createElement('textarea');
        el.rows = 1; el.spellcheck = false; el.className = 'fld txt';
        if(vals[k] !== undefined) el.value = vals[k];
        el.addEventListener('input', () => { vals[k] = el.value; el.classList.remove('ok','bad'); updateScore(); });
      }
      el.style.left = b.x + '%';
      el.style.top = (MODE === 'drop' ? b.y - 2.3 : b.y) + '%';
      el.style.width = Math.max(b.w, 6) + '%';
      el.style.height = (b.h || 2.5) + '%';
      el.setAttribute('aria-label', 'Answer ' + (k + 1));
      ov.appendChild(el);
      if(MODE !== 'drop' && L <= NUM_MAX && !NUM_SKIP.includes(L)){ const num = document.createElement('span'); num.className = 'num'; num.textContent = (k + 1) + '.'; num.style.left = Math.max(0, b.x - 3.4) + '%'; num.style.top = (b.y + 0.4) + '%'; ov.appendChild(num); }
    });
    $('note').textContent = d.blanks.length ? '' : 'No boxes on this page.';
    updateScore();
  }

  function fields(){ return [...document.querySelectorAll('#ov select, #ov textarea')]; }

  function checkPage(){
    const L = label(), ans = ANS[L] || [];
    const same = MODE === 'drop' ? sameDrop : sameText;
    let ok = 0, asked = 0;
    fields().forEach((el, k) => {
      el.classList.remove('ok','bad');
      if(!ans[k]) return;
      asked++;
      if(el.value.trim() === '') return;
      if(same(el.value, ans[k])){ el.classList.add('ok'); ok++; } else el.classList.add('bad');
    });
    $('score').textContent = ans.length ? ok + ' / ' + asked + (MODE === 'drop' ? ' correct' : ' match model') : 'No model answer';
  }
  function showPage(){
    const L = label(), ans = ANS[L] || [];
    fields().forEach((el, k) => {
      if(!ans[k]) return;
      el.value = ans[k];
      state[L][k] = el.value;
      el.classList.remove('bad'); el.classList.add('ok');
    });
    $('score').textContent = 'Model answers shown';
  }
  function redoPage(){
    const L = label();
    state[L] = [];
    fields().forEach(el => { el.value = ''; el.classList.remove('ok','bad'); });
    $('score').textContent = '';
    updateScore();
  }
  function updateScore(){
    const sc = $('score'); if(!sc) return;
    const f = fields();
    if(!f.length){ sc.textContent = ''; return; }
    const filled = f.filter(el => el.value.trim() !== '').length;
    sc.textContent = filled + ' / ' + f.length + ' filled';
  }

  $('prevBtn').addEventListener('click', () => render(idx - 1));
  $('nextBtn').addEventListener('click', () => render(idx + 1));
  document.addEventListener('keydown', e => {
    if(e.target.matches('input,select,textarea')) return;
    if(e.key === 'ArrowRight') render(idx + 1);
    if(e.key === 'ArrowLeft') render(idx - 1);
  });

  buildToolbar();
  render(0);
</script>
</body>
</html>
