<title>Science Year 1 · 一年级单元评估</title>
<style>
:root{--bg:#e8f7f2;--ink:#1f3d31;--muted:#5d7a6e;--panel:#fff;--soft:#f1fbf7;--line:#2f5e4a;--accent:#2f9e7a;--good:#1f9d5a;--bad:#d9434a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Trebuchet MS",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:3px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px}
.chip{font-size:16px;font-weight:700;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:6px 12px;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:10px 14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.bar select{font:inherit;font-size:17px;font-weight:700;min-height:48px;padding:6px 10px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);flex:1 1 260px;max-width:100%}
.btn{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:6px 14px;border:3px solid var(--line);border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.navline{font-size:15px;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.navline a{color:var(--ink);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--panel);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:10px;margin:12px 0 8px}
.ptitle{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;gap:8px;flex-wrap:wrap}
.ptitle b{font-size:18px}
.tag{display:inline-block;background:var(--line);color:#fff;border-radius:10px;padding:3px 10px;font-size:14px;font-weight:700;margin-right:6px}
.stage{position:relative;margin:0 auto;max-width:900px;border:2px solid #cfe6dd;border-radius:10px;overflow:hidden;background:#fff;container-type:inline-size}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.ov{position:absolute;height:2.6cqw;font:inherit;font-size:1.9cqw;line-height:1;color:#1a3fb0;background:#fff;border:1.5px solid #9bb6e8;border-radius:5px;padding:0 4px;margin:0;min-width:0;text-align:center}
.ov.ok{background:#ddf6e6;border-color:var(--good)}
.ov.bad{background:#ffe3e3;border-color:var(--bad)}
.ov:focus{outline:3px solid var(--accent);outline-offset:1px}
.noboxes{padding:12px;color:var(--muted)}
.stage select.ov{padding:0 2px;cursor:pointer}
.stage canvas.draw{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.btn.on{background:var(--accent);color:#fff}
.stage textarea.ov{resize:none;text-align:left;line-height:1.35;padding:4px 6px;font-size:1.7cqw;height:6.5cqw}
.stage textarea.ov.ta{height:auto}
.zone{position:absolute;border:2px dashed #2f9e7a;background:rgba(241,251,247,.55);border-radius:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:4px;cursor:pointer}
.zone .zl{width:100%;font-size:1.9cqw;color:var(--green);pointer-events:none}
.chip-n{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;padding:2px 6px;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:grab;user-select:none;margin:2px}
.chip-n.sel{background:#ffe9a8}
.chip-n.ok{background:#ddf6e6;border-color:var(--good)}
.chip-n.bad{background:#ffe3e3;border-color:var(--bad)}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin:8px 0;border:2px dashed var(--line);border-radius:14px;background:var(--soft);min-height:48px}
.tray[hidden]{display:none}
.teacher{margin-top:10px;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.teacher[hidden]{display:none}
.tahead{font-weight:800;margin-bottom:8px}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed #cfe6dd}
.trow .tstu{flex:1 1 220px}
.trow .tref{flex:1 1 220px;color:var(--muted)}
.trow .btn{min-height:38px;padding:4px 10px}
.trow .btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.trow .btn.ok{background:var(--good);color:#fff;border-color:var(--good)}
.trow .btn:not(.on){opacity:.55}
.result{margin-top:10px;font-size:17px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--soft)}
.result[hidden]{display:none}
.pager{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:3px solid var(--line)}
.pager-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.pager .btn{min-width:112px;font-size:18px}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pmid select{font:inherit;font-size:16px;font-weight:700;min-height:44px;max-width:100%;padding:4px 8px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
@media (max-width:520px){.pager .btn{min-width:84px;font-size:16px;padding:4px 10px}.top h1{font-size:17px}}
</style>
</head>

</div></nav>

function canon(s, mode){
  s = (s || '').trim();
  if(mode === 'tf'){
    if(/^(√|✓|✔|对|是)$/.test(s)) return 'T';
    if(/^(×|✗|x|X|错|否)$/.test(s)) return 'F';
  }
  s = s.toLowerCase().replace(/[\s　、，,。.．()（）:：;；\-\/]/g, '');
  if(mode === 'sort') s = s.split('').sort().join('');
  return s;
}
function isRight(ans, user, mode){
  const u = canon(user, mode);
  if(!u) return false;
  return ans.split('|').some(a => canon(a, mode) === u);
}

// ---- pencil, ruler and eraser for dot-to-dot ----
function buildCanvas(p){
  const stage = $('stage');
  const cv = document.createElement('canvas');
  cv.className = 'draw'; cv.id = 'draw';
  stage.appendChild(cv);
  strokes = (st.lines && st.lines[p]) || [];
  showingLines = false;
  cv.addEventListener('pointerdown', e => {
    const q = pt(e, cv);
    if(tool === 'eraser'){ eraseAt(q); drawing = 'erase'; }
    else if(tool === 'ruler'){ drawing = {type:'ruler', pts:[q, q]}; }
    else { drawing = {type:'pencil', pts:[q]}; }
    cv.setPointerCapture(e.pointerId);
    drawLines();
  });
  cv.addEventListener('pointermove', e => {
    if(!drawing) return;
    const q = pt(e, cv);
    if(drawing === 'erase'){ eraseAt(q); }
    else if(drawing.type === 'ruler'){ drawing.pts[1] = q; }
    else { drawing.pts.push(q); }
    drawLines();
  });
  const end = () => {
    if(drawing && drawing !== 'erase'){ strokes.push(drawing); saveLines(p); }
    if(drawing === 'erase'){ saveLines(p); }
    drawing = null; drawLines();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  setPenMode();
  drawLines();
}
function pt(e, cv){
  const r = cv.getBoundingClientRect();
  return [ (e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100 ];
}
function setPenMode(){
  const cv = $('draw'); if(!cv) return;
  cv.style.pointerEvents = tool ? 'auto' : 'none';
  ['pencil','ruler','eraser'].forEach(t => $(t + 'Btn').classList.toggle('on', t === tool));
}
function eraseAt(q){
  const before = strokes.length;
  strokes = strokes.filter(s => !s.pts.some(v => Math.abs(v[0]-q[0]) < 3 && Math.abs(v[1]-q[1]) < 3));
  if(strokes.length !== before) saveLines(cur);
}
function saveLines(p){
  st.lines = st.lines || {};
  st.lines[p] = strokes.map(s => ({type: s.type, pts: s.pts}));
  save();
}
function drawLines(){
  const cv = $('draw'); if(!cv) return;
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width); cv.height = Math.round(r.height);
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const X = v => v[0] / 100 * cv.width, Y = v => v[1] / 100 * cv.height;
  const path = (pts) => { ctx.beginPath(); pts.forEach((v, k) => k ? ctx.lineTo(X(v), Y(v)) : ctx.moveTo(X(v), Y(v))); ctx.stroke(); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3;
  const cfg = LINES[cur];
  if(showingLines && cfg){
    ctx.setLineDash([8, 6]); ctx.strokeStyle = '#1f9d5a';
    cfg.pairs.forEach(([l, rr]) => path([cfg.L[l], cfg.R[rr]]));
    ctx.setLineDash([]);
  }
  strokes.forEach(s => {
    ctx.strokeStyle = s.ok === true ? '#1f9d5a' : s.ok === false ? '#d9434a' : '#1a4fc4';
    path(s.pts);
  });
  if(drawing && drawing !== 'erase'){ ctx.strokeStyle = '#1a4fc4'; path(drawing.pts); }
}
function checkLines(p){
  const cfg = LINES[p]; const used = new Set(); const near = (v, arr) => {
    let best = -1, bd = 1e9;
    arr.forEach((a, i) => { const d = Math.hypot(v[0]-a[0], v[1]-a[1]); if(d < bd){ bd = d; best = i; } });
    return bd <= 5 ? best : -1;
  };
  let ok = 0;
  strokes.forEach(s => {
    s.ok = false;
    if(s.pts.length < 2) return;
    const A = s.pts[0], B = s.pts[s.pts.length - 1];
    const tries = [[near(A, cfg.L), near(B, cfg.R)], [near(B, cfg.L), near(A, cfg.R)]];
    for(const [l, r] of tries){
      const pair = cfg.pairs.findIndex(pr => pr[0] === l && pr[1] === r);
      if(l >= 0 && r >= 0 && pair >= 0 && !used.has(pair)){ used.add(pair); s.ok = true; ok++; break; }
    }
  });
  const total = cfg.pairs.length;
  $('score').textContent = `${ok}/${total}`;
  const rr = $('result'); rr.hidden = false;
  rr.textContent = ok === total ? `全对！🎉 ${ok}/${total}` : `已连对 ${ok}/${total} 条。绿色是对的，红色的线再想一想。`;
  drawLines();
}

function check(){
  const p = cur; const list = boxesFor(p);

      c.classList.remove('ok', 'bad'); c.classList.add(DRAG[p].zones[zi].ans.includes(n) ? 'ok' : 'bad');

  $('score').textContent = `${ok}/${total}`;

}
function show(){

    $('result').hidden = false; $('result').textContent = '正确的连线用绿色虚线显示。Correct lines shown in dashed green.';

function dragScore(p){
  const cfg = DRAG[p]; const pl = placements(p); let ok = 0;
  cfg.items.forEach(lab => { const zi = pl[lab]; if(zi !== undefined && cfg.zones[zi].ans.includes(lab)) ok++; });
  return {ok, total: cfg.items.length};
}
function showDrag(p){
  const cfg = DRAG[p]; const pl = placements(p);
  cfg.zones.forEach((z, zi) => z.ans.forEach(lab => { pl[lab] = zi; }));
  save(); dragChecked = true; render(p);
}
// ---- teacher check for typed answers ----
function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function manualItems(p){ return boxesFor(p).map((b, i) => [b, i]).filter(([b]) => isManual(b)); }
function renderTeacher(){
  const p = cur; const items = manualItems(p);
  $('teacherBtn').hidden = items.length === 0;
  const panel = $('teacher');
  panel.hidden = !(teacherOpen && items.length);
  if(panel.hidden) return;
  const marked = items.filter(([, i]) => st.t && st.t[`${p}|${i}`]).length;
  const rows = items.map(([b, i], k) => {
    const key = `${p}|${i}`; const sv = (st.v[key] || '').trim() || '（空白 blank）';
    const mk = st.t && st.t[key];
    return `<div class="trow"><b>第${k + 1}格</b>` +
      `<span class="tstu">学生：${escapeHtml(sv)}</span>` +
      `<span class="tref">参考：${b[3] ? escapeHtml(b[3]) : '开放题，老师判断'}</span>` +
      `<button class="btn ok${mk === 'ok' ? ' on' : ''}" data-k="${key}" data-m="ok">✓ 对</button>` +
      `<button class="btn bad${mk === 'bad' ? ' on' : ''}" data-k="${key}" data-m="bad">✗ 错</button></div>`;
  }).join('');
  panel.innerHTML = `<div class="tahead">老师检查 Teacher check · ${marked}/${items.length} 已批改</div>` + rows;
  panel.querySelectorAll('button[data-k]').forEach(btn => btn.addEventListener('click', () => {
    const k = btn.dataset.k, m = btn.dataset.m;
    st.t = st.t || {}; st.t[k] = (st.t[k] === m ? '' : m); save();
    render(cur);
  }));
}
$('teacherBtn').addEventListener('click', () => { teacherOpen = !teacherOpen; renderTeacher(); });

let cur = Math.min(Math.max(+st.page || 2, 2), N);
function go(p){
  p = Math.min(Math.max(p, 2), N); if(SKIP.includes(p)) p = p > 43 ? 45 : 41; cur = p; st.page = p; save();
  const s = secOf(p);
  $('secSel').value = SECS.indexOf(s);
  $('pageSel').value = p;
  $('secTag').textContent = s.short;
  $('pTitle').textContent = '第 ' + p + ' 页';
  $('pgChip').textContent = `第 ${p} / ${N} 页`;
  $('prevBtn').disabled = p === 2;
  $('nextBtn').disabled = p === N;
  $('score').textContent = '未检查'; $('result').hidden = true;
  teacherOpen = false; dragChecked = false; selChip = null;
  $('tray').hidden = !DRAG[p];
  render(p);
  window.scrollTo(0, 0);
}
go(cur);
</script>
</body>
</html>
