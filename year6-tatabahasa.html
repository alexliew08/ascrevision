.q.dq{align-items:center}

</style>

    '<h4>Kata Nama Am 普通名词</h4>' +
    '<ul><li>Nama umum bagi manusia, haiwan, benda, tempat dan tumbuhan. <span class="cn">人、动物、东西、地方、植物的统一名称。</span></li>' +
    '<li>Huruf pertama hanya ditulis dengan huruf besar pada permulaan ayat. <span class="cn">除了在句子开头第一个字大写，其他的时候小写。</span></li></ul>' +
    '<p><b>Contoh (课本 Unit 1):</b> beg 书包 · tongkat 拐杖 · bukit 山坡 · hutan 森林 · jam 手表</p>' +
    '<h4>Kata Nama Khas 特别名词</h4>' +
    '<ul><li>Nama khusus bagi manusia, haiwan, benda, tempat dan tumbuhan. <span class="cn">人、动物、东西、地方、植物的特别指称。</span></li>' +

    '<h4>Kata Kerja Transitif 及物动词</h4>' +

    '<li>Kebanyakannya imbuhan meN-, tetapi tidak semuanya. <span class="cn">多数是imbuhan meN-，但不是全部。</span></li></ul>' +
    '<p><b>Contoh:</b> menjaga kesihatan 照顾安全 — <i>kesihatan</i> 是名词 (kata nama)</p>' +
    '<h4>Kata Kerja Tidak Transitif 不及物动词</h4>' +
    '<ul><li>Kata kerja yang boleh digunakan sendiri, tanpa kata nama selepasnya. <span class="cn">可以单独使用的动词，后面不用名词。</span></li>' +
    '<li>Kebanyakannya imbuhan beR- atau ter-. <span class="cn">多数是imbuhan beR/ ter-。</span></li>' +
    '<li>Ada juga yang meN-. <span class="cn">也有meN-的。</span></li></ul>' +

  { key:"N", type:"notes", title:"Kata Seruan 感叹句", html:
    '<p>Kata seruan ialah kata yang diucapkan dengan tujuan melahirkan sesuatu perasaan seperti takjub, marah, takut dan sebagainya. <span class="cn">感叹词是指具有感叹语气，用来表达强烈情感如惊讶，生气和害怕等等的词语。</span></p>' +
    '<table><tr><th>Kata seru</th><th>Maksud dan penggunaan</th></tr>' +
    '<tr><td><b>eh</b> 嘿</td><td>表示突然看到一个人或事物时的惊讶</td></tr>' +
    '<tr><td><b>nah</b> 哪</td><td>表示把东西给对方（nah 后经常会出现 ambil, guna）</td></tr>' +
    '<tr><td><b>oh</b> 哦</td><td>发现一件事的时候（oh 后经常会出现 rupa-rupanya）</td></tr>' +
    '<tr><td><b>wah</b> 哇</td><td>表示称赞</td></tr>' +
    '<tr><td><b>wahai</b> 喂</td><td>引起注意、提醒、劝告（wahai 后不会立刻出现逗号，而是出现人物之后才有逗号）</td></tr>' +
    '<tr><td><b>amboi</b> 啊</td><td>表示称赞</td></tr>' +
    '<tr><td><b>aduh</b> 哎呀</td><td>表示疼痛（aduh 后经常会出现 sakitnya）</td></tr>' +
    '<tr><td><b>hai</b> 嗨</td><td>开心地跟朋友打招呼</td></tr>' +
    '<tr><td><b>aduhai</b> 唉</td><td>悲哀（aduhai 后经常会出现 malangnya, kasihannya）</td></tr>' +
    '<tr><td><b>cis</b> 呸</td><td>生气和讨厌（cis 后经常会出现 berani）</td></tr>' +
    '<tr><td><b>syabas</b> 太好了</td><td>高兴和满意</td></tr></table>'
  }
]},

{ no:36, part:"A", kind:"notes", unitTitle:"Unit 7 · Ayat Perintah", sections:[
  { key:"N", type:"notes", title:"Ayat Perintah 祈使句", html:
    '<p>Ayat perintah ialah ayat yang digunakan dengan tujuan untuk menimbulkan sesuatu tindakan atau perbuatan. <span class="cn">祈使句是用于给予命令、行动的句子。</span></p>' +
    '<p>Ayat perintah boleh dibahagikan kepada 4 jenis:</p>' +
    '<h4>a) Ayat silaan 邀请句 (sila, jemput)</h4>' +
    '<ul><li><b>sila</b> 用于请大家做一件事 — <i>Sila beratur.</i> 请大家排队。</li></ul>' +
    '<h4>b) Ayat larangan 阻止句 (jangan, usah, tidak boleh, dilarang)</h4>' +
    '<h4>c) Ayat permintaan 要求句 (tolong, minta, harap)</h4>' +
    '<ul><li>要求被人帮你做事用 <b>tolong</b>；要求别人或超过一个人做他自己的事用 <b>minta</b>。</li>' +
    '<li><b>Tolong</b> ambilkan saya buku itu. 帮我拿书 （用 tolong）</li>' +
    '<li><b>Minta</b> buat kerja sekolah kamu. 做自己的功课 （用 minta）</li>' +
    '<li><b>Minta</b> murid-murid buat kerja sekolah. 请同学们做功课 （用 minta）</li></ul>' +
    '<h4>d) Ayat suruhan 吩咐句</h4>'
  }
]},

{ no:55, part:"A", kind:"notes", unitTitle:"Unit 9 · Kata Berimbuhan Awalan dan Akhiran", sections:[
  { key:"N", type:"notes", title:"Cara menambah imbuhan 加 imbuhan 小技巧", html:
    '<ol><li><b>me / pe</b> = l → r → n → m → w。<span class="cn">一开始 l，加了一笔变 r，再加一笔就是 n，又加一笔变成 m，最后跌个四脚朝天，变成了 w。</span></li>' +
    '<li><b>men / pen</b> = c（迟）, d（到）, j（就是）, t（兔）, z（子）。<span class="cn">迟到了，所以要被删除。</span></li>' +
    '<li><b>mem / pem</b> = b（不）, f（放）, p（屁）。<span class="cn">你放屁真臭，我要把它删除。</span></li>' +
    '<li><b>meng / peng</b> = a e i o u（5 个朋友）, g（go）, h（Hong Kong）, k（kong）。<span class="cn">去到 Hong Kong 购物，口袋肯定 kong kong（空空），还带回来干嘛？一律删除。</span></li>' +
    '<li><b>meny / peny</b> = s（死）。<span class="cn">都死了，还留着干嘛？把它删除吧。</span></li>' +
    '<li><b>menge / penge</b> = satu suku kata（一个读音）例：cat, lap, mop。</li></ul>' +
    '<p>如果加 imbuhan “di”，该字后面经常出现 “oleh”。</p>' +
    '<p><b>Contoh:</b> masak → memasak · tulis → menulis（要把 t 删除） · pasang → memasang（要把 p 删除） · kata → mengata（要把 k 删除） · susu → menyusu（要把 s 删除）</p>'
  }
]},

(function () {

  function firstOpen() { for (var j = 0; j < PAGES.length; j++) { if (!st.done[PAGES[j].no]) return j; } return PAGES.length - 1; }
  var cur = Math.min(Math.max(+st.cur || 0, 0), PAGES.length - 1);


  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[‘’“”"'.,;:!?()\[\]\-–—_\/]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function nospace(s) { return norm(s).replace(/ /g, ''); }
  function pics(no, key) { return (window.TB_PICS && window.TB_PICS[no + '-' + key]) || []; }
  // a section may name its picture set with picSide (e.g. "103-A:R"); fall back to the plain key
  function secPics(no, sec) {
    var l = sec.picSide ? pics(no, sec.key + ':' + sec.picSide) : [];
    return l.length ? l : pics(no, sec.key);
  }
  function picSrc(file) { return (window.TB_IMGS && window.TB_IMGS[file]) || ''; }

  function blanksIn(q) { return (String(q).match(/_{2,}/g) || []).length; }
  function splitBlanks(q) { return String(q).split(/_{2,}/); }

  // ---- answer checking per item ----
  function checkItem(no, si, sec, it, ii) {
    // returns {total, right, blank}
    var k = no + '|' + si + '|' + ii;
    var t = sec.type;
    if (t === 'pic') {
      var v = st.v[k + '|0'] || '';
      return { total: 1, right: nospace(v) === nospace(it.a) ? 1 : 0, blank: v.trim() ? 0 : 1, els: [k + '|0'] };
    }
    if (t === 'circle' || t === 'sel') {
      var nbs = Math.max(1, splitBlanks(it.q).length - 1);
      var ansS = Array.isArray(it.a) ? it.a : [it.a];
      var rS = 0, bS = 0, elsS = [];
      for (var cs = 0; cs < nbs; cs++) {
        var vs = st.v[k + '|' + cs] || ''; elsS.push(k + '|' + cs);
        if (vs && vs === ansS[cs]) rS++;
        if (!vs) bS++;
      }
      return { total: nbs, right: rS, blank: bS, els: elsS };
    }
    if (t === 'drag' && sec.units) {
      var ua = it.a || []; var ur = 0, ub = 0, uels = [];
      for (var ui = 0; ui < ua.length; ui++) { var uv = st.v[k + '|' + ui] || ''; uels.push(k + '|' + ui); if (uv && nospace(uv) === nospace(ua[ui])) ur++; if (!uv) ub++; }
      return { total: ua.length, right: ur, blank: ub, els: uels };
    }
    if (t === 'drag') {
      var nb = blanksIn(it.q) || 1; var rightN = 0, blankN = 0; var els = [];
      if (nb === 1) { var dv = st.v[k + '|0'] || ''; els.push(k + '|0'); if (nospace(dv) && nospace(dv) === nospace(it.a)) rightN = 1; if (!dv) blankN = 1; return { total: 1, right: rightN, blank: blankN, els: els }; }
      var ans = Array.isArray(it.a) ? it.a : [it.a];
      for (var b = 0; b < nb; b++) { var dv2 = st.v[k + '|' + b] || ''; els.push(k + '|' + b); if (nospace(dv2) && nospace(dv2) === nospace(ans[b])) rightN++; if (!dv2) blankN++; }
      return { total: nb, right: rightN, blank: blankN, els: els };
    }
    if (t === 'fill') {
      var nb2 = blanksIn(it.q) || 1; var rightF = 0, blankF = 0; var els2 = [];

      for (var c = 0; c < nb2; c++) {

        var target = answers[c] !== undefined ? answers[c] : answers[0];
        if (Array.isArray(it.a) && nb2 > 1) { if (nospace(fv) && answers.some(function (a) { return nospace(a) === nospace(fv); })) rightF++; }
        else if (nospace(fv) && nospace(fv) === nospace(target)) rightF++;
        if (!fv.trim()) blankF++;
      }
      if (nb2 === 1) return { total: 1, right: rightF, blank: blankF, els: els2 };
      return { total: nb2, right: rightF, blank: blankF, els: els2 };
    }
    if (t === 'uline') {
      var u = JSON.parse(st.v[k] || '[]');
      var words = it.s.split(' ');
      var want = {}; (it.a || []).forEach(function (w) { norm(w).split(' ').forEach(function (x) { if (x) want[x] = true; }); });
      var got = {}; u.forEach(function (i) { norm(words[i] || '').split(' ').forEach(function (x) { if (x) got[x] = true; }); });
      var ok = Object.keys(want).every(function (x) { return got[x]; }) && Object.keys(got).every(function (x) { return want[x]; });
      return { total: 1, right: ok ? 1 : 0, blank: u.length ? 0 : 1, els: [k] };
    }
    if (t === 'build') {

      var built = bsel.map(function (i) { return it.u[i]; }).join(' ');
      return { total: 1, right: bsel.length && nospace(built) === nospace(it.a) ? 1 : 0, blank: bsel.length ? 0 : 1, els: [k] };
    }
    if (t === 'dots') {
      var lv = st.v[no + '|' + si + '|L' + ii] || '';
      var letter = sec.right[it.a].e;
      return { total: 1, right: lv === letter ? 1 : 0, blank: lv ? 0 : 1, els: [no + '|' + si + '|L' + ii] };
    }
    if (t === 'grid') {
      var rr = 0, bb = 0, els3 = [];
      var arr = it.a || [];
      for (var g = 0; g < arr.length; g++) { var gv = st.v[k + '|' + g] || ''; els3.push(k + '|' + g); if (gv && gv === arr[g]) rr++; if (!gv) bb++; }
      return { total: 1, right: rr === arr.length ? 1 : 0, blank: bb ? 1 : 0, els: els3 };
    }
    return { total: 0, right: 0, blank: 0, els: [] };
  }

  function pageScore(p) {
    var tot = 0, rt = 0, bl = 0;
    p.sections.forEach(function (sec, si) {
      var list = sec.type === 'dots' ? sec.left : sec.items;
      if (!list) return;
      list.forEach(function (it, ii) {
        var r = checkItem(p.no, si, sec, it, ii);
        tot += r.total; rt += r.right; bl += r.blank;
      });
    });
    return { total: tot, right: rt, blank: bl };
  }

  // ---- rendering ----
  function picBox(no, key, idx, n, size) {
    var list = pics(no, key);
    var f = list[idx];
    if (!f) return '';
    return '<img class="thumb' + (size ? ' ' + size : '') + '" alt="Gambar ' + n + '" src="' + picSrc(f) + '">';
  }

  function bankChips(p, si, sec) {
    if (!sec.bank) return '';
    // every word in the bank stays available; a word can be used in more than one blank
    var chips = sec.bank.map(function (w) {
      return '<span class="chip" draggable="true" data-w="' + esc(w) + '">' + esc(w) + '</span>';
    }).join('');
    return '<div class="bank" data-si="' + si + '"><span class="bl">Kata:</span>' + chips + '</div>';
  }

  // Layout: each question is a row. Question text (and any picture) on the left, answers on the right.
  function renderLeft(p) {
    var html = '';
    p.sections.forEach(function (sec) {
      var list = secPics(p.no, sec);
      if (!list.length || sec.type === 'grid' || sec.type === 'uline' || sec.type === 'dots') return;
      var n = (sec.items || []).length;
      html += '<div class="pcard"><div class="ph">' + esc(sec.key) + '. ' + esc(sec.title) + '</div><div class="pgrid' + (list.length <= 2 ? ' few' : '') + '">';
      list.forEach(function (f, i) {
        var label = (list.length === n || n === 0) ? (i + 1) : '';
        html += '<figure class="pfig">' + (label ? '<figcaption>' + label + '</figcaption>' : '') + '<img alt="Gambar ' + (i + 1) + '" src="' + picSrc(f) + '"></figure>';
      });
      html += '</div></div>';
    });
    return html;
  }

  function gapText(q) {
    return splitBlanks(q).map(function (s) { return esc(s).replace(/\n/g, '<br>'); }).join('<span class="gap">______</span>');
  }

  function renderRight(p) {
    var html = '';
    p.sections.forEach(function (sec, si) {
      if (sec.type === 'notes') { html += '<div class="notes">' + sec.html + '</div>'; return; }
      if (!sec.items && sec.type !== 'dots') return;
      var hasPics = secPics(p.no, sec).length > 0;
      html += '<div class="qsec"><h3><span class="letter">' + esc(sec.key) + '</span> ' + esc(sec.title) + '</h3>';
      if (sec.instr) html += '<p class="instr">' + esc(sec.instr) + '</p>';

      if (sec.bank && (sec.type === 'drag' || sec.type === 'pic')) html += bankChips(p, si, sec);
      if (sec.type === 'grid') html += bankChips(p, si, sec) + gridHtml(p, si, sec);
      else if (sec.type === 'dots') html += dotsHtml(p, si, sec);
      else if (sec.type === 'uline') html += ulineHtml(p, si, sec);
      else if (sec.type === 'build') html += buildHtml(p, si, sec);
      else {
        // two columns: the first half of the questions on the left, the rest on the right (even split)
        var half = Math.ceil(sec.items.length / 2);
        var rowsOf = function (list, from) { return list.map(function (it, i) { return rowHtml(p, si, sec, it, from + i, hasPics); }).join(''); };
        html += '<div class="cols"><div class="col">' + rowsOf(sec.items.slice(0, half), 0) + '</div>' +
          '<div class="col">' + rowsOf(sec.items.slice(half), half) + '</div></div>';
      }
      html += '</div>';
    });
    return html;
  }

  // Every blank is shown on its own line: the drop box, dropdown or typed box sits in the blank.
  function rowHtml(p, si, sec, it, ii, hasPics) {
    var k = p.no + '|' + si + '|' + ii;
    var numHtml = it.n ? '<span class="qn">' + it.n + '.</span>' : '';
    var ctl = function (kk, opts) {
      if (sec.type === 'circle' || sec.type === 'sel') {
        return '<select class="ans inl" data-k="' + kk + '"><option value="">— Pilih —</option>' +
          (it.o || sec.o || []).map(function (o) { return '<option value="' + esc(o) + '"' + (st.v[kk] === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
      }
      if (sec.type === 'drag' || (sec.type === 'pic' && sec.bank)) {
        return '<span class="drop" data-k="' + kk + '">' + (st.v[kk] ? esc(st.v[kk]) : '…') + '</span>';
      }
      return '<input class="ans ' + (sec.wide ? 'wide' : 'inl') + '" data-k="' + kk + '" autocomplete="off" value="' + esc(st.v[kk] || '') + '">';
    };
    var body = '';
    if (sec.type === 'drag' && sec.units) {
      var placed = {}; (it.a || []).forEach(function (_, ui) { var pv = st.v[k + '|' + ui]; if (pv) placed[pv] = true; });
      var chipsU = (it.u || []).filter(function (w) { return !placed[w]; }).map(function (w) { return '<span class="chip" draggable="true" data-w="' + esc(w) + '">' + esc(w) + '</span>'; }).join('');
      body = '<div class="bank">' + chipsU + '</div><div>' + (it.a || []).map(function (_, ui) { return ctl(k + '|' + ui); }).join(' ') + '</div>';
    } else if (sec.type === 'pic' && sec.bank) {
      body = ctl(k + '|0');
    } else if (sec.type === 'pic') {
      var kk0 = k + '|0';
      body = '<span class="scr">' + esc(it.h) + '</span> <span class="paren">(</span><input class="ans short" data-k="' + kk0 + '" autocomplete="off" value="' + esc(st.v[kk0] || '') + '"><span class="paren">)</span>';    } else {
      var parts = splitBlanks(it.q);
      if (parts.length <= 1) {
        body = esc(it.q).replace(/\n/g, '<br>') + ' ' + ctl(k + '|0');
      } else {
        body = parts.map(function (s, bi) {
          return esc(s).replace(/\n/g, '<br>') + (bi < parts.length - 1 ? ctl(k + '|' + bi) : '');
        }).join('');
      }
    }
    return '<div class="q row">' + numHtml + '<div class="qt">' + body + '</div></div>';
  }
  function ulineHtml(p, si, sec) {
    var html = '';
    sec.items.forEach(function (it, ii) {
      var k = p.no + '|' + si + '|' + ii;
      var sel = JSON.parse(st.v[k] || '[]');
      var words = it.s.split(' ').map(function (w, i) {
        return '<span class="w' + (sel.indexOf(i) >= 0 ? ' on' : '') + '" data-k="' + k + '" data-i="' + i + '">' + esc(w) + '</span>';
      }).join(' ');
      html += '<div class="q"><span class="qn">' + it.n + '.</span><div class="qb"><div class="qt uword">' + words + '</div></div></div>';
    });
    return html;
  }

  // Build a sentence: the words are shown as chips; tap a chip to add it, tap a word in the sentence to remove it.
  function buildHtml(p, si, sec) {
    var half = Math.ceil(sec.items.length / 2);
    var one = function (it, ii) {
      var k = p.no + '|' + si + '|' + ii;
      var sel = JSON.parse(st.v[k] || '[]');
      var used = {}; sel.forEach(function (i) { used[i] = true; });
      var chips = it.u.map(function (w, i) {
        return '<span class="bw' + (used[i] ? ' used' : '') + '" data-k="' + k + '" data-i="' + i + '">' + esc(w) + '</span>';
      }).join('');
      var built = sel.length ? sel.map(function (i) {
        return '<span class="bwd" data-k="' + k + '" data-i="' + i + '">' + esc(it.u[i]) + '</span>';
      }).join(' ') : '<span class="muted">…</span>';
      return '<div class="q bq"><span class="qn">' + it.n + '.</span><div class="qb"><div class="bank">' + chips + '</div>' +
        '<div class="built" data-bk="' + k + '">' + built + '</div></div></div>';
    };
    var rows = function (list, from) { return list.map(function (it, i) { return one(it, from + i); }).join(''); };
    return '<div class="cols"><div class="col">' + rows(sec.items.slice(0, half), 0) + '</div><div class="col">' + rows(sec.items.slice(half), half) + '</div></div>';
  }

  function dotsHtml(p, si, sec) {
    var sp = pics(p.no, sec.key);
    var rights = sec.right.map(function (r, i) {
      var content = sp.length && picSrc(sp[i]) ? '<img class="rpic" alt="Gambar ' + String.fromCharCode(65 + i) + '" src="' + picSrc(sp[i]) + '">' : esc(r.e);
      return '<li><b>' + String.fromCharCode(65 + i) + '.</b> ' + content + '</li>';
    }).join('');
    // the answer texts go into the dropdown; the list above is only kept when there are pictures
    var letters = sec.right.map(function (r) { return r.e; });
    var html = sp.length ? '<ol class="rlist">' + rights + '</ol>' : '';
    var rowsD = sec.left.map(function (l, li) {
      var k = p.no + '|' + si + '|L' + li;
      var v = st.v[k] || '';
      var opts = '<option value="">— Pilih —</option>' + letters.map(function (L) { return '<option value="' + esc(L) + '"' + (v === L ? ' selected' : '') + '>' + esc(L) + '</option>'; }).join('');
      // question text and its dropdown sit side by side on one line
      return '<div class="q dq"><span class="qn">' + l.n + '.</span><div class="qt">' + esc(l.q) + '</div><select class="ans dsel" data-k="' + k + '">' + opts + '</select></div>';
    });
    var halfD = Math.ceil(rowsD.length / 2);
    html += '<div class="cols"><div class="col">' + rowsD.slice(0, halfD).join('') + '</div><div class="col">' + rowsD.slice(halfD).join('') + '</div></div>';
    return html;
  }

  function gridHtml(p, si, sec) {
    var head = '<tr><th></th>' + sec.cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
    var rows = sec.items.map(function (it, ii) {
      var cells = sec.cols.map(function (c, ci) {
        var k = p.no + '|' + si + '|' + ii + '|' + ci;
        return '<td><span class="drop" data-k="' + k + '">' + (st.v[k] ? esc(st.v[k]) : '…') + '</span></td>';
      }).join('');
      return '<tr><td class="rn">' + it.n + '.</td>' + cells + '</tr>';
    }).join('');
    return '<div class="tblwrap"><table class="gtbl">' + head + rows + '</table></div>';
  }

  function render() {
    var p = PAGES[cur];
    renderTabs();
    var isNote = p.kind === 'notes';
    $('pagehead').textContent = (isNote ? 'Nota ' : 'Latihan ') + p.no + ' · ' + p.unitTitle;
    // explanation pages have no check or reset buttons
    $('footBar').style.display = isNote ? 'none' : '';
    $('counter').textContent = (cur + 1) + ' / ' + PAGES.length;
    var left = renderLeft(p);
    $('left').innerHTML = left;
    $('left').style.display = left ? '' : 'none';
    $('split').classList.toggle('single', !left);
    $('right').innerHTML = renderRight(p);
    $('score').textContent = '';
    $('blank').textContent = '';
    $('prev').disabled = cur === 0;
    $('next').disabled = cur === PAGES.length - 1;
    st.cur = cur; save();
    window.scrollTo(0, 0);
    bind();
  }

  function bind() {
    document.querySelectorAll('#right [data-k]').forEach(function (el) {
      if (el.classList.contains('drop')) return;
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
        st.v[el.dataset.k] = el.value; save(); el.classList.remove('ok', 'bad');
        $('score').textContent = ''; $('blank').textContent = '';
      });
    });
    // build-a-sentence: tap a word to add it, tap a word in the sentence to remove it
    document.querySelectorAll('#right .bw').forEach(function (w) {
      w.addEventListener('click', function () {
        if (w.classList.contains('used')) return;
        var k = w.dataset.k, i = +w.dataset.i;
        var sel = JSON.parse(st.v[k] || '[]');
        if (sel.indexOf(i) < 0) sel.push(i);
        st.v[k] = JSON.stringify(sel); save(); render();
      });
    });
    document.querySelectorAll('#right .bwd').forEach(function (w) {
      w.addEventListener('click', function () {
        var k = w.dataset.k, i = +w.dataset.i;
        var sel = JSON.parse(st.v[k] || '[]').filter(function (x) { return x !== i; });
        st.v[k] = JSON.stringify(sel); save(); render();
      });
    });
    document.querySelectorAll('#right .w').forEach(function (w) {
      w.addEventListener('click', function () {
        var k = w.dataset.k, i = +w.dataset.i;
        var sel = JSON.parse(st.v[k] || '[]');
        var at = sel.indexOf(i);
        if (at >= 0) sel.splice(at, 1); else sel.push(i);
        st.v[k] = JSON.stringify(sel); save();
        w.classList.toggle('on');
        $('score').textContent = ''; $('blank').textContent = '';
      });
    });
    // drag chips and drop zones (drag, or tap a chip then tap a box)
    var selected = null;
    document.querySelectorAll('#right .chip').forEach(function (c) {
      c.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', c.dataset.w); });
      c.addEventListener('click', function () {
        selected = (selected === c.dataset.w) ? null : c.dataset.w;
        document.querySelectorAll('#right .chip').forEach(function (x) { x.classList.toggle('sel', x.dataset.w === selected); });
      });
    });
    document.querySelectorAll('#right .drop').forEach(function (d) {
      d.addEventListener('dragover', function (e) { e.preventDefault(); });
      d.addEventListener('drop', function (e) { e.preventDefault(); place(d, e.dataTransfer.getData('text/plain')); });
      d.addEventListener('click', function () {
        if (st.v[d.dataset.k]) { delete st.v[d.dataset.k]; save(); render(); return; }
        if (selected) { place(d, selected); selected = null; }
      });
    });
  }

  function place(d, word) {
    if (!word) return;
    st.v[d.dataset.k] = word; save(); render();
  }

  function check() {
    var p = PAGES[cur];
    var s = pageScore(p);
    $('score').textContent = s.right + '/' + s.total;
    if (s.blank > 0) $('blank').textContent = 'Masih ada ' + s.blank + ' soalan kosong.';
    else if (s.total > 0 && s.right === s.total) $('blank').textContent = 'Tahniah! Semua jawapan betul.';
    else $('blank').textContent = 'Cuba semula. Jawapan merah perlu disemak.';
    // mark each item
    p.sections.forEach(function (sec, si) {
      var list = sec.type === 'dots' ? sec.left : sec.items;
      if (!list) return;
      list.forEach(function (it, ii) {
        var r = checkItem(p.no, si, sec, it, ii);
        if (sec.type === 'build') {
          var bb = document.querySelector('#right .built[data-bk="' + r.els[0] + '"]');
          if (bb) { bb.classList.toggle('ok', r.right === 1); bb.classList.toggle('bad', r.right !== 1 && r.blank === 0); }
          return;
        }
        r.els.forEach(function (k) {
          var el = document.querySelector('#right [data-k="' + k + '"]');
          if (!el) return;
          var v = st.v[k] || '';
          var good = null;
          if (sec.type === 'pic' || sec.type === 'fill') good = nospace(v) && (Array.isArray(it.a) ? it.a.some(function (a) { return nospace(a) === nospace(v); }) : nospace(v) === nospace(it.a));
          if (sec.type === 'circle' || sec.type === 'sel') { var bIdx = +(k.split('|').pop()) || 0; good = v === (Array.isArray(it.a) ? it.a[bIdx] : it.a); }
          if (sec.type === 'drag' && sec.units) good = v && nospace(v) === nospace(it.a[+(k.split('|').pop())]);
          else if (sec.type === 'drag') good = v && (Array.isArray(it.a) ? nospace(v) === nospace(it.a[+(k.split('|').pop())]) : nospace(v) === nospace(it.a));
          if (good === null) return;
          el.classList.toggle('ok', !!good); el.classList.toggle('bad', !good && !!v);
        });
      });
    });
    var allOk = !!(s.total > 0 && s.right === s.total);
    st.done[p.no] = allOk;
    st.bad = st.bad || {};
    st.bad[p.no] = !allOk;
    save();
    if (allOk && cur < PAGES.length - 1) { cur++; render(); window.scrollTo(0, 0); } else { render_sel(); }
  }
  function renderTabs() {
    $('tabs').innerHTML = PAGES.map(function (q, i) {
      return '<button class="tab' + (i === cur ? ' on' : '') + (st.done[q.no] ? ' ok' : '') + (st.bad && st.bad[q.no] && !st.done[q.no] ? ' bad' : '') + '" type="button" data-i="' + i + '">' + (q.kind === 'notes' ? 'Nota ' : 'Latihan ') + q.no + (st.done[q.no] ? ' ✓' : '') + '</button>';
    }).join('');
  }
  function render_sel() { renderTabs(); }

  function redo() {
    var p = PAGES[cur];
    Object.keys(st.v).forEach(function (k) { if (k.indexOf(p.no + '|') === 0) delete st.v[k]; });
    delete st.done[p.no];
    if (st.bad) delete st.bad[p.no];
    save(); render();
  }

  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (!b) return; cur = +b.dataset.i; render(); });
  $('prev').addEventListener('click', function () { if (cur > 0) { cur--; render(); } });
  $('next').addEventListener('click', function () { if (cur < PAGES.length - 1) { cur++; render(); } });
  $('checkBtn').addEventListener('click', check);
  $('resetAll').addEventListener('click', redo);
  render();
})();
</script>
</body>
</html>
