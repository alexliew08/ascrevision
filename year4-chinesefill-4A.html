{u:1,unit:"第一单元 成长之旅",lesson:"（三）颂赞温情",no:7,instr:"填写正确的答案。",bank:["感叹","仓库","品尝","包裹"],q:["店员正在整理___________里堆积如山的货品。","胜家超级市场每月定期点算___________里的货物，以免出现库存不足的情况。","洁敏难过地抱起奄奄一息的小狗，___________人们对动物的冷漠。","我和姐姐为妈妈煮了一碗长寿面，请她细细___________。","我到邮政局寄___________给在国外生活的表姐。"],a:["仓库","仓库","感叹","品尝","包裹"]},

{u:1,unit:"第一单元 成长之旅",lesson:"（四）桃园结义",no:6,instr:"圈出正确的答案。",bank:[],q:["（基于，基本）种种原因，这场活动被迫延期至明年。","王伯伯品德（高尚，时尚），深受人们敬重。","爱迪生努力奋斗的（事迹，足迹），激发了我们努力向上的斗志。","李白的诗千古（传诵，背诵），对后世影响很大。","我和郭康这些年来一直是（肝胆相照，心肝）的好朋友。","在数学竞赛中，永城（战胜，战争）其他选手，一举夺下冠军。","（历尽，历史）无数困难，他才有了今日的成就。","那名青年英勇救人的（事迹，奇迹），很快在村里传开了。"],a:["基于","高尚","事迹","传诵","肝胆相照","战胜","历尽","事迹"]},
{u:1,unit:"第一单元 成长之旅",lesson:"（四）桃园结义",no:7,instr:"填写正确的答案。",bank:["腐败","掀起","陷阱","事迹","立誓"],q:["清政府___________无能，处处割地赔款，使金瓯无缺的国土千孔百疮。","在环保组织的鼓吹下，社会___________植树造林的新高潮。","弟子们___________必将中国武术发扬光大。","猎人们在野猪经常出没的地方布下了___________。","张明明拾金不昧的___________传遍全校。"],a:["腐败","掀起","立誓","陷阱","事迹"]},

{u:1,unit:"第一单元 成长之旅",lesson:"（五）蚊帐大使",no:1,instr:"填写正确的答案。",bank:["肆虐","恐惧","抚摸","平均","描述"],q:["弟弟生动地___________了他在街上看到的魔术表演。","那个村庄遭到洪水___________，村民损失惨重。","这个袋子里有20颗糖果，___________每人可得5颗。","妈妈的安慰，让我不再___________，心情平静多了。","妹妹轻轻地___________怀中的小猫。"],a:["描述","肆虐","平均","恐惧","抚摸"]},

{u:1,unit:"第一单元 成长之旅",lesson:"（五）蚊帐大使",no:3,instr:"填写正确的答案。",bank:["携手","户","平均","排行榜","捐献"],q:["这___________人家虽然很富有，但是一点儿也不骄傲。","这首歌很受欢迎，多次位居___________的第一名。","林爷爷把这些年收藏的书籍和字画___________给学校。","只要我们___________努力，就能达成目标。","弟弟这个学期的考试，___________成绩才50分。"],a:["户","排行榜","捐献","携手","平均"]},
{u:1,unit:"第一单元 成长之旅",lesson:"（五）蚊帐大使",no:4,instr:"填写正确的答案。",bank:["描述","户","捐献","榜样","荣誉"],q:["为了国家___________，我国选手在赛场上奋力拼搏。","这个村落大大小小共有80___________人家。","他勤奋好学，是我们学习的好___________。","那名慈善家___________了500万美元给孤儿院。","这篇报导___________了海啸发生时，万人逃难的情景。"],a:["荣誉","户","榜样","捐献","描述"]},
{u:1,unit:"第一单元 成长之旅",lesson:"（五）蚊帐大使",no:5,instr:"圈出正确的答案。",bank:[],q:["刘女士向警方（描述，述职）皮包被抢的经过。","在这流感（肆虐，虐待）的季节，当局奉劝大家不要到人多拥挤的地方。","这次参赛的两支篮球队伍，实力（平均，均匀），各有千秋。","面对观众，妹妹毫不（恐惧，恐吓），在音乐中翩翩起舞。","母亲（抚摸，抚爱）着女儿的手，给予她温暖的鼓励。","黄校长的表情（严肃，严厉），同学们对他总是恭恭敬敬。","郑先生打算在阳台（设计，计算）一个山水空中花园。","书画家在作品上盖上（章程，印章），才把画作交给画廊负责人。","银行批准了林叔叔的贷款，条件是他需在两年内还清借贷（条款，款项）。","我国体育健儿在亚运会上夺得十面金牌，又一次为国家争得（荣誉，誉称）。"],a:["描述","肆虐","平均","恐惧","抚摸","严肃","设计","印章","条款","荣誉"]},
{u:1,unit:"第一单元 成长之旅",lesson:"（五）蚊帐大使",no:6,instr:"圈出正确的答案。",bank:[],q:["那栋公寓一夜间有多（户，间）住家遭宵小光顾，惊动了整个社区。","这本小说很受欢迎，在上个月登上了畅销书（榜样，排行榜）。","社会上的热心人士，都愿意给灾区小朋友（捐献，贡献）图书和文具。","老师和家长（携手，携带）并肩，为培养优秀的下一代而共同努力。","爸爸向我绘声绘色地（描述，描绘）我们家族的历史。","育英和父母一起加入（筹款，款式）建校的活动，为教育出一份力。","看见他装神弄鬼的模样，孩子们露出（恐惧，恐怖）的神色，并连连后退。","看完这部（恐惧，恐怖）片后，我一直心惊肉跳，无法入眠。","爸爸向银行借贷一笔（款项，款式）以扩展业务。","姐姐设计的衣服（款项，款式）新颖大方，我很喜欢。"],a:["户","排行榜","捐献","携手","描述","筹款","恐惧","恐怖","款项","款式"]},
{u:1,unit:"第一单元 成长之旅",lesson:"（五）蚊帐大使",no:7,instr:"圈出正确的答案。",bank:[],q:["我们不可以做有损学校（名誉，荣誉）的事。","为了班级的（名誉，荣誉），每个同学都在赛场上拼尽全力。","我怎么想不起当初（设计，设置）的密码。","这项产品（设计，设置）充分考虑了人们使用时的方便性。","那名歌手的歌声很温暖，（抚摸，抚慰）了许多人的心灵。","妈妈看着正在玩积木的妹妹，爱怜地（抚摸，抚慰）她的头发。","爸爸平日很（严格，严肃），让人难以接近。","为了一举夺下冠军宝座，教练对队员们进行（严格，严肃）的训练。","为了购买十顶蚊帐，凯琳和家人一起到处（付款，筹款）。","在凯琳积极的行动下，成功（拯救，抢救）了多名非洲孩子。"],a:["名誉","荣誉","设置","设计","抚慰","抚摸","严肃","严格","筹款","拯救"]},

{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:1,instr:"填写正确的答案。",bank:["钻","翠绿","四肢","矮丛","清脆"],q:["___________的枝叶将鲜红的花朵衬托得格外美丽。","漂亮的蝴蝶在___________中飞来飞去。","早晨，鸟儿___________的歌声给大地带来生气。","晚上十点整，我就___________进被窝里睡觉了。","每天早上，爷爷会到公园打太极拳，伸展___________，锻炼身体。"],a:["翠绿","矮丛","清脆","钻","四肢"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:2,instr:"填写正确的答案。",bank:["领悟力","激愤","疏于","统统","额头"],q:["他因为一句话而被___________，过了好久才冷静下来。","这里太闷热了，大家的___________上都布满了豆大般的汗珠。","佩文的___________很强，学习很快，成绩向来都很好。","他因为过于自信，而___________防范，让对手把球抢走了。","这次大扫除，我和家人把旧书和旧衣服___________捐给孤儿院。"],a:["激愤","额头","领悟力","疏于","统统"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:3,instr:"填写正确的答案。",bank:["伙伴","酷热","肢体","例外","催促声"],q:["课堂上，大家都聚精会神地听课，我也不___________。","在班上的___________下，我们赶紧交上作业。","李伯伯是爸爸的童年___________，感情非常好。","今天天气___________，衣服晒在外面一会儿就干了。","何老师讲课时___________语言特别丰富。"],a:["例外","催促声","伙伴","酷热","肢体"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:4,instr:"填写正确的答案。",bank:["翠绿","促使","统统","小伙伴","催促"],q:["表哥帮我把电脑里的病毒___________清除了。","每天早晨，妈妈总是___________我早点儿起床去上学。","科技的进步，___________社会快速发展。","放学后，我们几个___________一起到河边捉鱼。","连绵不断的山峦，如___________的波浪起伏，引人入胜。"],a:["统统","催促","促使","小伙伴","翠绿"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:5,instr:"圈出正确的答案。",bank:[],q:["公园里的（矮丛，丛林），最适合作为捉迷藏的藏身地了。","胡小莉的歌声（清脆，清弱）又响亮，动听极了。","当土拨鼠遇到天敌，就会马上（钻入，钻探）地洞。","妈妈感到（四肢，肢势）无力，于是放下工作好好休息。","楚阳性格冲动，脾气也不太好，容易被言语（激愤，激然）。","哥哥强忍伤口的疼痛，（额头，额外）上却仍冒出豆大的汗珠。","凯心学习能力强，（领导力，领悟）高，常在课业上帮助学习较差的同学。","球员（疏于，对于）防范，失分连连，结果输了比赛。","老裁缝师把店里的事（统统，统计）交由秀秀负责。","（残酷，酷热）的太阳把田地晒得龟裂开来。"],a:["矮丛","清脆","钻入","四肢","激愤","额头","领悟","疏于","统统","酷热"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:6,instr:"圈出正确的答案。",bank:[],q:["所有参赛者都必须遵守规矩，谁也不能（例如，例外）。","洪老师（催泪，催促）同学们赶紧上巴士，免得赶不及在天黑前抵达目的地。","妈妈看到儿时的（伙计，伙伴），便说起童年的趣事。","看见妈妈的泪水后，志良（领悟，醒悟）自己做错了事。","假期才刚开始，我就把老师吩咐的作业（统一，统统）完成了。","经过爸爸的再三（催促，促使），永健才懒洋洋地从床上爬了起来。","雨绮的歌声（清脆，脆弱）且悦耳，台下的评审听后纷纷点头称好。","我和家家是最合拍的（陪伴，伙伴）。"],a:["例外","催促","伙伴","醒悟","统统","催促","清脆","伙伴"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:7,instr:"填写正确的答案。",bank:["额头","催促","翠绿","传统","四肢"],q:["妈妈___________我赶紧出门，以免迟到。","爷爷奶奶依然遵守着一些___________习俗。","走进树林，___________的环境让我心旷神怡。","我饿了一整天，不但头晕，而且___________乏力。","他拍了一下___________，道：“啊，我忘了带钱包！”"],a:["催促","传统","翠绿","四肢","额头"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:8,instr:"填写正确的答案。",bank:["清脆","统统","领悟","酷热","领悟"],q:["天气___________，黄狗躲在屋檐下，不断地吐着舌头。","我从“老鹰捉小鸡”的游戏中___________了团结的重要性。","那名歌手的歌声___________动听，让人陶醉。","我和哥哥把旧报纸___________收到储藏室里。","经过老师的讲解，我们才___________到这首诗的含义。"],a:["酷热","领悟","清脆","统统","领悟"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（六）亲近传统游戏",no:9,instr:"填写正确的答案。",bank:["矮丛","翠绿","伙伴","属于","促销"],q:["放眼望去，稻田像一片片___________的地毯。","我和哥哥一左一右，要把躲在___________后的野兔抓起来。","困难只能吓倒懦夫懒汉，而胜利永远___________敢于攀登高峰的人。","佳节期间，好多商场都靠___________活动来吸引消费者。","叔叔和几个___________一起开了一家火锅店，生意蛮好的。"],a:["翠绿","矮丛","属于","促销","伙伴"]},

{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:1,instr:"填写正确的答案。",bank:["联络","震惊","敏捷","破烂","打搅"],q:["足球场上，国康动作___________地把球踢进球门里。","爷爷正在写书法，你不要去___________。","这则新闻___________了全世界！","那个乞丐穿着___________不堪，在街边向路人乞讨。","毕业后，哥哥和很多同学都失去___________。"],a:["敏捷","打搅","震惊","破烂","联络"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:2,instr:"填写正确的答案。",bank:["打搅","灿烂","聪明伶俐","震动","敏捷"],q:["今天阳光___________，是个大好天。","这项发现在科学界引起了___________。","顽皮的猴子___________地爬上了树顶。","姐姐在看书，我静静地坐在一旁，不___________她。","妹妹从小就___________，活泼可爱。"],a:["灿烂","震动","敏捷","打搅","聪明伶俐"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:3,instr:"填写正确的答案。",bank:["打搅","基础","震惊","敏捷","端端正正"],q:["只要___________打得好，学习就不困难。","小松鼠在树上跳来跳去，动作非常___________。","奶奶生病了，我们不要___________她休息。","老师称赞我写的字___________，十分整齐美观。","看了这篇报道，我才知道每年因饥饿死亡的人数如此之多，真令人___________。"],a:["基础","敏捷","打搅","端端正正","震惊"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:4,instr:"填写正确的答案。",bank:["联络","教授","破烂不堪","索性","欲望"],q:["那个沿街乞讨的小男孩，身上的衣衫___________，看了真令人感到心酸。","家伟求知___________很强，学习非常刻苦。","每个星期，我们都会和在外地工作的父亲___________数次。","那名大学___________不但发表过许多论文，还编写了不少书。","盘里的菜只剩一点儿，我___________把它吃完了。"],a:["破烂不堪","欲望","联络","教授","索性"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:5,instr:"圈出正确的答案。",bank:[],q:["我把这张（书签夹，夹板）在我最心爱的故事书里。","这个孩子聪明（伶俐，伶仃），一学什么就会，将来必定有所成就。","裕兴小学没打好数学（基础，础石），上了中学学习时倍感吃力。","警察叔叔身手（敏捷，敏感），小偷只好束手就擒。","文康思维（敏捷，快捷），能把课堂所学的知识灵活运用在生活上。","哥哥正在看书，你最好别去（搅拌，打搅）他。","妈妈把冲洗好的全家福照片，（端端正正，端庄）地挂在客厅的正中央。","黄总统病危的消息传开后，令人民十分（震惊，地震）。","非洲孩童们虽然身穿（破烂不堪，滚瓜烂熟）的衣衫，但脸上的笑容不曾消失。","小男孩目不转睛地盯着池里的鱼，眼里充满了探索的（欲望，欲念）。"],a:["书签夹","伶俐","基础","敏捷","敏捷","打搅","端端正正","震惊","破烂不堪","欲望"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:6,instr:"圈出正确的答案。",bank:[],q:["妈妈成功（联合，联络）上失去音讯十年的老同学，雀跃万分。","马爷爷是位德高望重，桃李满天下的大学（教授，授权）。","天气炎热，爷爷（索性，索取）拿了一把扇子到树下乘凉。","那场恐怖车祸（震惊，震动）了全国人民。","天空中的白云让我（联络，联想）到柔软的棉花。","这篇文章的（开端，无端）很有意思。","那名选手（敏锐，敏捷）地躲过了对手的攻击。","地震发生时，大地（震惊，震动）得很剧烈。","我的好朋友虽然转学了，但我们依然保持（联络，联想）。","你好心帮助我，却（开端，无端）瘦牵连，真是不好意思。"],a:["联络","教授","索性","震惊","联想","开端","敏捷","震动","联络","无端"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（七）数字王子",no:7,instr:"填写正确的答案。",bank:["伶俐","基础","震惊","敏捷","便捷"],q:["五岁的弟弟口齿___________，深得家人喜爱。","牢固掌握___________知识，对将来的学习有好处。","苏东坡的才思___________，写文章有如行云流水。","自从有了互联网，我们传递消息更___________了。","常年是夏的国家突然下起了冰雹，让人感到十分___________。"],a:["伶俐","基础","敏捷","便捷","震惊"]},

{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:1,instr:"圈出正确的答案。",bank:[],q:["学习英文要（循环，循序）渐进，我们还是先把基础打好吧！","这个地区的雨量（稀少，稀释），往往好几个月才下一场雨。","网络商家不但推出（折扣，扣除）优惠，还免付运输费呢！","她受（委屈，委婉）却不说出来，只把泪水往肚里吞。","我们相信，只要大家同心合力，一定能携手（迈开，迈向）成功。","虽然那强酸已经过（稀释，稀少），但我们在使用时也得小心。","文华把事情的（委屈，原委）说清楚后，大家才消除对他的误会。","橙红色的锦鲤在碧绿的荷叶间（漂浮，浮游）钻动，构成一幅美丽的图画。","我们越往深山里走，人烟越（稀释，稀少）。","他忙了半天还被人埋怨，觉得实在很（委屈，原委）。"],a:["循序","稀少","折扣","委屈","迈向","稀释","原委","浮游","稀少","委屈"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:2,instr:"圈出正确的答案。",bank:[],q:["在干旱的沙漠地区，雨水十分（稀罕，稀少）。","他从不违反校规，是个（纽扣，不折不扣）的好学生。","沿着这条（小径，田径）走，我们终于穿过了树林。","大雨过后河面上（漂浮，浮游）着许多垃圾，一直冲往下游。","老师一再（嘱咐，嘱托）考生，完成试卷后一定要再小心检查一遍。","启动洗衣机之前，妈妈将（稀释，稀罕）好的洗衣液倒入洗衣机。","妈妈说我做什么都慢半拍，是个（不折不扣，扣除）的“小乌龟”。","那名冠军选手（昂着头，昂贵），挺胸走向领奖台。","大白鹅（迈开，迈进）脚步，向水平如镜的池塘走去。","被妈妈严厉地教训之后，小冰（赤红，赤道）着脸走进房间。"],a:["稀少","不折不扣","小径","漂浮","嘱咐","稀释","不折不扣","昂着头","迈开","赤红"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:3,instr:"填写正确的答案。",bank:["捷径","河畔","沿","委屈","再循环"],q:["为了减少使用塑料袋，政府提倡人民出门携带___________购物袋。","被爸爸不分青红皂白地训斥后，余杰___________地落下了眼泪。","清晨，姐姐带着喜悦的心情在___________跑步。","只要穿越这条___________，就可以提前到达目的地。","我们___________着花农指的方向走去，不久就看见了一片太阳花海。"],a:["再循环","委屈","河畔","捷径","沿"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:4,instr:"填写正确的答案。",bank:["稀释","犹豫","可再循环","涉水","嘱咐"],q:["为了抢救跌落泳池的孩童，救生员毫不___________地跳进冰池。","爬山___________上学，对这些住在山区的原住民孩子来说，是家常便饭。","姐姐出国深造前，妈妈___________她要好好照顾自己。","这些废纸___________使用，千万不可浪费了！","这瓶___________洗碗液虽然价格便宜，但清洗效果不怎么好。"],a:["犹豫","涉水","嘱咐","可再循环","稀释"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:5,instr:"填写正确的答案。",bank:["赤红","不折不扣","委屈","昂","迈开"],q:["哈山时常帮妈妈做家务，是个___________的乖孩子。","小草从泥土钻出来，___________着头，挺着胸，像个战士一样。","表弟___________脚步，走到阿姨身边。","想起自己做过的傻事，妹妹___________着脸，感到羞愧。","一看见妈妈，妹妹便哭着向妈妈诉说心中的___________。"],a:["不折不扣","昂","迈开","赤红","委屈"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:6,instr:"填写正确的答案。",bank:["犹豫","河畔","涉水","捷径","沿着"],q:["我喜欢坐在___________的草地上，欣赏河边的美景。","放学后，我和弟弟抄___________回家。","___________这条小路走到尽头，你就会看到文具店了。","他___________了一下，迅速地作出了决定。","他们___________过河到对岸，下半身都湿透了。"],a:["河畔","捷径","沿着","犹豫","涉水"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:7,instr:"填写正确的答案。",bank:["迈开","沿","委屈","犹豫","捷径"],q:["坐在观光车上，___________途的风景使我应接不暇。","看见有人落水，战士毫不___________地跳水救人。","成功没有___________，唯有靠努力一步一步向前迈进。","我要勇敢地___________脚步，往充满挑战的人生道路前进。","班长错怪可欣偷了她的笔后，可欣___________地低着头，哭了起来。"],a:["沿","犹豫","捷径","迈开","委屈"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:8,instr:"填写正确的答案。",bank:["委任","捷径","涉水","犹豫","嘱咐"],q:["每天放学后，我都会使用这条___________回家。","妈妈在选购我爱吃的蔬菜时，不禁___________了起来。","母亲___________我出门前必须把门锁好。","我们卷起了裤管，决定___________而过。","班主任___________我为班长，协助他处理班上事务。"],a:["捷径","犹豫","嘱咐","涉水","委任"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:9,instr:"填写正确的答案。",bank:["嘱咐","年迈","捷径","沿着","犹豫"],q:["妈妈出门前___________我要把家务做好。","___________的爷爷站在门口目送我们离开。","如果我抄___________去公园，十分钟就到了。","妹妹用剪刀___________虚线将纸张剪成两半。","我___________了一下，才说出实情的真相。"],a:["嘱咐","年迈","捷径","沿着","犹豫"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（八）牵动人心的椰子",no:10,instr:"填写正确的答案。",bank:["嘱咐","迈开","河畔","屈服","不折不扣"],q:["妈妈出门前，再三___________孩子们不可开门给陌生人进来。","面对困难我们决不能___________，要勇于战胜它。","在学习上，我会用___________的汗水，去换成功的喜悦。","再长的路，一步步也能走完；再短的路，不___________双脚也无法到达。","傍晚时分，许多居民结伴到___________去垂钓。"],a:["嘱咐","屈服","不折不扣","迈开","河畔"]},

{u:2,unit:"第二单元 生活之旅",lesson:"（九）表弟来了",no:1,instr:"填写正确的答案。",bank:["不仅","霸道","共享","忧愁","专程"],q:["表弟在这次的考试中考得不好，因此感到十分___________。","这个文具盒___________美观，还很实用。","启明行为___________，经常霸占着秋千，不让别人玩。","我们一家人___________到香港探望阿姨。","和朋友___________游戏，让我从中得到快乐。"],a:["忧愁","不仅","霸道","专程","共享"]},
{u:2,unit:"第二单元 生活之旅",lesson:"（九）表弟来了",no:2,instr:"填写正确的答案。",bank:["挤满","趁","夺走","毫无","抗议"],q:["义卖会当天，学校___________了人，非常热闹。","调皮的弟弟___________妹妹心爱的玩具，惹得妹妹大哭起来。","我们不满意这个决定，所以提出了___________。","为了给妈妈一个惊喜，我___________妈妈不注意时把礼物放到她的手提包里。","在___________防备下，我被躲在墙角的伟翔吓了一大跳。"],a:["挤满","夺走","抗议","趁","毫无"]},

].map(e=>({u:e.u,unit:e.unit,lesson:e.lesson,no:e.no,instr:e.instr,bank:e.bank,items:e.q.map((t,i)=>({n:i+1,text:t})),ans:e.a}));
/* DATA: [{u, unit, lesson, no, instr, bank:[], items:[{n,text}], ans:[]}] */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLANK=/[_＿]{2,}/;
const CHOICE=/（\s*([^（）]+?)\s*）/;
let total=0,right=0,checked=0;
const state={}; // key -> {picked:[], done:bool}

function parts(e,it){
  // returns {before, after, opts, kind} where kind: 'blank' | 'choice' | 'none'
  const t=it.text;
  let m=t.match(BLANK);
  if(m){return {kind:'blank',before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts:e.bank||[]};}
  m=t.match(CHOICE);
  if(m){const opts=m[1].split(/[、，,]/).map(x=>x.trim()).filter(Boolean);if(opts.length>=2)return {kind:'choice',before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts};}
  return {kind:'none',before:t,after:'',opts:[]};
}
function exHTML(e,ei){
  const key=ei;
  const st=state[key]||(state[key]={picked:{},done:false});
  const hasAns=Array.isArray(e.ans)&&e.ans.length>0&&e.ans.some(x=>x);
  let h=`<section class="card" id="ex${ei}"><div class="qh"><div class="qn">练习（${numCN(e.no)}）</div><div class="instr">${esc(e.instr||'')}</div></div>`;
  if(e.bank&&e.bank.length)h+=`<div class="bank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  e.items.forEach((it,k)=>{
    const p=parts(e,it);
    const pk=st.picked[k]||'';
    const cls=st.done&&hasAns?((pk===e.ans[k])?'ok':'bad'):'';
    let sel=`<select data-ex="${ei}" data-k="${k}" class="${cls}" aria-label="第${it.n}题"><option value="">＿＿</option>${p.opts.map(o=>`<option value="${esc(o)}"${pk===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    let body=p.kind==='none'?esc(p.before):esc(p.before)+sel+esc(p.after);
    const numTag=`<b>${it.n}.</b> `;
    const ansTxt=st.done&&hasAns&&pk!==e.ans[k]&&e.ans[k]?``:'';
    h+=`<div class="line">${numTag}${body}${ansTxt}</div>`;
  });
  h+=`<div class="row">`;
  if(hasAns)h+=`<button class="btn" data-act="check" data-ex="${ei}">✔ 检查</button>`;
  else h+=`<span class="none">暂无答案（资料里没有这一练习的答案）</span>`;
  h+=`</div>`;
  if(st.done&&hasAns){const ok=e.items.filter((_,k)=>st.picked[k]===e.ans[k]).length;h+=`<div class="muted">本练习：${ok} / ${e.items.length} 对</div>`;}
  return h+`</section>`;
}
const CN=['零','一','二','三','四','五','六','七','八','九','十'];
function numCN(n){if(n<=10)return CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');if(n<100){const a=Math.floor(n/10),b=n%10;return CN[a]+'十'+(b?CN[b]:'');}return '一百';}
function render(){
  const view=document.getElementById('view');
  let h='',lastU=null,lastL=null;
  DATA.forEach((e,ei)=>{
    if(e.unit!==lastU){h+=`<h2 class="unit">第 ${e.u} 单元　${esc(e.unit||'')}</h2>`;lastU=e.unit;lastL=null;}
    if(e.lesson&&e.lesson!==lastL){h+=`<div class="lesson">${esc(e.lesson)}</div>`;lastL=e.lesson;}
    h+=exHTML(e,ei);
  });
  view.innerHTML=h;
  score();
}
function score(){
  let c=0,r=0,t=0;
  DATA.forEach((e,ei)=>{const st=state[ei];if(!st||!st.done)return;const hasAns=e.ans&&e.ans.some(x=>x);if(!hasAns)return;
    e.items.forEach((_,k)=>{c++;if(st.picked[k]===e.ans[k])r++;});});
  DATA.forEach(e=>{if(e.ans&&e.ans.some(x=>x))t+=e.items.length;});
  document.getElementById('score').textContent=`✅ ${r} / ${t}　已检查 ${c}`;
}
document.addEventListener('change',ev=>{
  const s=ev.target;if(s.tagName!=='SELECT'||s.dataset.ex===undefined)return;
  const ei=+s.dataset.ex,k=+s.dataset.k;const st=state[ei]||(state[ei]={picked:{},done:false});
  st.picked[k]=s.value;
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const ei=+b.dataset.ex,e=DATA[ei];const st=state[ei]||(state[ei]={picked:{},done:false});
  // capture current selects first
  document.querySelectorAll(`select[data-ex="${ei}"]`).forEach(s=>{st.picked[+s.dataset.k]=s.value;});
  if(b.dataset.act==='check'){
    const miss=e.items.filter((_,k)=>!st.picked[k]).length;
    if(miss>0){alert('还有 '+miss+' 格没有选哦！');return;}
    st.done=true;
  }
  if(b.dataset.act==='show'){
    e.ans.forEach((a,k)=>{st.picked[k]=a;});st.done=true;
  }
  const y=window.scrollY;
  const saved=document.getElementById('ex'+ei);
  render();window.scrollTo(0,y);
});
document.getElementById('jump').addEventListener('change',ev=>{
  const u=+ev.target.value;if(!u)return;
  const idx=[...new Set(DATA.map(e=>e.u))].indexOf(u);
  const tgt=document.querySelectorAll('#view h2.unit')[idx];
  if(tgt)tgt.scrollIntoView({block:'start'});
  ev.target.value='';
});
(function(){const j=document.getElementById('jump');const seen=new Set();
  j.innerHTML='<option value="">跳到单元…</option>';
  DATA.forEach(e=>{if(seen.has(e.u))return;seen.add(e.u);const o=document.createElement('option');o.value=e.u;o.textContent='第 '+e.u+' 单元';j.appendChild(o);});})();
render();
</script>
<script>
(function(){
  const BOOK='4A';
  const units=[...new Set(DATA.map(e=>e.u))];
  const FIRST=units[0];
  const ukey=u=>'fill-'+BOOK+'-u'+String(u).padStart(2,'0');
  const isDone=u=>{try{return localStorage.getItem(ukey(u))==='1';}catch(e){return false;}};
  const setDone=u=>{try{localStorage.setItem(ukey(u),'1');}catch(e){}};
  const prevOf=u=>units[units.indexOf(u)-1];
  const unlocked=u=>u===FIRST||isDone(prevOf(u));
  function exPassed(ei){
    const e=DATA[ei];
    if(!e.ans||!e.ans.some(x=>x)) return true;
    const st=state[ei];
    return !!(st&&st.done&&!st.revealed&&e.items.every((_,k)=>st.picked[k]===e.ans[k]));
  }
  function unitComplete(u){ return DATA.every((e,ei)=>e.u!==u||exPassed(ei)); }
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-act="show"]');if(!b)return;
    const i=+b.dataset.ex;state[i]=state[i]||{picked:{},done:false};state[i].revealed=true;
  },true);
  function hashUnit(){
    const m=location.hash.match(/^#u(\d+)$/);
    const u=m?+m[1]:null;
    return (u!==null&&units.includes(u)&&unlocked(u))?u:null;
  }
  let CUR=hashUnit()||units.find(u=>!isDone(u)&&unlocked(u))||FIRST;
  function buildUnits(){
    const box=document.getElementById('units');if(!box)return;
    box.innerHTML='';
    units.forEach(u=>{
      const ok=unlocked(u);
      const b=document.createElement('button');
      b.className=(u===CUR?'btn':'btn alt')+' sm';
      b.setAttribute('aria-pressed',String(u===CUR));
      b.textContent=!ok?'🔒 第 '+u+' 单元':(isDone(u)?'✅ 第 '+u+' 单元':'第 '+u+' 单元');
      if(!ok){b.disabled=true;b.style.opacity='.5';}
      b.addEventListener('click',()=>{location.hash='u'+u;});
      box.appendChild(b);
    });
  }
  function lockedCard(e,ei){
    return '<section class="card" id="ex'+ei+'"><div class="qh"><div class="qn">🔒 练习（'+numCN(e.no)+'）未开放</div></div><div class="instr">请先做完上一个练习，全部答对后才能做这一题。</div></section>';
  }
  render=function(){
    const ex=DATA.map((e,ei)=>({e,ei})).filter(x=>x.e.u===CUR);
    let h='<h2 class="unit">第 '+CUR+' 单元　'+esc(ex[0]?ex[0].e.unit||'':'')+'</h2>';
    let lastL=null;
    ex.forEach(({e,ei},k)=>{
      if(e.lesson&&e.lesson!==lastL){h+='<div class="lesson">'+esc(e.lesson)+'</div>';lastL=e.lesson;}
      h+=(k>0&&!exPassed(ex[k-1].ei))?lockedCard(e,ei):exHTML(e,ei);
    });
    document.getElementById('view').innerHTML=h;
    score();
    buildUnits();
  };
  const origScore=score;
  score=function(){
    origScore();
    if(!isDone(CUR)&&unitComplete(CUR)){ setDone(CUR); buildUnits(); }
    if(isDone(CUR)){
      const el=document.getElementById('score');
      if(el&&!el.textContent.includes('已完成')) el.textContent+='　🎉 本单元已完成';
    }
  };
  window.addEventListener('hashchange',()=>{const u=hashUnit();if(u!==null){CUR=u;render();}});
  const j=document.getElementById('jump');if(j)j.style.display='none';
  render();
})();
</script>
<script src="lesson.js"></script>
</body>
</html>
