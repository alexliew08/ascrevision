<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#faf4e8}
a{color:inherit;text-decoration:none}
@media (max-width:1000px){
  .page{width:100%!important;height:auto!important;min-height:100vh;padding:20px!important}
  .inner{flex-direction:column!important}
  .aside{width:auto!important}
}
</style>
</head>
<body>
<div class="page" style="width:1280px;height:900px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:40px;background:#faf4e8;color:#1f3d31;font-family:'Noto Sans SC','Fredoka',system-ui,sans-serif">
  <div class="inner" style="width:100%;max-width:1040px;display:flex;gap:28px">
    <section style="flex:1;min-width:0;background:#2f5e4a;color:#fff;border-radius:30px;padding:40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px">
      <svg width="200" height="120" viewBox="0 0 200 120" aria-hidden="true">
        <path d="M100 8 L114 42 L150 42 L121 62 L132 98 L100 77 L68 98 L79 62 L50 42 L86 42 Z" fill="#fff6df" stroke="#eadfcb" stroke-width="3" stroke-linejoin="round"/>
        <path d="M30 60 L38 78 L58 80 L44 94 L48 114 L30 102 L12 114 L16 94 L2 80 L22 78 Z" fill="#ecd58a" transform="translate(0,-8) scale(.7)"/>
        <path d="M170 60 L178 78 L198 80 L184 94 L188 114 L170 102 L152 114 L156 94 L142 80 L162 78 Z" fill="#ecd58a" transform="translate(0,-8) scale(.7)"/>
      </svg>
      <div style="font-size:16px;font-weight:700;opacity:.9">Unit 4 complete 第4单元完成</div>
      <div id="title" style="font-size:44px;font-weight:800;line-height:1.2">Well done!<br>做得很好！</div>
      <div style="font-size:18px;opacity:.95">You got 9 out of 10 right.</div>
      <div style="display:flex;gap:12px;margin-top:8px;width:100%">
        <div style="flex:1;background:rgba(255,255,255,.14);border-radius:18px;padding:14px"><div style="font-size:28px;font-weight:800">90%</div><div style="font-size:13px;opacity:.9">Score 得分</div></div>
        <div style="flex:1;background:rgba(255,255,255,.14);border-radius:18px;padding:14px"><div style="font-size:28px;font-weight:800">1</div><div style="font-size:13px;opacity:.9">Try again 再试</div></div>
      </div>
      <a href="map.html" style="margin-top:12px;background:#fff6df;color:#2f5e4a;border-radius:999px;padding:16px 32px;font-size:18px;font-weight:800">Next unit 下一单元 →</a>
      <a href="index.html" style="background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700">Back to menu 返回菜单</a>
    </section>

    <aside class="aside" style="width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:18px">
      <div style="background:#fffdf8;border:1.5px solid #eadfcb;border-radius:24px;padding:24px">
        <div style="font-size:20px;font-weight:800;margin-bottom:12px">Review 复习</div>
        <div style="display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:#fbe9e6">
          <div style="font-size:18px;font-weight:800;color:#b03a2e;width:24px">3.</div>
          <div>
            <div style="font-size:18px;font-weight:800;color:#b03a2e">疑问</div>
            <div style="font-size:14px;color:#6d6a5c;margin-top:4px;line-height:1.5">Look at the picture: the girl is asking something. 女孩在提问。</div>
          </div>
        </div>
        <a href="year3-chinesefill-3A.html" style="display:block;margin-top:14px;text-align:center;min-height:48px;line-height:48px;border-radius:999px;border:1.5px solid #eadfcb;background:#fff;font-size:16px;font-weight:800">Try this one again 再做一次</a>
      </div>
      <div style="background:#fff6df;border-radius:20px;padding:18px;font-size:15px;line-height:1.5;color:#6b5210">Every correct answer adds to your streak. 连续练习 3 天！</div>
    </aside>
  </div>
</div>
<script>
(function(){
  try {
    var s = JSON.parse(sessionStorage.getItem("asc_student") || "null");
    if (!s) { location.replace("index.html"); return; }
    if (s.name) document.getElementById("title").innerHTML = "Well done, " + s.name.replace(/[<>&]/g, "") + "!<br>做得很好！";
  } catch(e) { location.replace("index.html"); }
})();
</script>
</body>
</html>
