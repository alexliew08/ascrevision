<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三年级华文｜看图学华文：小美 · 风兄弟 · 向日葵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf6ff;--bg2:#f4fbe9;--ink:#2a2340;--muted:#6a6184;--panel:#ffffff;--soft:#fff6de;
  --line:#3b2f5c;--accent:#ff8a3d;--good:#1f9d5a;--bad:#d9434a;--blue:#3a7bf0;
  --okbg:#ddf6e6;--badbg:#ffe3e3;--hl:#fff0a0;--chip:#fff3cf;
  color-scheme:light dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b2045;--bg2:#271c3d;--ink:#f3eeff;--muted:#bbb0d6;--panel:#2c2650;--soft:#3a3060;
  --line:#0c0820;--okbg:#1d4630;--badbg:#562128;--hl:#6a5714;--chip:#463a6e;}}
:root[data-theme="dark"]{--bg:#1b2045;--bg2:#271c3d;--ink:#f3eeff;--muted:#bbb0d6;--panel:#2c2650;--soft:#3a3060;
  --line:#0c0820;--okbg:#1d4630;--badbg:#562128;--hl:#6a5714;--chip:#463a6e;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.t{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;font-weight:400}
.wrap{max-width:880px;margin:0 auto;padding:10px 14px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:3px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:24px;line-height:1.2}
.score{font-size:16px;font-weight:700;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:4px 12px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.tab{flex:0 0 auto;font:inherit;font-size:16px;font-weight:700;padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer;min-height:48px}
.tab.on{background:var(--accent);color:#fff}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:16px;margin:16px 0}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.sec-h .tag{font-size:15px;background:var(--line);color:#fff;border-radius:10px;padding:2px 10px;white-space:nowrap}
.sec-h h2{margin:0;font-size:23px;line-height:1.3}
.inst{margin:4px 0;color:var(--muted)}
.btn{font:inherit;font-size:18px;font-weight:700;min-height:52px;padding:8px 20px;border:3px solid var(--line);border-radius:16px;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.green{background:var(--good)}
.btn.red{background:var(--bad)}
.btn.sm{font-size:15px;min-height:42px;padding:4px 12px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
details.tip{background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:8px 12px;margin:10px 0}
details.tip summary{cursor:pointer;font-weight:700;min-height:36px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 14px;margin-top:6px;font-size:16px}
.vlist b{color:var(--accent)}
.pic{display:block;width:100%;height:auto;border:3px solid var(--line);border-radius:16px;background:#fff}
.pic-wrap{max-width:440px;margin:6px auto}
.pics3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.pics3{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start}
@media (max-width:640px){.item{grid-template-columns:1fr}}
.qn{font-weight:700;font-size:20px}
.sent{font-size:21px;line-height:2;margin:6px 0}
.slot{display:inline-block;min-width:90px;border-bottom:3px solid var(--line);text-align:center;color:var(--blue);font-weight:700;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-size:19px;padding:6px 16px;min-height:50px;border:3px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);cursor:pointer}
.chip.sel{background:var(--hl);outline:3px solid var(--blue)}
.chip.right{background:var(--okbg);border-color:var(--good)}
.chip.used{opacity:.35;text-decoration:line-through}
.chip.sm{font-size:16px;min-height:42px;padding:4px 12px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--panel);padding:8px 0;z-index:2}
.passage p{text-indent:2em;line-height:2.3;margin:6px 0;font-size:19px}
.blank{display:inline-block;vertical-align:bottom;min-width:88px;min-height:38px;padding:0 6px;margin:0 3px;text-indent:0;border:none;border-bottom:3px solid var(--line);
  background:transparent;color:var(--blue);font:inherit;font-size:19px;font-weight:700;cursor:pointer;border-radius:6px 6px 0 0}
.blank .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;font-size:13px;margin-right:4px;vertical-align:middle}
.blank.cur{background:var(--hl)}
.blank.ok{color:var(--good);cursor:default}
.blank.bad{background:var(--badbg);color:var(--bad)}
.fb{border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:12px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb .h{font-weight:700;font-size:19px}
.fb ul{margin:6px 0;padding-left:20px}
.ans{min-height:58px;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;background:var(--soft)}
.ans .ph{color:var(--muted);font-size:15px;padding:0 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:inherit;font-size:19px;padding:6px 12px;min-height:48px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}
.ans .tile{background:#fff2c2;color:#2a2340}
.order-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opic{position:relative;padding:0;border:none;background:none;cursor:pointer;border-radius:16px}
.opic .num{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center;border:3px solid var(--line)}
.opic.ok .num{background:var(--good)}
.seqpic{position:relative}
.tw{border-top:2px dashed var(--line);padding:8px 0;font-size:16px}
.fb:not(.ok):not(.bad){background:var(--soft)}
.seqpic .num{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center;border:3px solid var(--line)}
.guide{background:var(--soft);border-radius:12px;padding:6px 12px;margin:6px 0;font-size:17px}
.done-line{font-size:20px;font-weight:700;color:var(--good)}
.word{display:inline-block;font-size:22px;font-weight:700;background:var(--accent);color:#fff;border-radius:12px;padding:2px 14px;border:3px solid var(--line)}
textarea{width:100%;font:inherit;font-size:19px;min-height:96px;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--panel);color:var(--ink);margin-top:8px}
.cnt{font-size:14px;color:var(--muted)}
.stars{font-size:40px;letter-spacing:4px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:2px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblw{overflow-x:auto}
.bar{height:16px;background:var(--soft);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
input.txt{font:inherit;font-size:18px;padding:8px 12px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);min-height:48px;width:100%;max-width:280px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--line);color:#fff;padding:10px 18px;border-radius:14px;z-index:20;font-weight:700;max-width:90vw;text-align:center}
.hero{text-align:center}
.hero .big{font-size:56px;line-height:1.2}
.muted{color:var(--muted)}
.lock{opacity:.5;pointer-events:none}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pybtn{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:4px 14px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer}
.pybtn[aria-pressed="true"]{background:#3a7bf0;color:#fff}
.say{font:inherit;font-size:17px;min-width:40px;min-height:40px;padding:0 6px;border:2px solid var(--line);border-radius:12px;background:#ffe9a8;color:#2a2340;cursor:pointer;vertical-align:middle;line-height:1;text-indent:0}
.say:active{transform:scale(.92)}
.pyc{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:bottom;text-indent:0;margin:0 1px}
.pyc i{font-style:normal;font-size:.56em;font-weight:400;color:var(--muted);font-family:"Helvetica Neue",Arial,sans-serif;white-space:nowrap}
.chip .pyc i,.tile .pyc i,.blank .pyc i,.word .pyc i,.btn .pyc i,.slot .pyc i{color:inherit;opacity:.8}
body.py .sent{line-height:2.2}
body.py .blank{display:inline-flex;align-items:flex-end;gap:3px;line-height:1.3;min-height:46px;padding-bottom:2px}
body.py .blank .n{margin-bottom:3px}
body.py .passage p{line-height:2.6}
body.py .inst,body.py .guide,body.py .fb,body.py .vlist,body.py details p{line-height:2.2}
body.py .chip,body.py .tile{padding-top:2px;padding-bottom:2px}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.hublink{display:inline-flex;align-items:center;min-height:44px;margin:4px 0 6px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:underline}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1 class="t">🎨 三年级华文 · 看图学华文</h1>
  <div class="hdr-r"><button class="pybtn" id="pyBtn" data-act="py" aria-pressed="false">拼音：关</button><button class="pybtn" id="ttsBtn" data-act="tts" aria-pressed="false">点读：关</button><div class="score" id="score"></div></div>
</div></header>
<main class="wrap">
  <a class="hublink" href="index.html">← 返回学习中心 Learning Hub</a>
  <nav class="tabs" id="tabs"></nav>
  <div id="ttsNote"></div>
  <div id="view"></div>
</main>
<div id="toastBox"></div>
<script>
'use strict';
/* =====================================================
   插图（全部为原创 SVG，图中没有文字）
===================================================== */
const L='#3b2f5c', SKIN='#ffd6b0';
const r1=n=>Math.round(n*10)/10;
const S=(w=2.5,c=L)=>`stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
function eyes(x,y,g,r){return `<circle cx="${r1(x-g)}" cy="${r1(y)}" r="${r1(r)}" fill="${L}"/><circle cx="${r1(x+g)}" cy="${r1(y)}" r="${r1(r)}" fill="${L}"/>`;}
function face(x,y,mood,k=1){
  const g=6*k,r=2*k,w=2*k;let o='';
  const cheek=`<circle cx="${r1(x-10*k)}" cy="${r1(y+6*k)}" r="${r1(2.6*k)}" fill="#ff8f9a" opacity=".6"/><circle cx="${r1(x+10*k)}" cy="${r1(y+6*k)}" r="${r1(2.6*k)}" fill="#ff8f9a" opacity=".6"/>`;
  if(mood==='angry'){
    o+=eyes(x,y,g,r)+`<path d="M${r1(x-g-4*k)} ${r1(y-7*k)} L${r1(x-g+3*k)} ${r1(y-3*k)} M${r1(x+g+4*k)} ${r1(y-7*k)} L${r1(x+g-3*k)} ${r1(y-3*k)}" ${S(w)}/>`;
    o+=`<path d="M${r1(x-5*k)} ${r1(y+10*k)} Q${r1(x)} ${r1(y+4*k)} ${r1(x+5*k)} ${r1(y+10*k)}" fill="none" ${S(w)}/>`;
  }else if(mood==='sad'){
    o+=`<path d="M${r1(x-g-3*k)} ${r1(y-1*k)} Q${r1(x-g)} ${r1(y+2*k)} ${r1(x-g+3*k)} ${r1(y-1*k)} M${r1(x+g-3*k)} ${r1(y-1*k)} Q${r1(x+g)} ${r1(y+2*k)} ${r1(x+g+3*k)} ${r1(y-1*k)}" fill="none" ${S(w)}/>`;
    o+=`<path d="M${r1(x-5*k)} ${r1(y+10*k)} Q${r1(x)} ${r1(y+5*k)} ${r1(x+5*k)} ${r1(y+10*k)}" fill="none" ${S(w)}/>`;
    o+=`<path d="M${r1(x-g)} ${r1(y+3*k)} q${r1(-2.5*k)} ${r1(5*k)} 0 ${r1(7*k)} q${r1(2.5*k)} ${r1(-2*k)} 0 ${r1(-7*k)}z" fill="#4fb0ff"/>`;
    o+=`<path d="M${r1(x+g)} ${r1(y+3*k)} q${r1(-2.5*k)} ${r1(5*k)} 0 ${r1(7*k)} q${r1(2.5*k)} ${r1(-2*k)} 0 ${r1(-7*k)}z" fill="#4fb0ff"/>`;
  }else if(mood==='sing'){
    o+=eyes(x,y,g,r)+`<ellipse cx="${r1(x)}" cy="${r1(y+8*k)}" rx="${r1(3.5*k)}" ry="${r1(4.5*k)}" fill="#d0473e" ${S(1.5*k)}/>`+cheek;
  }else if(mood==='nervous'){
    o+=eyes(x,y,g,r)+`<path d="M${r1(x-7*k)} ${r1(y+9*k)} l${r1(2.3*k)} ${r1(-2*k)} l${r1(2.3*k)} ${r1(2*k)} l${r1(2.3*k)} ${r1(-2*k)} l${r1(2.3*k)} ${r1(2*k)} l${r1(2.3*k)} ${r1(-2*k)} l${r1(2.3*k)} ${r1(2*k)}" fill="none" ${S(1.6*k)}/>`;
    o+=`<path d="M${r1(x-g-3*k)} ${r1(y-6*k)} L${r1(x-g+3*k)} ${r1(y-8*k)} M${r1(x+g+3*k)} ${r1(y-6*k)} L${r1(x+g-3*k)} ${r1(y-8*k)}" ${S(1.6*k)}/>`;
  }else if(mood==='oops'){
    o+=eyes(x,y,g,r*1.2)+`<circle cx="${r1(x)}" cy="${r1(y+9*k)}" r="${r1(3*k)}" fill="${L}"/>`;
  }else if(mood==='calm'){
    o+=`<path d="M${r1(x-g-3*k)} ${r1(y)} Q${r1(x-g)} ${r1(y-3*k)} ${r1(x-g+3*k)} ${r1(y)} M${r1(x+g-3*k)} ${r1(y)} Q${r1(x+g)} ${r1(y-3*k)} ${r1(x+g+3*k)} ${r1(y)}" fill="none" ${S(w)}/>`;
    o+=`<path d="M${r1(x-6*k)} ${r1(y+5*k)} Q${r1(x)} ${r1(y+12*k)} ${r1(x+6*k)} ${r1(y+5*k)}" fill="none" ${S(w)}/>`+cheek;
  }else{
    o+=eyes(x,y,g,r)+`<path d="M${r1(x-6*k)} ${r1(y+5*k)} Q${r1(x)} ${r1(y+12*k)} ${r1(x+6*k)} ${r1(y+5*k)}" fill="none" ${S(w)}/>`+cheek;
  }
  return o;
}
function sun(x,y,r,mood='happy'){
  let o='';
  for(let i=0;i<12;i++){const a=i*Math.PI/6;o+=`<line x1="${r1(x+Math.cos(a)*(r+5))}" y1="${r1(y+Math.sin(a)*(r+5))}" x2="${r1(x+Math.cos(a)*(r+15))}" y2="${r1(y+Math.sin(a)*(r+15))}" stroke="#f5a623" stroke-width="4" stroke-linecap="round"/>`;}
  o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd93b" ${S()}/>`;
  if(mood)o+=face(x,y-2,mood,r/20);
  return o;
}
function cloud(x,y,s,fill='#ffffff',mood=null){
  const c=[[0,0,22],[-24,7,16],[24,7,16],[-11,-12,16],[12,-11,18]];
  let o=`<g transform="translate(${x} ${y}) scale(${s})">`;
  c.forEach(([a,b,r])=>o+=`<circle cx="${a}" cy="${b}" r="${r}" fill="${fill}" ${S(3)}/>`);
  c.forEach(([a,b,r])=>o+=`<circle cx="${a}" cy="${b}" r="${r-1.7}" fill="${fill}"/>`);
  if(mood)o+=face(0,2,mood,0.9);
  return o+'</g>';
}
function wind(x,y,s,mood,dir=1){
  let o=`<g transform="translate(${x} ${y}) scale(${dir*s} ${s})">`;
  o+=`<path d="M-14 -10 Q-40 -28 -62 -14 Q-76 -4 -67 7 Q-60 13 -54 4" fill="none" stroke="#6fbbe8" stroke-width="5" stroke-linecap="round"/>`;
  o+=`<path d="M-17 3 Q-46 6 -74 22" fill="none" stroke="#6fbbe8" stroke-width="5" stroke-linecap="round"/>`;
  o+=`<path d="M-10 14 Q-30 32 -54 33" fill="none" stroke="#a6dbf7" stroke-width="4" stroke-linecap="round"/>`;
  o+=`<path d="M0 -20 C14 -20 22 -8 20 4 C18 16 6 22 -4 20 C-16 18 -22 6 -18 -6 C-15 -15 -8 -20 0 -20Z" fill="#effaff" ${S(2.5)}/>`;
  o+=`<path d="M-6 -20 C-9 -31 4 -35 8 -28 C10 -24 6 -21 3 -23" fill="none" ${S(2.2)}/>`;
  o+='</g>';
  return o+face(x+dir*2*s,y-1*s,mood,s*0.75);
}
function speed(x,y,n=3,len=26,gap=10){let o='';for(let i=0;i<n;i++)o+=`<line x1="${x}" y1="${y+i*gap}" x2="${x+len-i*5}" y2="${y+i*gap}" ${S(2.5,'#ffffff')} opacity=".9"/>`;return o;}
function house(x,y,s,tilt=0,wall='#ffe2a8',roof='#e46c5b'){
  return `<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${s})"><rect x="-20" y="-30" width="40" height="30" fill="${wall}" ${S()}/><path d="M-26 -30 L0 -52 L26 -30Z" fill="${roof}" ${S()}/><rect x="-6" y="-16" width="12" height="16" fill="#a8693d" ${S(2)}/><rect x="8" y="-25" width="8" height="8" fill="#9fdcff" ${S(2)}/></g>`;
}
function brokenHouse(x,y,s){
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-24 0 L-20 -18 L-6 -10 L4 -24 L20 -14 L24 0Z" fill="#ffe2a8" ${S()}/><g transform="rotate(-28 0 -20)"><path d="M-30 -18 L-4 -40 L22 -18Z" fill="#e46c5b" ${S()}/></g><path d="M-14 -4 L-2 -12 M6 -4 L14 -10" ${S(2)}/><rect x="26" y="-8" width="16" height="6" fill="#c98a52" ${S(2)} transform="rotate(20 26 -8)"/></g>`;
}
function tree(x,y,s,bend=0){
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-5 0 Q${-3+bend*.3} -20 ${bend*.6-2} -36 L${bend*.6+6} -36 Q${4+bend*.3} -20 6 0Z" fill="#a0673a" ${S(2)}/><ellipse cx="${bend}" cy="-50" rx="23" ry="20" fill="#5dbb63" ${S()} transform="rotate(${bend} ${bend} -50)"/></g>`;
}
function grass(y,fill='#8fd16a',w=320){let o=`<rect x="0" y="${y}" width="${w}" height="${200-y}" fill="${fill}"/><line x1="0" y1="${y}" x2="${w}" y2="${y}" ${S(2.5)}/>`;for(let x=14;x<w;x+=46)o+=`<path d="M${x} ${y+14} l3 -7 l3 7 l3 -6 l2 6" fill="none" ${S(1.8,'#4c8f3a')}/>`;return o;}

  else g+=`<path d="M-6 -22 L-7 0 M6 -22 L7 0" fill="none" ${S(5,'#4a4a6a')}/><ellipse cx="-9" cy="0" rx="6" ry="3.5" fill="${L}"/><ellipse cx="9" cy="0" rx="6" ry="3.5" fill="${L}"/>`;

  else if(arms==='pointUp'){g+=arm('M-10 -44 L-18 -34 L-12 -27')+arm('M10 -44 L22 -74');hands=hand(23,-76);}
  else if(arms==='clap'){g+=arm('M-10 -44 L-14 -36 L-3 -46')+arm('M10 -44 L14 -36 L3 -46');hands=hand(-3,-47)+hand(3,-47)+clapLines(0,-52);}
  else if(arms==='up'){g+=arm('M-10 -44 L-24 -66')+arm('M10 -44 L24 -66');hands=hand(-25,-68)+hand(25,-68);}

    g+=arm('M10 -44 L18 -50 L8 -58');
    g+= arms==='mic2'? arm('M-10 -44 L-14 -52 L4 -58') : arm('M-10 -44 L-26 -60');

function sunflower(x,y,s,o={}){
  const wilt=!!o.wilt,mood=o.mood||(wilt?'sad':'happy'),lean=o.lean||0;
  let g=`<g transform="translate(${x} ${y}) scale(${s})">`;

  g+=`<path d="${stemD}" fill="none" ${S(5.5,L)}/><path d="${stemD}" fill="none" stroke="${wilt?'#8aa34a':'#6ba34a'}" stroke-width="3" stroke-linecap="round"/>`;
  const lf=wilt?'#a3b85a':'#77c25a';
  if(wilt){
    g+=`<ellipse cx="-9" cy="-42" rx="10" ry="4.5" fill="${lf}" ${S(2)} transform="rotate(55 -9 -42)"/>`;
    g+=`<ellipse cx="9" cy="-50" rx="10" ry="4.5" fill="${lf}" ${S(2)} transform="rotate(-55 9 -50)"/>`;
  }else{
    g+=`<ellipse cx="-10" cy="-48" rx="10" ry="5" fill="${lf}" ${S(2)} transform="rotate(-35 -10 -48)"/>`;
    if(o.wave) g+=`<ellipse cx="15" cy="-70" rx="12" ry="5" fill="${lf}" ${S(2)} transform="rotate(-60 15 -70)"/><path d="M26 -88 q5 -3 8 2 M30 -80 q6 -2 8 4" fill="none" ${S(2)}/>`;
    else g+=`<ellipse cx="10" cy="-58" rx="10" ry="5" fill="${lf}" ${S(2)} transform="rotate(35 10 -58)"/>`;
  }
  const hx=wilt?32:lean, hy=wilt?-56:-96, rot=wilt?38:0;
  g+=`<g transform="translate(${hx} ${hy}) rotate(${rot})">`;
  for(let i=0;i<12;i++){
    const a=i*30, droop=wilt&&(a>=90&&a<=270);
    g+=`<ellipse cx="0" cy="${droop?-17:-15}" rx="${wilt?4.8:5.5}" ry="${wilt?(droop?11:7):11}" fill="${wilt?'#cfa94a':'#ffcc29'}" ${S(1.8)} transform="rotate(${a})"/>`;
  }
  g+=`<circle cx="0" cy="0" r="${wilt?11:12}" fill="${wilt?'#7a5530':'#8a5a2b'}" ${S(2)}/>`+face(0,-1,mood,0.62)+`</g>`;

  return g+'</g>';
}

const WORDPY={};'哥哥:gē ge|弟弟:dì di|什么:shén me|怎么:zěn me|清楚:qīng chu|认识:rèn shi|意思:yì si|觉得:jué de|东西:dōng xi|时候:shí hou|关卡:guān qiǎ|空格:kòng gé|得奖:dé jiǎng|得到:dé dào|长长:cháng cháng|因为:yīn wèi|教师:jiào shī|兄弟:xiōng dì|太阳:tài yáng|向日葵:xiàng rì kuí|大地:dà dì|地上:dì shàng|地方:dì fāng|重要:zhòng yào|头发:tóu fa|好奇:hào qí|教我:jiāo wǒ|花儿:huā er|填空:tián kòng'.split('|').forEach(t=>{const[w,p]=t.split(':');WORDPY[w]=p.split(' ');});
function toneOf(p){if(!p)return 0;if(/[āēīōūǖ]/.test(p))return 1;if(/[áéíóúǘ]/.test(p))return 2;if(/[ǎěǐǒǔǚ]/.test(p))return 3;if(/[àèìòùǜ]/.test(p))return 4;return 0;}
const isHan=c=>/[\u4e00-\u9fff]/.test(c);
function pinyinOf(text){
  const out=new Array(text.length).fill(null),fixed=new Array(text.length).fill(false);
  let i=0;
  while(i<text.length){
    let hit=0;
    for(let n=3;n>=2;n--){const w=text.substr(i,n);if(WORDPY[w]){WORDPY[w].forEach((p,k)=>{out[i+k]=p;fixed[i+k]=true;});hit=n;break;}}
    if(hit){i+=hit;continue;}
    const c=text[i];if(isHan(c))out[i]=PY[c]||null;i++;
  }
  for(let k=0;k<text.length;k++){
    if(fixed[k])continue;const c=text[k],prev=text[k-1]||'',next=text[k+1]||'';
    if(c==='子'&&isHan(prev)&&prev!=='仔')out[k]='zi';
    else if(c==='地'){out[k]=((next&&'上面方'.includes(next))||(prev&&'大土草'.includes(prev)))?'dì':'de';}
    else if(c==='得'){out[k]=(next&&'奖到'.includes(next))?'dé':'de';}
    else if(c==='空'&&!isHan(prev))out[k]='kòng';
    else if(c==='一'){
      if(prev==='第'||!isHan(next)||/[0-9０-９]/.test(next))out[k]='yī';
      else if(isHan(prev)&&prev===next)out[k]='yi';
      else{const t=toneOf(out[k+1]||PY[next]);out[k]=t===4?'yí':(t>=1&&t<=3?'yì':'yī');}
    }
    else if(c==='不'){const t=toneOf(out[k+1]||PY[next]);out[k]=t===4?'bú':'bù';}
  }
  return out;
}
function rubyText(text){
  const p=pinyinOf(text);let h='';
  for(let k=0;k<text.length;k++){let c=text[k];
    if(p[k]){h+=`<span class="pyc"><i>${p[k]}</i>${c}</span>`;continue;}
    const cc=text.charCodeAt(k);if(cc>=0xD800&&cc<=0xDBFF&&k+1<text.length){c+=text[k+1];k++;}
    while(k+1<text.length&&/[\uFE0F\u200D]/.test(text[k+1])){c+=text[k+1];k++;}
    h+=/\s/.test(c)?c:`<span class="pyc"><i>&nbsp;</i>${esc(c)}</span>`;}
  return h;
}
function applyPinyin(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const el=n.parentElement;if(!el||!/[\u4e00-\u9fff]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    if(el.closest('textarea,svg,.pyc,.nopy,.n,script,style'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const span=document.createElement('span');span.innerHTML=rubyText(n.nodeValue);n.replaceWith(...span.childNodes);});
}

const canSpeak='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
let zhVoice=null;
function pickVoice(){if(!canSpeak)return;const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/^zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
if(canSpeak){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
  if(!canSpeak){window.ttsBlocked=true;render();document.getElementById('ttsNote').scrollIntoView({block:'center'});return;}
  const t=String(text).replace(/[＿_]+/g,'，').replace(/[🎉🤔✏️💡📘👀⚠️]/gu,'');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.8;if(zhVoice)u.voice=zhVoice;
  u.onerror=()=>{};try{speechSynthesis.speak(u);}catch(e){toast('语音播放失败');}
  if(!zhVoice&&!speak.warned){speak.warned=true;setTimeout(()=>{pickVoice();if(!zhVoice)toast('这台设备可能没有中文语音，请在系统设置里加入中文语音');},800);}
}

      <textarea id="ta${i}" data-p="p4" data-i="${i}" placeholder="在这里写句子……" ${editing&&!busy?'':'readonly'}>${esc(D.p4.text[i]||'')}</textarea>
      <div class="cnt" id="cnt${i}">${countHan(D.p4.text[i]||'')} 个字</div>
      ${busy?'<div class="fb"><div class="h">📝 老师正在批改，请等一等……</div><span class="muted">大约需要半分钟</span></div>':''}
      ${!busy&&D.p4.msg[i]?D.p4.msg[i]:''}
      ${!busy&&g&&!editing?gradeCard4(i):''}
      ${busy?'':editing?`<div class="row"><button class="btn" data-act="p4check" data-arg="${i}">✔ 交给老师批改</button><button class="btn alt sm" data-act="p4clear" data-arg="${i}">✖ 清除</button><button class="btn alt sm" data-act="readMine" data-arg="ta${i}">🔊 读我的句子</button></div>`
        :`<div class="row">${g.score<2?`<button class="btn" data-act="p4edit" data-arg="${i}">✏️ 修改再交</button>`:''}<button class="btn alt sm" data-act="readMine" data-arg="ta${i}">🔊 读我的句子</button></div>`}
    </div></div></section>`;
  });
  if(partScore('p4').done===4)h+=nextBtn('p5','去第五关 ➜');

}
function gradeCard4(i){
  const q=P4[i],g=D.p4.grade[i],sc=score4(i);
  const head=sc===2?'🎉 写得很好！':sc===1?'👍 不错，还可以更好！':'✏️ 再试一试！';
  const checks=g.src==='ai'?`<div style="font-size:16px">${g.used?'✅':'❌'} 用对词语　${g.fits?'✅':'❌'} 符合图意　${g.fluent?'✅':'❌'} 句子通顺　${g.punct?'✅':'❌'} 标点</div>`:'';
  return `<div class="fb ${sc===2?'ok':sc===1?'':'bad'} pop"><div class="h">${head}　得分：${'⭐'.repeat(sc)}${'☆'.repeat(2-sc)} ${sc}/2 分</div>
    ${checks}${typoHTML(g.typos)}<div>💬 ${esc(g.comment)}</div>
    ${g.improved&&g.improved!==D.p4.text[i]?`<div>${say(g.improved)} 🔧 改一改：${esc(g.improved)}</div>`:''}
    <div>${say(q.model)} 📘 参考句子：${q.model}</div>${srcNote(g)}${D.p4.tscore[i]!=null?'<div class="muted" style="font-size:14px">（分数已由老师确认）</div>':''}</div>`;
}
const BUSY={};
async function p4check(i){
  const q=P4[i],t=(D.p4.text[i]||'').trim();
  let why='';
  if(!t)why='还没有写哦！';
  else if(!t.includes(q.word))why=`句子里要用上「${q.word}」这个词语。`;
  else if(countHan(t)<6)why='太短了，说清楚“谁”和“做什么／怎么样”。';
  if(why){D.p4.tries[i]=(D.p4.tries[i]||0)+1;if(t)logWrong('看图造句',`「${q.word}」`,t,'参考：'+q.model);
    D.p4.msg[i]=`<div class="fb bad"><div class="h">✏️ 再改一改！</div>${why}<br>💡 ${q.guide}</div>`;save();render();return;}
  D.p4.msg[i]='';BUSY['p4_'+i]=true;render();
  let g=await aiGrade4(q,t);if(!g)g=localGrade4(q,t);
  BUSY['p4_'+i]=false;g.text=t;g.at=Date.now();
  const firstSubmit=!D.p4.grade[i]&&!D.p4.tries[i];
  D.p4.grade[i]=g;D.p4.edit[i]=false;delete D.p4.tscore[i];D.p4.ok[i]=true;
  if(firstSubmit&&g.score===2)D.p4.first[i]=true;
  if(g.score<2){D.p4.tries[i]=(D.p4.tries[i]||0)+1;logWrong('看图造句',`「${q.word}」（${g.score}/2分）`,t,g.improved||('参考：'+q.model));}
  (D.p4.hist[i]=D.p4.hist[i]||[]).push({t,score:g.score,src:g.src,at:g.at});
  save();render();if(g.comment)autoSpeak(g.comment);
}

function addText(id,key,i,w){

const ACT={
  say:(a,b)=>speak(b.dataset.say),
  ttsHide:()=>{window.ttsBlocked=false;render();},
  tts:()=>{D.tts=!D.tts;save();render();if(D.tts){speak('点读打开了');toast('点词语、词卡就会读出来');}else toast('已关闭点读');},
  py:()=>{D.py=!D.py;save();render();toast(D.py?'已打开拼音':'已关闭拼音');},
  tab:k=>{tab=k;render();window.scrollTo(0,0);},
  p1pick:a=>{const[i,o]=a.split('|');D.p1.sel[i]=o;tap(o);render();},
  p1check:i=>p1check(+i),
  p2blank:n=>{n=+n;if(D.p2.ok[n])return;if(curBlank===n&&D.p2.fill[n]){delete D.p2.fill[n];save();}curBlank=n;render();},
  p2word:w=>{tap(w);
    if(Object.entries(D.p2.fill).some(([n,v])=>v===w&&D.p2.ok[n])){toast(`「${w}」已经用过了，每个词语只用一次。`);return;}
    if(D.p2.ok[curBlank])curBlank=nextBlank();
    for(const n in D.p2.fill)if(D.p2.fill[n]===w)delete D.p2.fill[n];
    D.p2.fill[curBlank]=w;delete D.p2.bad[curBlank];curBlank=nextBlank();save();render();
  },
  p2check, p2reveal:()=>{for(const n in P2ANS)if(!D.p2.ok[n]){D.p2.fill[n]=P2ANS[n];D.p2.ok[n]=true;}D.p2.bad={};
    D.p2.last='<div class="fb ok"><div class="h">👀 已显示正确答案</div>请把短文大声读一遍，记住每个词语的用法。</div>';save();render();},
  p3pic:k=>{k=+k;const d=D.p3;const p=d.pick.indexOf(k);if(p>=0)d.pick.splice(p,1);else if(d.pick.length<4)d.pick.push(k);d.picMsg='';save();render();},
  p3picCheck, p3picClear:()=>{D.p3.pick=[];D.p3.picMsg='';save();render();},
  p3tile:a=>{const[i,k]=a.split('|').map(Number);tap(P3[i].tiles[k]);(D.p3.sel[i]=D.p3.sel[i]||[]).push(k);delete D.p3.msg[i];save();render();},
  p3untile:a=>{const[i,p]=a.split('|').map(Number);D.p3.sel[i].splice(p,1);save();render();},
  p3clear:i=>{D.p3.sel[i]=[];delete D.p3.msg[i];save();render();},
  p3check:i=>p3check(+i), p3reveal:i=>p3reveal(+i),
  p4help:a=>{const[i,w]=a.split('|');tap(w);addText('ta'+i,'p4',i,w);},
  p4clear:i=>{D.p4.text[i]='';D.p4.msg[i]='';save();render();},
  p4check:i=>p4check(+i),
  p4edit:i=>{D.p4.edit[i]=true;save();render();},
  p5edit:()=>{D.p5.edit=true;save();render();},
  t4:a=>{const[i,n]=a.split('|');if(n==='x')delete D.p4.tscore[i];else D.p4.tscore[i]=+n;save();render();},
  t5:()=>{const v=document.getElementById('t5in').value;if(v===''){toast('请输入 0 到 10 的分数');return;}D.p5.tscore=clampN(v,0,10);save();render();toast('已确认分数');},
  t5x:()=>{D.p5.tscore=null;save();render();},
  p5help:w=>{tap(w);return addText('ta5','p5',0,w);},
  p5check,
  readMine:id=>{const el=document.getElementById(id);const t=el?el.value.trim():'';if(!t){toast('先写句子，再听一听！');return;}speak(t);},
  pin:()=>{const v=(document.getElementById('pinIn').value||'').trim();
    if(!D.pin){if(!/^\d{4,8}$/.test(v)){toast('请输入 4 位数字');return;}D.pin=v;save();teacherOK=true;toast('密码已设定');render();return;}
    if(v===D.pin){teacherOK=true;render();}else toast('密码不对');},
  lock:()=>{teacherOK=false;render();},
  reset:()=>{if(ACT.reset.armed){const pin=D.pin;D=fresh();D.pin=pin;curBlank=1;ACT.reset.armed=false;save();toast('已重置学生进度');render();}
    else{ACT.reset.armed=true;toast('再按一次“重置”确认');setTimeout(()=>ACT.reset.armed=false,4000);}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b);});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.p==='p4'){D.p4.text[t.dataset.i]=t.value;const c=document.getElementById('cnt'+t.dataset.i);if(c)c.textContent=countHan(t.value)+' 个字';save();}
  if(t.dataset&&t.dataset.p==='p5'){D.p5.text=t.value;const c=document.getElementById('cnt5');if(c)c.textContent=countHan(t.value)+' 个字（至少 30 个字）';save();}
  if(t.id==='nameIn'){D.name=t.value.slice(0,20);save();}
});
render();
</script>
</body>
</html>
