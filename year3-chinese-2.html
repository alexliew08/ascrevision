<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三年级华文｜课堂评估 3A · 3B 练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#eaf6ff;--bg2:#f4fbe9;--ink:#2a2340;--muted:#6a6184;--panel:#ffffff;--soft:#fff6de;
  --line:#3b2f5c;--accent:#ff8a3d;--good:#1f9d5a;--bad:#d9434a;--blue:#3a7bf0;
  --okbg:#ddf6e6;--badbg:#ffe3e3;--hl:#fff0a0;--chip:#fff3cf;
  color-scheme:light dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b2045;--bg2:#271c3d;--ink:#f3eeff;--muted:#bbb0d6;--panel:#2c2650;--soft:#3a3060;
  --line:#0c0820;--okbg:#1d4630;--badbg:#562128;--hl:#6a5714;--chip:#463a6e;}}
:root[data-theme="dark"]{--bg:#1b2045;--bg2:#271c3d;--ink:#f3eeff;--muted:#bbb0d6;--panel:#2c2650;--soft:#3a3060;
  --line:#0c0820;--okbg:#1d4630;--badbg:#562128;--hl:#6a5714;--chip:#463a6e;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.t{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;font-weight:400}
.wrap{max-width:880px;margin:0 auto;padding:10px 14px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:3px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:24px;line-height:1.2}
.score{font-size:16px;font-weight:700;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:4px 12px;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.tab{flex:0 0 auto;font:inherit;font-size:16px;font-weight:700;padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer;min-height:48px}
.tab.on{background:var(--accent);color:#fff}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:16px;margin:16px 0}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.sec-h .tag{font-size:15px;background:var(--line);color:#fff;border-radius:10px;padding:2px 10px;white-space:nowrap}
.sec-h h2{margin:0;font-size:23px;line-height:1.3}
.inst{margin:4px 0;color:var(--muted)}
.btn{font:inherit;font-size:18px;font-weight:700;min-height:52px;padding:8px 20px;border:3px solid var(--line);border-radius:16px;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.green{background:var(--good)}
.btn.red{background:var(--bad)}
.btn.sm{font-size:15px;min-height:42px;padding:4px 12px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
details.tip{background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:8px 12px;margin:10px 0}
details.tip summary{cursor:pointer;font-weight:700;min-height:36px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 14px;margin-top:6px;font-size:16px}
.vlist b{color:var(--accent)}
.pic{display:block;width:100%;height:auto;border:3px solid var(--line);border-radius:16px;background:#fff}
.pic-wrap{max-width:440px;margin:6px auto}
.pics3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.pics3{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start}
@media (max-width:640px){.item{grid-template-columns:1fr}}
.qn{font-weight:700;font-size:20px}
.sent{font-size:21px;line-height:2;margin:6px 0}
.slot{display:inline-block;min-width:90px;border-bottom:3px solid var(--line);text-align:center;color:var(--blue);font-weight:700;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-size:19px;padding:6px 16px;min-height:50px;border:3px solid var(--line);border-radius:14px;background:var(--chip);color:var(--ink);cursor:pointer}
.chip.sel{background:var(--hl);outline:3px solid var(--blue)}
.chip.right{background:var(--okbg);border-color:var(--good)}
.chip.used{opacity:.35;text-decoration:line-through}
.chip.sm{font-size:16px;min-height:42px;padding:4px 12px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--panel);padding:8px 0;z-index:2}
.passage p{text-indent:2em;line-height:2.3;margin:6px 0;font-size:19px}
.blank{display:inline-block;vertical-align:bottom;min-width:88px;min-height:38px;padding:0 6px;margin:0 3px;text-indent:0;border:none;border-bottom:3px solid var(--line);
  background:transparent;color:var(--blue);font:inherit;font-size:19px;font-weight:700;cursor:pointer;border-radius:6px 6px 0 0}
.blank .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;font-size:13px;margin-right:4px;vertical-align:middle}
.blank.cur{background:var(--hl)}
.blank.ok{color:var(--good);cursor:default}
.blank.bad{background:var(--badbg);color:var(--bad)}
.fb{border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:12px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb .h{font-weight:700;font-size:19px}
.fb ul{margin:6px 0;padding-left:20px}
.ans{min-height:58px;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;background:var(--soft)}
.ans .ph{color:var(--muted);font-size:15px;padding:0 6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:inherit;font-size:19px;padding:6px 12px;min-height:48px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}
.ans .tile{background:#fff2c2;color:#2a2340}
.order-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opic{position:relative;padding:0;border:none;background:none;cursor:pointer;border-radius:16px}
.opic .num{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center;border:3px solid var(--line)}
.opic.ok .num{background:var(--good)}
.seqpic{position:relative}
.tw{border-top:2px dashed var(--line);padding:8px 0;font-size:16px}
.fb:not(.ok):not(.bad){background:var(--soft)}
.seqpic .num{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center;border:3px solid var(--line)}
.guide{background:var(--soft);border-radius:12px;padding:6px 12px;margin:6px 0;font-size:17px}
.done-line{font-size:20px;font-weight:700;color:var(--good)}
.word{display:inline-block;font-size:22px;font-weight:700;background:var(--accent);color:#fff;border-radius:12px;padding:2px 14px;border:3px solid var(--line)}
textarea{width:100%;font:inherit;font-size:19px;min-height:96px;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--panel);color:var(--ink);margin-top:8px}
.cnt{font-size:14px;color:var(--muted)}
.stars{font-size:40px;letter-spacing:4px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:2px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblw{overflow-x:auto}
.bar{height:16px;background:var(--soft);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
input.txt{font:inherit;font-size:18px;padding:8px 12px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);min-height:48px;width:100%;max-width:280px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--line);color:#fff;padding:10px 18px;border-radius:14px;z-index:20;font-weight:700;max-width:90vw;text-align:center}
.hero{text-align:center}
.hero .big{font-size:56px;line-height:1.2}
.muted{color:var(--muted)}
.lock{opacity:.5;pointer-events:none}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pybtn{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:4px 14px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer}
.pybtn[aria-pressed="true"]{background:#3a7bf0;color:#fff}
.say{font:inherit;font-size:17px;min-width:40px;min-height:40px;padding:0 6px;border:2px solid var(--line);border-radius:12px;background:#ffe9a8;color:#2a2340;cursor:pointer;vertical-align:middle;line-height:1;text-indent:0}
.say:active{transform:scale(.92)}
.pyc{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:bottom;text-indent:0;margin:0 1px}
.pyc i{font-style:normal;font-size:.56em;font-weight:400;color:var(--muted);font-family:"Helvetica Neue",Arial,sans-serif;white-space:nowrap}
.chip .pyc i,.tile .pyc i,.blank .pyc i,.word .pyc i,.btn .pyc i,.slot .pyc i{color:inherit;opacity:.8}
body.py .sent{line-height:2.2}
body.py .blank{display:inline-flex;align-items:flex-end;gap:3px;line-height:1.3;min-height:46px;padding-bottom:2px}
body.py .blank .n{margin-bottom:3px}
body.py .passage p{line-height:2.6}
body.py .inst,body.py .guide,body.py .fb,body.py .vlist,body.py details p{line-height:2.2}
body.py .chip,body.py .tile{padding-top:2px;padding-bottom:2px}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

.sheetbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sheetbar select{font:inherit;font-size:17px;font-weight:700;min-height:48px;padding:6px 10px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:100%}
.sel{font:inherit;font-size:18px;min-height:44px;padding:4px 8px;margin:0 4px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:100%}
.txt.inl{display:inline-block;width:6.5em;max-width:100%;min-height:44px;padding:4px 8px;margin:0 4px;font-size:18px;vertical-align:middle}
.sel.ok,.txt.ok{background:var(--okbg);border-color:var(--good)}
.sel.bad,.txt.bad{background:var(--badbg);border-color:var(--bad)}
.hint{font-size:15px;color:var(--bad);font-weight:700;margin-left:4px}
.qline{font-size:19px;line-height:2;margin:8px 0}
.qline .lbl{font-weight:700;margin-right:4px}
.opt{display:flex;align-items:center;gap:8px;font-size:18px;min-height:44px;margin:4px 0;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--accent)}
.mcq,.msq{border-radius:12px;padding:4px 8px;margin:6px 0}
.mcq.ok,.msq.ok{background:var(--okbg)}
.mcq.bad,.msq.bad{background:var(--badbg)}
.passage-box{white-space:pre-line;background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:18px;line-height:2}
.model{display:none;background:var(--okbg);border:2px solid var(--good);border-radius:12px;padding:8px 12px;margin-top:6px;font-size:17px;white-space:pre-line}
.model.show{display:block}
.wr-box{width:100%;font:inherit;font-size:18px;min-height:90px;border:3px solid var(--line);border-radius:14px;padding:8px;background:var(--panel);color:var(--ink);margin-top:6px}
.pic-strip{display:block;max-width:100%;height:auto;border:2px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 10px}
.cellrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center;margin:12px 0}
.cell{width:100%;height:auto;border-radius:12px;background:#fff;border:2px solid var(--line)}
.cellq{min-width:0}
@media (max-width:560px){.cellrow{grid-template-columns:1fr}}
.ovlwrap{width:100%;margin:0}
.ovl{position:relative;width:100%;max-width:910px;margin:0 auto;container-type:inline-size}
.ovl>img{display:block;width:100%;height:auto;border-radius:8px}
.ovs{position:absolute;box-sizing:border-box;min-height:0;margin:0;font:inherit;font-size:19px;font-weight:700;border:2px solid transparent;background:transparent;color:#1a4fc4;padding:0 6px;border-radius:8px}
.ovs:focus{outline:3px solid var(--blue);background:rgba(255,255,255,.85)}
.ovs.big{text-align:center;padding:0;background:rgba(255,255,255,.6)}
.ovs.ta{font-size:24px;line-height:71px;resize:none;background:transparent;border:none;padding:0 4px;overflow:hidden;color:var(--ink)}
.ovs.cover{background:#fff;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 1px #c9cfe0}
.ovs.blank{background:#fff;border:none;border-bottom:2px solid var(--line)}
.ovs.box{background:#fff;border:2px solid var(--line);color:var(--ink);font-size:20px;border-radius:10px}
.ovs.ok{background:rgba(221,246,230,.9);border-color:var(--good)}
.ovs.bad{background:rgba(255,227,227,.9);border-color:var(--bad)}
.note{background:var(--chip);border-radius:12px;padding:6px 12px;margin-top:8px;font-size:16px;color:var(--ink)}
.scorebox{font-size:17px;font-weight:700}
.navline{font-size:15px;margin:4px 0 0}
.navline a{color:var(--blue)}
.dl-wrap{overflow-x:auto}
.item-num{font-weight:700;margin-right:6px}
@media (max-width:560px){.sel{font-size:17px}.qline{font-size:18px}}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1 class="t">📘 三年级华文 · 课堂评估</h1>
  <div class="hdr-r"><span class="score scorebox" id="score">未检查</span></div>
</div></header>
<main class="wrap">
  <div class="sheetbar">
    <select id="sheetSel" aria-label="选择课堂评估"></select>
    <button class="btn sm" id="checkBtn">检查答案</button>
    <button class="btn sm alt" id="revealBtn">显示答案</button>
    <button class="btn sm alt" id="resetBtn">重做</button>
  </div>
  <div class="navline"><a href="index.html">← 返回学习中心 Learning Hub</a>　<span class="muted">图片题请对照纸质练习本作答。</span></div>
  <div id="view"></div>
</main>
<script>

function flatSheets(){
  const out = [];
  for(const book of ['3A','3B']){
    DATA[book].forEach((sh, i) => out.push({book, sh, key: book + '-' + i}));
  }
  return out;
}

function fillSelector(){
  const sel = $('sheetSel');
  let html = '';
  for(const book of ['3A','3B']){
    html += `<optgroup label="华文 ${book}">`;
    DATA[book].forEach((sh, i) => {
      html += `<option value="${book}-${i}">课堂评估 ${sh.no} · ${esc(sh.title)}</option>`;

  }
  sel.innerHTML = html;
  sel.addEventListener('change', () => showSheet(sel.value));
}

function opts(list){
  return '<option value="">请选择</option>' + list.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
}

// Interleave text parts with controls for each "{}" placeholder.
function fillParts(text, makeControl, count){
  const parts = String(text).split('{}');
  let out = '';
  for(let i = 0; i < parts.length; i++){
    out += esc(parts[i]).replace(/\n/g, '<br>');
    if(i < parts.length - 1 && i < count){ out += makeControl(i); }
  }
  // controls with no placeholder go at the end
  for(let i = parts.length - 1; i < count; i++){ out += ' ' + makeControl(i); }
  return out;
}

function renderSel(it){
  const n = it.b.length;
  const ctrl = i => {
    uid++;
    const b = it.b[i];
    return `<select class="sel gr" id="c${uid}" data-kind="sel" data-a="${esc(b.a)}">${opts(b.o)}</select>`;
  };
  return `<div class="qline">${fillParts(it.s, ctrl, n)}</div>`;
}

function renderIn(it){
  const answers = Array.isArray(it.a) ? it.a : [it.a];
  const ctrl = i => {
    uid++;
    return `<input class="txt inl gr" id="c${uid}" data-kind="in" data-a="${esc(answers[i])}" autocomplete="off" autocapitalize="off" aria-label="填空">`;
  };
  return `<div class="qline">${fillParts(it.s, ctrl, answers.length)}</div>`;
}

function renderMC(it){
  uid++;
  const name = 'mc' + uid;
  let h = `<div class="qline"><span class="lbl">${esc(it.q)}</span></div><div class="mcq gr" data-kind="mc" data-a="${it.a}">`;
  it.o.forEach((o, i) => {
    h += `<label class="opt"><input type="radio" name="${name}" value="${i}"> ${esc(o)}</label>`;
  });
  return h + '</div>';
}

function renderMS(it){
  uid++;
  const ans = JSON.stringify(it.a);
  let h = `<div class="qline"><span class="lbl">${esc(it.s)}</span></div><div class="msq gr" data-kind="ms" data-a='${ans}'>`;
  it.o.forEach((o, i) => {
    h += `<label class="opt"><input type="checkbox" value="${i}"> ${esc(o)}</label>`;
  });
  return h + '</div>';
}

function renderWR(it){
  uid++;
  const model = it.m ? `<div class="model" id="m${uid}">参考答案：\n${esc(it.m)}</div>` : '';
  const btn = it.m ? `<button class="btn sm alt" data-toggle="m${uid}" type="button">看参考答案</button>` : '';
  return `<div class="qline"><span class="lbl">${esc(it.p).replace(/\n/g, '<br>')}</span></div>
    <textarea class="wr-box" aria-label="写作"></textarea>
    <div class="row">${btn}</div>${model}`;
}

function renderItem(it){
  if(it.items){
    let h = `<div class="passage-box">${esc(it.p)}</div>`;
    it.items.forEach(sub => h += renderItem(sub));
    return h;
  }
  if(it.q !== undefined) return renderMC(it);
  if(it.p !== undefined) return renderWR(it);
  if(it.b) return renderSel(it);
  if(it.o && it.a !== undefined && Array.isArray(it.a) && it.s !== undefined && Array.isArray(it.o)) return renderMS(it);
  if(it.a !== undefined) return renderIn(it);
  return '';
}

function renderOverlay(ov){
  const W = ov.w;
  const fz = (px, min) => `font-size:max(${min || 12}px,${(px / W * 100).toFixed(3)}cqw)`;
  let h = `<div class="ovlwrap"><div class="ovl"><img src="${ov.img}" alt="练习页" width="${ov.w}" height="${ov.h}" loading="eager">`;
  ov.c.forEach(c => {
    const pos = `left:${(c.x / W * 100).toFixed(3)}%;top:${(c.y / ov.h * 100).toFixed(3)}%;width:${(c.w / W * 100).toFixed(3)}%;height:${(c.h / ov.h * 100).toFixed(3)}%`;
    const box = c.box ? ' box' : '';
    if(c.k === 'blank'){
      h += `<div class="ovs blank" style="${pos}"></div>`;
    } else if(c.k === 'ta'){
      const fs = c.fs || 24;
      const lh = c.lh ? `;line-height:${(c.lh / W * 100).toFixed(3)}cqw` : '';
      h += `<textarea class="ovs ta${box}" aria-label="写作" style="${pos};${fz(fs)}${lh}"></textarea>`;
    } else if(c.k === 'sel'){
      const fs = c.fs || 19;
      h += `<select class="gr ovs${box}${c.cover ? ' cover' : ''}" data-kind="sel" data-a="${esc(c.a)}" style="${pos};${fz(fs)}" aria-label="选择">${opts(c.o)}</select>`;
    } else {
      const big = c.k === 'big' ? ' big' : '';
      const fs = c.k === 'big' ? 30 : 19;
      const ph = c.ph ? ` placeholder="${esc(c.ph)}"` : '';
      h += `<input class="gr ovs${big}${box}" data-kind="in" data-a="${esc(c.a)}" style="${pos};${fz(fs)}" aria-label="填写" autocomplete="off"${ph}>`;
    }
  });
  return h + '</div></div>';
}

function showSheet(key){
  const [book, idx] = key.split('-');
  const sh = DATA[book][+idx];
  current = key;
  $('sheetSel').value = key;
  let h = `<section class="card"><div class="sec-h"><span class="tag">华文${book} · 课堂评估 ${sh.no}</span><h2 class="t">${esc(sh.unit)}</h2></div>
    <p class="inst">${esc(sh.title)}</p></section>`;
  sh.secs.forEach(sec => {
    if(sec.overlay && sec.overlay.skip) return;
    h += sec.overlay ? `<section class="card">` : `<section class="card"><p class="inst" style="color:var(--ink);font-weight:700">${esc(sec.ins)}</p>`;
    const pk = book + '-' + sh.no + '-' + sh.secs.indexOf(sec);
    if(!sec.overlay && PICS[pk] && !sec.items.some((it, idx) => PICS[pk + '-' + idx])) h += `<img class="pic-strip" src="${PICS[pk]}" alt="题目图片" loading="lazy">`;
    if(sec.overlay){ h += renderOverlay(sec.overlay); }
    else sec.items.forEach((it, idx) => {
      const cp = PICS[pk + '-' + idx];
      if(cp) h += `<div class="cellrow"><img class="cell" src="${cp}" alt="图${idx + 1}"><div class="cellq">${renderItem(it)}</div></div>`;
      else h += `<div class="item-block" style="margin:10px 0">${renderItem(it)}</div>`;
    });
    if(sec.note) h += `<div class="note">${esc(sec.note)}</div>`;
    h += '</section>';
  });
  $('view').innerHTML = h;
  $('score').textContent = '未检查';
  window.scrollTo(0, 0);
}

function valueOf(el){
  if(el.dataset.kind === 'sel' || el.dataset.kind === 'in') return el.value;
  return null;
}

function norm(s){ return String(s).replace(/\s+/g, '').toLowerCase(); }

function checkAll(){
  const els = document.querySelectorAll('#view .gr');
  let right = 0, total = 0;
  els.forEach(el => {
    el.classList.remove('ok', 'bad');
    el.querySelectorAll('.hint').forEach(x => x.remove());
    const kind = el.dataset.kind;
    let good = false, answerText = '';
    if(kind === 'sel'){
      answerText = el.dataset.a; good = el.value === el.dataset.a;
    } else if(kind === 'in'){
      answerText = el.dataset.a; good = norm(el.value) === norm(el.dataset.a);
    } else if(kind === 'mc'){
      const picked = el.querySelector('input:checked');
      good = !!picked && picked.value === el.dataset.a;
      answerText = el.querySelectorAll('.opt')[+el.dataset.a].textContent.trim();
    } else if(kind === 'ms'){
      const want = JSON.parse(el.dataset.a).slice().sort().join(',');
      const got = [...el.querySelectorAll('input:checked')].map(x => x.value).sort().join(',');
      good = want === got;
      answerText = JSON.parse(el.dataset.a).map(i => el.querySelectorAll('.opt')[i].textContent.trim()).join('、');
    }
    total++;
    if(kind === 'mc' || kind === 'ms'){
      el.classList.add(good ? 'ok' : 'bad');
      if(good) right++; else el.insertAdjacentHTML('beforeend', `<span class="hint">答案：${esc(answerText)}</span>`);
    } else {
      el.classList.add(good ? 'ok' : 'bad');
      if(good) right++; else el.insertAdjacentHTML('afterend', `<span class="hint">答案：${esc(answerText)}</span>`);
    }
  });
  $('score').textContent = total ? `得分 ${right} / ${total}` : '本页没有可自动检查的题目';
}

function revealAll(){
  document.querySelectorAll('#view .gr').forEach(el => {
    el.classList.remove('ok', 'bad');
    const kind = el.dataset.kind;
    if(kind === 'sel' || kind === 'in'){ el.value = el.dataset.a; }
    else if(kind === 'mc'){
      el.querySelectorAll('input').forEach(x => x.checked = (x.value === el.dataset.a));
    } else if(kind === 'ms'){
      const want = JSON.parse(el.dataset.a).map(String);
      el.querySelectorAll('input').forEach(x => x.checked = want.includes(x.value));
    }
  });
  // Writing model answers stay behind their own "看参考答案" button.
  $('score').textContent = '已显示答案';
}

function resetAll(){
  document.querySelectorAll('#view .gr').forEach(el => {
    el.classList.remove('ok', 'bad');
    el.querySelectorAll('.hint').forEach(x => x.remove());
    if(el.dataset.kind === 'sel' || el.dataset.kind === 'in') el.value = '';
    if(el.dataset.kind === 'mc' || el.dataset.kind === 'ms') el.querySelectorAll('input').forEach(x => x.checked = false);
  });
  document.querySelectorAll('#view textarea').forEach(t => t.value = '');
  $('score').textContent = '未检查';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if(t){
    const m = document.getElementById(t.dataset.toggle);
    if(m) m.classList.toggle('show');
  }
});

$('checkBtn').addEventListener('click', checkAll);
$('revealBtn').addEventListener('click', revealAll);
$('resetBtn').addEventListener('click', resetAll);

fillSelector();
showSheet('3A-0');
</script>
</body>
</html>
