const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={};
function st(i){return state[i]||(state[i]={picked:{},done:false});}
let passed=new Set();
try{ passed=new Set(JSON.parse(localStorage.getItem('comp-passed')||'[]')); }catch(err){}
function savePassed(){ try{ localStorage.setItem('comp-passed',JSON.stringify([...passed])); }catch(err){} }
function unlocked(i){ return i===0 || passed.has(i-1); }
function essayHTML(e,i){
  if(!unlocked(i)){
    return `<section class="card" id="es${i}"><span class="tag">第 ${e.no} 篇</span><h2>🔒 第 ${e.no} 篇还没开放</h2><p class="muted">请先把第 ${e.no-1} 篇的 8 个空格全部选对，并按「检查」，再来做这一篇。</p></section>`;
  }
  const s=st(i);
  let h=`<section class="card" id="es${i}"><span class="tag">第 ${e.no} 篇</span><h2>${esc(e.title)}</h2>`;
  h+=`<div class="bank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  e.paras.forEach(p=>{
    const body=p.split(/\{(\d+)\}/).map((seg,k)=>{
      if(k%2===0)return esc(seg);
      const n=+seg,pk=s.picked[n]||'',good=s.done&&pk===e.ans[n-1];
      const cls=s.done?(good?'ok':'bad'):'';
      return `<select data-es="${i}" data-n="${n}" class="${cls}" aria-label="第${n}空"><option value="">＿＿</option>${e.bank.map(w=>`<option value="${esc(w)}"${pk===w?' selected':''}>${esc(w)}</option>`).join('')}</select>`;
    }).join('');
    h+=`<p class="para">${body}</p>`;
  });
  if(s.done){
    const ok=e.ans.filter((a,k)=>s.picked[k+1]===a).length;
    h+=`<div class="fbline">本篇：${ok} / 8 对 ${ok===8?'🎉 全对了！':''}</div>`;
    const wrong=e.ans.map((a,k)=>({n:k+1,a,p:s.picked[k+1]||''})).filter(x=>x.p!==x.a);
    if(wrong.length)h+=`<div class="ansline">${wrong.map(x=>`第${x.n}空：${esc(x.a)}`).join('　')}</div>`;
  }
  h+=`<div class="row"><button class="btn" data-act="check" data-es="${i}">✔ 检查</button><button class="btn alt sm" data-act="show" data-es="${i}">👀 看答案</button><button class="btn alt sm" data-act="clear" data-es="${i}">↺ 重来</button></div>`;
  return h+`</section>`;
}
function render(){
  COMP.forEach((e,i)=>{
    const s=state[i];
    if(s&&s.done&&!s.revealed&&e.ans.every((a,k)=>s.picked[k+1]===a)&&!passed.has(i)){ passed.add(i); savePassed(); }
  });
  document.getElementById('view').innerHTML=COMP.map((e,i)=>essayHTML(e,i)).join('');
  const j=document.getElementById('jump');
  if(j){ const cur=j.value; j.innerHTML='<option value="">跳到第几篇…</option>'; COMP.forEach((e,i)=>{ const o=document.createElement('option'); o.value=i; o.disabled=!unlocked(i); o.textContent=`第 ${e.no} 篇　${e.title}`+(unlocked(i)?'':'（未开放）'); j.appendChild(o); }); j.value=cur; }
  scoreLine();
}
function scoreLine(){
  let right=0,done=0;
  COMP.forEach((e,i)=>{const s=state[i];if(!s)return;if(s.done){done++;}e.ans.forEach((a,k)=>{if(s.picked[k+1]===a)right++;});});
  document.getElementById('score').textContent=`✅ ${right} / ${COMP.length*8}　已检查 ${done} 篇`;
}
document.addEventListener('change',ev=>{
  const s=ev.target;if(s.tagName!=='SELECT'||s.dataset.es===undefined)return;
  st(+s.dataset.es).picked[+s.dataset.n]=s.value;
  scoreLine();
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const i=+b.dataset.es,e=COMP[i],s=st(i);
  document.querySelectorAll(`select[data-es="${i}"]`).forEach(x=>{s.picked[+x.dataset.n]=x.value;});
  const act=b.dataset.act;
  if(act==='check'){
    const miss=[1,2,3,4,5,6,7,8].filter(n=>!s.picked[n]).length;
    if(miss){alert('还有 '+miss+' 个空格没有选哦！');return;}
    s.done=true;
  }else if(act==='show'){
    e.ans.forEach((a,k)=>{s.picked[k+1]=a;});s.done=true;s.revealed=true;
  }else if(act==='clear'){
    state[i]={picked:{},done:false};
  }
  const y=window.scrollY;render();window.scrollTo(0,y);
});
(function(){const j=document.getElementById('jump');
  j.addEventListener('change',ev=>{const el=document.getElementById('es'+ev.target.value);if(el)el.scrollIntoView({block:'start'});ev.target.value='';});})();
render();
</script>
