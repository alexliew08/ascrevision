const SECTIONS = NEW_SECTIONS.flatMap(splitSection);
const ALL = [];
SECTIONS.forEach(s => s.qs.forEach(q => ALL.push(q)));
const TABS = SECTIONS.map(s => 'Q' + s.qs[0].n + '–' + s.qs[s.qs.length - 1].n);
const vals = {};         // n -> array: choose items [index], text/drag items [string per blank]
const checkedQ = {};     // n -> true once its group has been checked
const blockResult = {};  // first question n of a group -> result text
let active = 0;
let selTile = null;      // word tile selected by tap (drag-free placement)

/* Progress is kept in this browser so answers and Check results survive a reload. */
const PROG_KEY = 'uasa-comp-bm4-progress-v1';
function saveProgress(){
  try { localStorage.setItem(PROG_KEY, JSON.stringify({ vals, checkedQ, blockResult })); } catch (e) {}
}
function loadProgress(){
  try {
    const raw = localStorage.getItem(PROG_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    Object.keys(d.vals || {}).forEach(k => { vals[k] = d.vals[k].map(x => x === null ? undefined : x); });
    Object.assign(checkedQ, d.checkedQ || {});
    Object.assign(blockResult, d.blockResult || {});
  } catch (e) {}
}
function clearProgress(){
  try { localStorage.removeItem(PROG_KEY); } catch (e) {}
}

/* Each Check is also sent to the shared progress sheet (same sheet as the other year pages). */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwfpSs2biONcgBbbWnG5WW3QKec1ShM9c5LUCrb7TtI5jeKlGUm0sHvH5odTN1l8oSV/exec';
const checkTries = {};
function sendCheck(first, right, total){
  let who = '';
  try { who = (JSON.parse(sessionStorage.getItem('asc_student') || 'null') || {}).name || ''; } catch (e) {}
  if (!who) return; // no student logged in on the hub: nothing to record
  checkTries[first] = (checkTries[first] || 0) + 1;
  const state = {};
  SECTIONS[active].qs.forEach(q => { state[q.n] = vals[q.n] || []; });
  try {
    fetch(SHEET_URL, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ at: new Date().toISOString(), student: who, page: 'year4-comprehension.html?part=' + TABS[active],
        right: right, total: total, tries: checkTries[first], state: JSON.stringify(state) })
    });
  } catch (e) {}
}

function isChoose(q){ return Array.isArray(q.o); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtText(s){ return esc(s).replace(/_{3,}/g, '<span class="bl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'); }
function fmtPassage(s){ return esc(s).replace(/\[(\d+)\]/g, (m, n) => '<span class="bl">(' + n + ')</span>'); }
function groups(qs){ return [qs]; } /* each tab is one group with one Check button */
function norm(s){ return String(s).trim().toLowerCase().replace(/[’`]/g, "'").replace(/[.!?]+$/, '').replace(/\s+/g, ' '); }
function accepted(list, v){ return v !== undefined && v !== '' && list.some(a => norm(a) === norm(v)); }
function isQ(q){
  const v = vals[q.n] || [];
  if (isChoose(q)) return v[0] === q.a;
  if (q.kw) return q.kw.every(k => v[0] !== undefined && norm(v[0]).includes(norm(k)));
  if (q.kwg) return q.kwg.every(g => v[0] !== undefined && g.some(k => norm(v[0]).includes(norm(k))));
  return q.ans.every((acc, k) => accepted(acc, v[k]));
}
function hasAnswer(q){ return (vals[q.n] || []).some(x => x !== undefined && x !== ''); }

function fmtClick(s){ return esc(s).replace(/\{([^}]+)\}/g, (m, w) => '<span class="nm" data-w="' + w + '">' + w + '</span>'); }
function clickNames(){ return SECTIONS[active].qs.map(q => (vals[q.n] || [])[0]).filter(x => x !== undefined && x !== ''); }
function syncHighlight(){ const picked = clickNames(); document.querySelectorAll('.nm').forEach(el => el.classList.toggle('sel', picked.includes(el.dataset.w))); }
function toggleName(w){
  const sec = SECTIONS[active];
  let names = clickNames();
  if (names.includes(w)) names = names.filter(x => x !== w);
  else if (names.length < sec.qs.length) names = names.concat([w]);
  sec.qs.forEach((q, k) => { vals[q.n] = [names[k]]; });
  renderAnswers();
  syncHighlight();
  renderHeader();
}
document.getElementById('paper').addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('.nm') : null;
  if (t && SECTIONS[active].kind === 'click') toggleName(t.dataset.w);
});

function renderAll(){ renderTabs(); renderPaper(); renderAnswers(); renderHeader(); }

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map((t, i) => '<button type="button" class="tab' + (i === active ? ' on' : '') + (sectionDone(SECTIONS[i]) ? ' done' : '') + '" data-i="' + i + '">' + esc(t) + (sectionDone(SECTIONS[i]) ? ' ✓' : '') + '</button>').join('');
  nav.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
}

function goTo(i){
  if (i < 0 || i >= SECTIONS.length) return;
  active = i;
  selTile = null;
  renderAll();
  document.getElementById('answers').scrollTop = 0;
  document.getElementById('paper').scrollTop = 0;
}

function renderPaper(){
  const sec = SECTIONS[active];
  if (sec.fullpage) { document.getElementById('paper').innerHTML = (sec.panels || [sec.panel]).map(p => '<img class="qimg panel" src="' + p + '" alt="Worksheet">').join(''); syncHighlight(); return; }
  let html = '<div class="paper-head"><span>Nama: ____________________</span><span>Kelas: ________</span><span>Tarikh: ________</span></div>';
  html += '<div class="paper-title">' + esc(sec.title) + '</div>';
  if (sec.panel) html += '<img class="qimg panel" src="' + sec.panel + '" alt="">';
  if (sec.gallery) html += '<div class="gal">' + sec.gallery.map((s, i) => '<figure><img class="qimg" src="' + s + '" alt=""><figcaption>Gambar ' + (i + 1) + '</figcaption></figure>').join('') + '</div>';
  if (sec.passage) {
    html += '<div class="passage">' + (sec.kind === 'click' ? fmtClick(sec.passage) : fmtPassage(sec.passage)) + '</div>';
    sec.qs.forEach(q => { if (q.img || q.t) html += '<div class="pline">' + (q.img ? '<img class="qimg" src="' + q.img + '" alt="">' : '') + (q.t ? '<span>' + fmtText(q.t) + '</span>' : '') + '</div>'; });
  } else {
    sec.qs.forEach(q => { if (q.t) html += '<div class="pline">' + (q.img ? '<img class="qimg" src="' + q.img + '" alt="">' : '') + '<span>' + fmtText(q.t) + '</span></div>'; });
  }
  document.getElementById('paper').innerHTML = html;
  syncHighlight();
}

function renderAnswers(){
  const sec = SECTIONS[active];
  let html = '<p class="note">Jawab di ruangan kanan, kemudian tekan ✔ Semak untuk setiap kumpulan.</p>';
  html += '<div class="sec-t">' + esc(sec.title || '') + '</div>';
  if (sec.bank) {
    html += '<div class="bank"><span class="bank-h">Senarai perkataan · seret ke tempat kosong, atau tekan perkataan kemudian tempat kosong</span>';
    html += sec.bank.map(w => '<span class="tile" draggable="true" data-word="' + esc(w) + '">' + (sec.bankImgs ? '<img class="tileimg" src="' + sec.bankImgs[w] + '" alt="">' : esc(w)) + '</span>').join('');
    html += '</div>';
  }
  groups(sec.qs).forEach(group => {
    const first = group[0].n, last = group[group.length - 1].n;
    html += '<div class="grp"><div class="grp-h">Soalan ' + first + '–' + last + ' · Q' + first + '–' + last + '</div>';
    group.forEach(q => {
      html += '<div class="arow"><span class="an">' + q.n + '.</span>' + (q.qt ? '<span class="qt">' + esc(q.qt) + '</span>' : '') + (q.lab ? '<span class="lab">' + esc(q.lab) + '</span>' : '');
      if (isChoose(q)) {
        html += '<select class="ans" id="s' + q.n + '" data-n="' + q.n + '" aria-label="Question ' + q.n + '">';
        html += '<option value="">— Pilih —</option>';
        q.o.forEach((opt, i) => { html += '<option value="' + i + '">' + LET[i] + '. ' + esc(opt) + '</option>'; });
        html += '</select>';
      } else {
        q.ans.forEach((acc, k) => {
          const id = 'i' + q.n + '_' + k;
          if (sec.bank || sec.kind === 'click') html += '<span class="slot" id="' + id + '" data-n="' + q.n + '" data-k="' + k + '" tabindex="0"></span>';
          else if (q.essay) html += '<textarea class="tin essay" id="' + id + '" data-n="' + q.n + '" data-k="' + k + '"></textarea>'; else html += '<input type="text" class="tin" id="' + id + '" data-n="' + q.n + '" data-k="' + k + '" autocomplete="off" aria-label="Question ' + q.n + ' blank ' + (k + 1) + '">';
        });
      }
      html += '<span class="amsg" id="m' + q.n + '"></span></div>';
    });
    html += '<div class="blockcheck"><button type="button" class="btn check" data-first="' + first + '">✔ Semak</button><span class="blockmsg" id="bm' + first + '">' + esc(blockResult[first] || '') + '</span></div></div>';
  });
  const box = document.getElementById('answers');
  box.innerHTML = html;
  box.querySelectorAll('select.ans').forEach(sel => sel.addEventListener('change', () => setVal(+sel.dataset.n, 0, sel.value === '' ? undefined : +sel.value)));
  box.querySelectorAll('input.tin, textarea.tin').forEach(inp => inp.addEventListener('input', () => setVal(+inp.dataset.n, +inp.dataset.k, inp.value)));
  box.querySelectorAll('.slot').forEach(sl => {
    sl.addEventListener('click', () => {
      const n = +sl.dataset.n, k = +sl.dataset.k;
      if (sec.kind === 'click') { const w = (vals[n] || [])[k]; if (w) toggleName(w); return; }
      if (selTile) { setVal(n, k, selTile); selTile = null; renderBankSel(); }
      else if (vals[n] && vals[n][k]) setVal(n, k, '');
    });
    sl.addEventListener('dragover', e => e.preventDefault());
    sl.addEventListener('drop', e => { e.preventDefault(); setVal(+sl.dataset.n, +sl.dataset.k, e.dataTransfer.getData('text/plain')); });
  });
  box.querySelectorAll('.tile').forEach(tl => {
    tl.addEventListener('click', () => { selTile = selTile === tl.dataset.word ? null : tl.dataset.word; renderBankSel(); });
    tl.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', tl.dataset.word); selTile = null; renderBankSel(); });
  });
  box.querySelectorAll('.btn.check').forEach(btn => btn.addEventListener('click', () => checkGroup(+btn.dataset.first)));
  sec.qs.forEach(q => paintQuestion(q.n));
}

function renderBankSel(){
  document.querySelectorAll('.tile').forEach(tl => tl.classList.toggle('sel', tl.dataset.word === selTile));
}

function setVal(n, k, val){
  vals[n] = vals[n] || [];
  vals[n][k] = (val === '' || val === undefined) ? (isChoose(ALL.find(x => x.n === n)) ? undefined : '') : val;
  paintQuestion(n);
  renderHeader();
}

function checkGroup(first){
  const group = groups(SECTIONS[active].qs).find(g => g[0].n === first);
  group.forEach(q => { checkedQ[q.n] = true; paintQuestion(q.n); });
  const right = group.filter(isQ).length;
  blockResult[first] = 'Soalan ' + first + '–' + group[group.length - 1].n + ': ' + right + ' / ' + group.length + ' betul';
  document.getElementById('bm' + first).textContent = blockResult[first];
  sendCheck(first, right, group.length);
  renderHeader();
}

/* Never shows the correct answer: only marks what was entered as right or wrong. */
function paintQuestion(n){
  const q = ALL.find(x => x.n === n);
  const v = vals[n] || [];
  const msg = document.getElementById('m' + n);
  if (!msg) return;
  if (isChoose(q)) {
    const sel = document.getElementById('s' + n);
    if (sel) {
      sel.value = v[0] === undefined ? '' : String(v[0]);
      sel.classList.remove('ok','bad');
      if (checkedQ[n]) sel.classList.add(v[0] === q.a ? 'ok' : 'bad');
    }
  } else {
    q.ans.forEach((acc, k) => {
      const el = document.getElementById('i' + n + '_' + k);
      if (!el) return;
      const val = v[k] === undefined ? '' : v[k];
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { if (el.value !== val) el.value = val; }
      else { const bi = SECTIONS[active].bankImgs || {}; el.innerHTML = val ? (bi[val] ? '<img class="slotimg" src="' + bi[val] + '" alt="">' : esc(val)) : ''; el.classList.toggle('filled', !!val); }
      el.classList.remove('ok','bad');
      if (checkedQ[n]) el.classList.add(q.kwg ? (isQ(q) ? 'ok' : 'bad') : (((q.kw ? (val !== '' && q.kw.every(k => norm(val).includes(norm(k)))) : accepted(acc, val))) ? 'ok' : 'bad'));
    });
  }
  msg.className = 'amsg';
  msg.textContent = '';
  if (checkedQ[n]) {
    if (isQ(q)) { msg.classList.add('ok'); msg.textContent = '✔ Betul'; }
    else if (!hasAnswer(q)) { msg.classList.add('bad'); msg.textContent = 'Belum dijawab'; }
    else { msg.classList.add('bad'); msg.textContent = '✘ Salah'; }
  }
}

function sectionDone(sec){ return sec.qs.every(q => isQ(q)); }
function renderHeader(){
  renderTabs();
  saveProgress();
  const qs = SECTIONS[active].qs;
  const checked = qs.filter(q => checkedQ[q.n]);
  const right = checked.filter(isQ).length;
  const pill = document.getElementById('status');
  pill.className = 'pill';
  if (checked.length === 0) pill.textContent = 'Belum disemak';
  else if (checked.length < qs.length) { pill.classList.add('partial'); pill.textContent = 'Sedang disemak ' + checked.length + ' / ' + qs.length + ' · betul ' + right; }
  else { pill.classList.add('done'); pill.textContent = 'Disemak · betul ' + right + ' / ' + qs.length; }
  document.getElementById('title').textContent = 'Bahagian ' + (active + 1) + ' / ' + SECTIONS.length + ' · Q' + qs[0].n + '–' + qs[qs.length - 1].n;
  document.getElementById('prevBtn').disabled = active === 0;
  document.getElementById('nextBtn').disabled = active === SECTIONS.length - 1;
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(active - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(active + 1));
document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(vals).forEach(k => delete vals[k]);
  Object.keys(checkedQ).forEach(k => delete checkedQ[k]);
  Object.keys(blockResult).forEach(k => delete blockResult[k]);
  clearProgress();
  selTile = null;
  renderAll();
  window.scrollTo({top: 0, behavior: 'smooth'});
});

loadProgress();
renderAll();
</script>
</body>
</html>
