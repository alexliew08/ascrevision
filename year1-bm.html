<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahasa Melayu · Year 1</title>
<style>
:root{--ink:#1d1d1f;--orange:#ff6b35;--peach:#ffe4cc;--yel:#ffd166;--mute:#6b6b70;--ok:#06d6a0;--bad:#ef476f}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:var(--ink);font-family:"Microsoft YaHei",system-ui,"PingFang SC",sans-serif;padding:14px 14px 24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:22px;font-weight:900;margin:10px 0 4px;line-height:1.3}
.muted{color:var(--mute);font-weight:700;font-size:14px}
.back{display:inline-block;margin-top:6px;border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:900;font-size:14px;color:var(--ink);text-decoration:none;background:#fff;box-shadow:0 3px 0 var(--ink)}
.list{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.ex{border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);padding:10px 14px;font:inherit;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.ex:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ex[aria-pressed="true"]{background:var(--yel)}
.panel{border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:#fff}
.panel iframe{width:100%;height:78vh;min-height:420px;border:0;display:block}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.open{border:3px solid var(--ink);border-radius:16px;background:var(--orange);color:#fff;padding:10px 16px;font-weight:900;text-decoration:none;box-shadow:0 4px 0 var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.btn{border:3px solid var(--ink);border-radius:14px;background:var(--orange);color:#fff;padding:9px 14px;font:inherit;font-weight:900;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn.alt{background:#fff;color:var(--ink)}
.btn:disabled{background:#d6d6d6;color:#8a8a8a;border-color:#8a8a8a;box-shadow:0 4px 0 #8a8a8a;cursor:not-allowed}
select.pg{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:7px 8px;background:#fff}
.chip{display:inline-block;border:3px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:900;font-size:14px;background:var(--peach)}
.msg{margin:8px 0;font-weight:800;min-height:22px}
.sheet{position:relative;border:3px solid var(--ink);border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
.sheet canvas{display:block;width:100%;height:auto}
.ov{position:absolute;transform:translateY(-50%);height:27px;min-width:110px;font:inherit;font-size:14px;font-weight:800;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 4px}
.ov.ok{background:#e9fff8;border-color:var(--ok)}
.ov.bad{background:#ffe3ea;border-color:var(--bad)}
.loading{padding:40px 10px;text-align:center;font-weight:900;color:var(--mute)}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回学习中心 Learning Hub</a>
  <h1>📘 Bahasa Melayu · Tahun 1</h1>
  <div class="muted">选择一份练习。</div>
  <div class="list" id="list" role="group" aria-label="练习列表"></div>

  <section id="ayat" hidden>
    <div class="bar">
      <span class="chip">Tulis Ayat · 国语书写填充</span>
      <select class="pg" id="pgSel" aria-label="选择题号"></select>
      <button class="btn alt" id="prev">← 上一页</button>
      <button class="btn alt" id="next">下一页 →</button>
    </div>
    <div class="bar">
      <button class="btn" id="check">✓ 检查答案</button>
      <button class="btn alt" id="show">👀 显示答案</button>
      <button class="btn alt" id="redo">↺ 重做</button>
      <span class="chip" id="score">未检查</span>
    </div>
    <div class="msg" id="msg"></div>
    <div class="sheet" id="sheet"><div class="loading">正在加载练习…</div></div>
  </section>

  <section class="panel" id="pdfPanel" hidden><iframe id="pdf" title="Latihan Tahun 1"></iframe></section>
  <div class="tools" id="pdfTools" hidden><span class="muted" id="cur"></span><a class="open" id="open" target="_blank" rel="noopener">在新窗口打开 ↗</a></div>
</main>
<script>
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const WORKSHEET = "year1/" + encodeURIComponent("国语书写填充 std1.pdf");

// Answers from "国语书写填充 std1 ans.pdf": 5 answers per Soalan, in blank order
const KEY = {
  1:["memadam","menyapu","menyusun","menampal","membuang"],
  2:["berkelah","menikmati","bermain","bermandi-manda","berjalan-jalan"],
  3:["melayari","membaca","menonton","menyuap","bercakap"],
  4:["membersihkan","menanam","mengemop","longkang","daun-daun"],
  5:["bunga api","menghadiahkan","menarik","angpau","menuang"],
  6:["memasak","minuman","memotong","menyusun","mencuci"],
  7:["berdiri","berdukung","melambaikan","anak sulung","membimbit"],
  8:["surat khabar","aiskrim","tong sampah","bersenam","berjoging"],
  9:["bersarapan","makan","pisang","menyapu","membaca"],
  10:["bersalaman","melayan","menyediakan","menikmati","berbual-bual"],
  11:["menghidangkan","membaca","bermain","memberi","membuat"],
  12:["menyapu","menyusun","memadam","mengemas","membersihkan"],
  13:["hari lahir","meraikan","hadiah","meniup","bertepuk"],
  14:["bersenam","bermain","membuang","berbual-bual","memikat"],
  15:["membersihkan","membuang","menolak","mencantas","menyapu"],
  16:["gelongsor","bermain","handal","peluh","memberi"],
  17:["riang","melambung","memastikan","gelung rotan","berlari"],
  18:["memasak","memotong","membasuh","menyenduk","mengelap"],
  19:["memegang","mengecop","surat khabar","menyusun","berbincang"],
  20:["berbaris","melayan","membasuh","bungkusan","menikmati"],
  21:["melukis","menunggu","berjalan","cermat","mengasah"],
  22:["memilih","pertolongan","membayar","menyusun","ramah"],
  23:["mendirikan","pinggir","menyusun","memasak","menjerang"],
  24:["membancuh","menggergaji","memikul","memaku","menyediakan"],
  25:["menyokong","menjerit","mengawal","menendang","mengejar"],
  26:["berniaga","membakar","menggemari","menikmati","membeli"],
  27:["sukan tahunan","acara sukan","bahagian","khemah","sokongan"],
  28:["melanggar","mengerikan","mengalami","terperanjat","kerosakan"],
  29:["pondok","kerusi","surat khabar","sabar","bergerak"],
  30:["sediakan","membentuk","digamkan","menarik","diterbangkan"]
};
const PAGES = Object.keys(KEY).map(Number);

const EX = [
  { t: "Tulis Ayat · 国语书写填充（可检查）", kind: "ayat" },
  { t: "理解练习 Pemahaman", kind: "pdf", f: "latihan pemahaman tahun 1.pdf" },
  { t: "语法练习 Tatabahasa", kind: "pdf", f: "latihan tatabahasa tahun 1.pdf" }
];

const $ = id => document.getElementById(id);
const list = $("list");

function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); });
}
function loadState(){ try { return JSON.parse(localStorage.getItem("y1bm_ayat") || "{}"); } catch(e){ return {}; } }
function saveState(){ try { localStorage.setItem("y1bm_ayat", JSON.stringify(st)); } catch(e){} }
let st = loadState();

// ---- Tulis Ayat ----
let pdfDoc = null, cur = 1, busy = false;
async function getPdf(){
  if(pdfDoc) return pdfDoc;
  if(!window.pdfjsLib){
    await loadScript(PDFJS + "pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  }
  pdfDoc = await pdfjsLib.getDocument(WORKSHEET).promise;
  return pdfDoc;
}

async function renderPage(n){
  busy = true;
  const sheet = $("sheet");
  sheet.innerHTML = '<div class="loading">正在加载练习…</div>';
  try {
    const pdf = await getPdf();
    const pg = await pdf.getPage(n);
    const base = pg.getViewport({ scale: 1 });
    const vp = pg.getViewport({ scale: 2 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await pg.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    sheet.innerHTML = "";
    sheet.appendChild(canvas);

    // blanks = underscore runs; positions as % of the page
    const tc = await pg.getTextContent();
    const blanks = tc.items.filter(it => /_{5,}/.test(it.str)).map(it => ({
      x: it.transform[4] / base.width * 100,
      y: (base.height - it.transform[5]) / base.height * 100,
      w: it.width / base.width * 100
    })).sort((a, b) => Math.abs(a.y - b.y) < 1.2 ? a.x - b.x : a.y - b.y);

    // Soalan 6 has a decorative short underscore stub (not an answer slot): skip it
    const SKIP = { 6: [5] };
    const kept = blanks.filter((b, i) => !(SKIP[n] || []).includes(i));
    blanks.length = 0; blanks.push(...kept);
    const words = KEY[n].slice().sort();
    const v = (st[n] && st[n].v) || {};
    blanks.forEach((b, i) => {
      const s = document.createElement("select");
      s.className = "ov"; s.dataset.i = i;
      s.style.left = b.x + "%";
      s.style.top = (b.y - 0.6) + "%";
      s.style.width = Math.max(b.w * 1.3, 14) + "%";
      s.innerHTML = '<option value="">请选择</option>' + words.map(w => `<option value="${w}">${w}</option>`).join("");
      s.value = v[i] || "";
      s.addEventListener("change", () => {
        st[n] = st[n] || { v: {} }; st[n].v[i] = s.value; saveState();
        s.classList.remove("ok", "bad");
      });
      sheet.appendChild(s);
    });
    $("msg").textContent = blanks.length === KEY[n].length ? "" : `注意：这一页找到 ${blanks.length} 个空格，答案有 ${KEY[n].length} 个。`;
    $("score").textContent = "未检查";
  } catch(err) {
    sheet.innerHTML = '<div class="loading">无法加载练习。请确认网络可以连接 cdnjs.cloudflare.com。</div>';
  } finally { busy = false; }
  $("pgSel").value = n;
  $("prev").disabled = n === PAGES[0];
  $("next").disabled = n === PAGES[PAGES.length - 1];
}

function go(n){ cur = n; renderPage(n); }

function check(){
  const sels = [...document.querySelectorAll("#sheet .ov")];
  let right = 0;
  sels.forEach((s, i) => {
    const good = s.value !== "" && s.value.trim().toLowerCase() === KEY[cur][i];
    s.classList.toggle("ok", good); s.classList.toggle("bad", !good);
    if(good) right++;
  });
  $("score").textContent = `答对 ${right} / ${KEY[cur].length}`;
  $("msg").textContent = right === KEY[cur].length ? "🎉 Bagus! 全部答对！" : "再试一次，你可以的！💪";
}
function showAll(){
  const sels = [...document.querySelectorAll("#sheet .ov")];
  st[cur] = { v: {} };
  sels.forEach((s, i) => { s.value = KEY[cur][i]; st[cur].v[i] = KEY[cur][i]; s.classList.remove("bad"); s.classList.add("ok"); });
  saveState();
  $("score").textContent = "已显示答案";
}
function redo(){ delete st[cur]; saveState(); renderPage(cur); }

// ---- PDF viewers ----
function showPdf(f){
  const url = "year1/" + encodeURIComponent(f);
  $("pdf").src = url; $("open").href = url;
}

function select(i){
  const e = EX[i];
  [...list.children].forEach((b, k) => b.setAttribute("aria-pressed", k === i ? "true" : "false"));
  const isAyat = e.kind === "ayat";
  $("ayat").hidden = !isAyat;
  $("pdfPanel").hidden = isAyat;
  $("pdfTools").hidden = isAyat;
  if(isAyat){
    if(!$("pgSel").options.length){
      $("pgSel").innerHTML = PAGES.map(n => `<option value="${n}">Soalan ${n}</option>`).join("");
      $("pgSel").onchange = () => go(+$("pgSel").value);
      $("prev").onclick = () => go(Math.max(PAGES[0], cur - 1));
      $("next").onclick = () => go(Math.min(PAGES[PAGES.length - 1], cur + 1));
      $("check").onclick = check; $("show").onclick = showAll; $("redo").onclick = redo;
    }
    go(cur);
  } else {
    showPdf(e.f);
    $("cur").textContent = "当前：" + e.t;
  }
}

EX.forEach((e, i) => {
  const b = document.createElement("button");
  b.className = "ex"; b.textContent = e.t;
  b.onclick = () => select(i);
  list.appendChild(b);
});
select(0);
</script>
</body>
</html>
