{u:3,unit:"第三单元 探秘之旅",lesson:"（十二）伽利略的落体实验",no:12,instr:"圈出正确的答案。",bank:[],q:["张衡发明的地动仪，是世界上第一台测定地震方向的（仪式，仪器）。","科学家（研究，追究）很多新技术来改善人类的生活。","同学们都不喜欢与子君交谈，因为他总爱问大家一些（聊天，无聊）的问题。","许多人被他那美妙的歌声吸引，（纷杂，纷纷）驻足聆听。","在生活中，不可能事事靠别人指点，要靠自己去独立（判断，判决）。"],a:["仪器","研究","无聊","纷纷","判断"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:1,instr:"填写正确的答案。",bank:["魔术","火患","匕首","口琴","侄儿"],q:["台上精彩的___________表演，吸引了所有观众的目光。","昨晚，路口的那家杂货店发生了___________，幸好无人伤亡。","士兵随身佩带___________，以保护自己的安危。","哥哥觉得烦闷的时候，就会在院子里吹___________解闷。","李叔叔的___________时常到老人院探望他。"],a:["魔术","火患","匕首","口琴","侄儿"]},

{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:3,instr:"填写正确的答案。",bank:["宠物","溪边","捞","铺","驱逐"],q:["弟弟的___________是一只小乌龟。","小时候，我常和舅舅到外婆家的___________捉鱼。","舅舅从小溪里___________了一些水草，准备放在鱼缸里。","昔日的乡间小道现在已___________上柏油。","妈妈像是一盏明亮的灯，___________了我内心的恐惧。"],a:["宠物","溪边","捞","铺","驱逐"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:4,instr:"填写正确的答案。",bank:["火患","勉强","舍弃","羞怯","驱逐"],q:["虽然哥哥生病了，但是他还是___________地坐到桌前读书。","那个小孩___________地把糖果递给我，以答谢我对他的帮忙。","爸爸时刻都在留意家中的电器是否有损坏，以避免引起___________。","那个经常破坏公物的男人被公园管理员___________出公园了。","为了救济地震灾民，他___________了舒适安逸的生活而远赴灾区救灾。"],a:["勉强","羞怯","火患","驱逐","舍弃"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:5,instr:"填写正确的答案。",bank:["匕首","捧","铺","魔术","苦恼"],q:["我一边唱着生日歌，一边把蛋糕从厨房里___________出来给妈妈。","爸爸把草席___________在草地上，再摆上准备好的食物。","传统马来短剑和___________具有收藏价值。","小丑正___________着要表演什么节目，以吸引观众前来观看。","儿童节那天，健彬给大家带来一场精彩的___________表演。"],a:["捧","铺","匕首","苦恼","魔术"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:6,instr:"填写正确的答案。",bank:["溪边","苦恼","口琴","宠物","侄儿"],q:["姐姐表演___________在舞台上。","顽皮的___________时常被父母责骂。","姐姐想参加比赛却胆怯，心里很是___________。","___________是陪伴人类的最好的朋友。","行动管制令导致小孩们无法在___________捉鱼。"],a:["口琴","侄儿","苦恼","宠物","溪边"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:7,instr:"填写正确的答案。",bank:["匕首","魔术师","侄儿","火患","口琴"],q:["春天是个神奇的___________，它变出了五颜六色的花朵，变出了缓缓流淌的小溪，还变出了凉爽的春雨。","人们为了防止___________，禁止所有上山的人携带火种。","他被一个恐怖分子用___________刺伤了。","我生日时，爸爸送了我一把黄色的___________。","每逢周末，我都会陪___________到公园玩耍。"],a:["魔术师","火患","匕首","口琴","侄儿"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:8,instr:"填写正确的答案。",bank:["羞怯","驱逐","捧","勉强","苦恼"],q:["黎明，太阳___________黑暗，把光明重新带给万物。","哥哥失业了三个月才找到了一份___________凑合的工作。","哥哥一直解决不了工作上的难题，为此事他___________了好几天。","太阳总在云层后面躲躲闪闪，___________得像个小姑娘似的。","新娘手___________鲜花，一步步地迈入教堂。"],a:["驱逐","勉强","苦恼","羞怯","捧"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:9,instr:"填写正确的答案。",bank:["捞鱼","宠物","捧","铺上","溪边"],q:["我的___________是一只会学人说话的鹦鹉。","上个星期天，爸爸带我和弟弟到___________捉鱼。","假期里，哥哥带我去___________，捞了半天一条小鱼也没捞着。","冬天里，大地___________了一层厚厚的雪。","哥哥姐姐帮妈妈把厨房里一碟碟的菜肴___________到饭厅的桌上。"],a:["宠物","溪边","捞鱼","铺上","捧"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:10,instr:"填写正确的答案。",bank:["匕首","铺","火患","宠物","懊恼"],q:["小琴把礼物纸___________在地上，才裁剪适合礼物大小的礼物纸。","奶奶养的___________鹦鹉模仿奶奶说话的样子，逗得她呵呵直笑。","他静下心反思后，非常___________刚才对妈妈无理取闹，乱发脾气。","那名用___________表演的魔术师是经过专业训练的，小朋友不可以随意模仿。","___________发生时，消拯员会在第一时间赶到现场。"],a:["铺","宠物","懊恼","匕首","火患"]},

{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:12,instr:"圈出正确的答案。",bank:[],q:["校长在台上（勉强，勉励）同学们要发奋图强，努力向上。","要是你感到不舒服，就不要（勉强，勉励）了，赶紧回家休息。","面对老师严厉的指责，他为自己的过错深感（羞愧，羞怯）。","爱丽站在舞台中央，第一次面对众人的目光，显得（羞愧，羞怯）。","人们为了防止（火患，病患），曲突徒薪，禁止上山携带火种。"],a:["勉励","勉强","羞愧","羞怯","火患"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十三）街头魔术师",no:13,instr:"圈出正确的答案。",bank:[],q:["弟弟生日时收到了一把（琴声，口琴），不久后就吹得像模像样了。","警方把偷渡入境的外国人（驱逐，逐步）出境。","他不喜欢那些食物，但还是（勉强，勉励）地吞咽下去。","我邀请好友一起上台演讲，她却（羞怯，怯场）地拒绝了我。","爸爸妈妈坐在（溪边，溪流）聊天，我和弟弟则在溪里捞鱼。"],a:["口琴","驱逐","勉强","羞怯","溪边"]},

{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:1,instr:"填写正确的答案。",bank:["简陋","飞翔","咽","哭泣","塑料袋"],q:["房子虽然___________，但它是我长大的地方，拥有许多回忆。","无端端被别人冤枉，他实在___________不下这口气。","不少海龟因为误食___________而失去生命。","鸟儿能在高空中___________，多自由啊！","妹妹因为被父亲责骂，所以躲在房间里___________。"],a:["简陋","咽","塑料袋","飞翔","哭泣"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:2,instr:"填写正确的答案。",bank:["隐形","腹内","渊博","尸体","反映"],q:["沿海一带的居民向当局___________海滩污染的情况日益严重。","海滩上突然出现海豚的___________，引起附近居民的关注。","搁浅的海豚___________积满了不能消化的塑料垃圾。","肥胖是现代人的___________杀手，不少疾病是由肥胖而引起的。","李教授是个知识___________的学者，受到学生们尊敬。"],a:["反映","尸体","腹内","隐形","渊博"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:3,instr:"填写正确的答案。",bank:["毒素","一劫","异状","灭亡","细胞"],q:["塑料微粒的___________会令海里生物的生长出现异状。","陈伯伯发现身体出现了___________，赶紧到医院做检查。","___________是构成生物的基本单位。","他因为临时有事而取消行程才逃过了___________。","人类若再不爱护地球，地球上将会有更多生物___________。"],a:["毒素","异状","细胞","一劫","灭亡"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:4,instr:"填写正确的答案。",bank:["祈愿","异状","舍弃","渊博","劫难"],q:["我们___________奶奶能早日康复。","为了照顾年幼的弟弟，妈妈___________了到国外发展的机会。","老鼠察觉到了一丝___________，立即飞奔躲回洞穴里。","江老师的学问___________，不论我问什么问题，她都能一一回答。","人类再不检讨污染环境的行为，到时候连自己也难逃___________。"],a:["祈愿","舍弃","异状","渊博","劫难"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:5,instr:"填写正确的答案。",bank:["塑料袋","哭泣","哽咽","飞翔","简陋"],q:["我用一个小纸盒，给小鸟做了一个___________的窝。","这本书精彩的故事情节，时而让我开怀大笑，时而叫我___________不已。","为了响应环保，妈妈随身带着环保袋出门，减少使用___________。","鸟儿自由自在地在空中___________。","妹妹的洋娃娃不见了，伤心得躲在房间里不停地___________。"],a:["简陋","哽咽","塑料袋","飞翔","哭泣"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:6,instr:"填写正确的答案。",bank:["反映","隐形","尸体","渊博","腹内"],q:["帖子上的评论___________了部分群众的想法。","由于水源污染，小河上漂浮着无数鱼儿的___________。","母鳝鱼一直弓起中间的身子，保护___________的鱼卵。","姐姐戴上___________眼镜后自信了许多。","我要努力学习，多读书，做个学识___________的人。"],a:["反映","尸体","腹内","隐形","渊博"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:7,instr:"填写正确的答案。",bank:["细胞","灭亡","毒素","难逃一劫","异状"],q:["马铃薯的芽眼发芽后产生了___________，所以不能食用。","妹妹吃了布丁后就开始上吐下泻，妈妈察觉到她的___________后，立刻就带她去医院就医。","我很爱唱歌，可因为没有音乐___________，所以唱出的歌就像乌鸦在叫。","如果世界末日降临，所有生物都___________。","地震、干旱、海啸频发，整个地球都在颤抖，人类随时处在___________边缘。"],a:["毒素","异状","细胞","难逃一劫","灭亡"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:8,instr:"填写正确的答案。",bank:["灭亡","祈愿","简陋","舍弃","渊博"],q:["我___________我的家人健康平安，笑口常开。","在灾难面前，人们___________了所有行李，第一时间往紧急出口逃去。","虽然那间餐厅看起来很___________，不过食物却相当可口。","爸爸的学识___________，无论我提出任何问题，他都能够解答。","由于人类胡乱开发森林，导致许多动物都快___________，消失在这个地球上。"],a:["祈愿","舍弃","简陋","渊博","灭亡"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:9,instr:"填写正确的答案。",bank:["简陋","反映","灭亡","祈愿","渊博"],q:["我们向老师___________书包很重的问题后，老师便允许我们把书放在学校的书橱里。","每逢新年，爸爸都会到庙里___________一家大小平安健康。","小时候，我们家境贫穷，全家住在一间___________的房子。","古时候，一个朝代的___________，就表示另一个朝代的开始。","陈老师不仅学识___________，还富有爱心，深受学生的爱戴。"],a:["反映","祈愿","简陋","灭亡","渊博"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:10,instr:"填写正确的答案。",bank:["飞翔","毒素","哽咽","简陋","异状"],q:["这间___________的小屋许久没人打理，屋内铺满了灰尘。","这些植物含有___________，千万别在没戴手套的情况下触碰它们。","一想起刚逝世的爷爷，姐姐便___________起来，伤心得说不出话了。","几只鸟儿在空中自由自在地___________，一会儿飞向东，一会儿飞向西。","法医把死者进行了剖解，并没有任何___________。"],a:["简陋","毒素","哽咽","飞翔","异状"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:11,instr:"圈出正确的答案。",bank:[],q:["这间实验室破旧（简陋，丑陋），应该要好好整修一番。","尽管淑敏外表长得（简陋，丑陋），但是她内心善良，乐于助人。","震耳欲聋的欢呼声回荡在（简陋，丑陋）的家中，仿佛一声春雷。","春天来了，各种各样的鸟儿斜着翅膀自由自在地（飞翔，回翔）在天空。","主管决定把工厂环境恶劣一事向最高层（倒映，反映）。"],a:["简陋","丑陋","简陋","飞翔","反映"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:12,instr:"圈出正确的答案。",bank:[],q:["河上漂浮着鱼儿的（尸体，僵尸），小河上几乎都是又臭又脏的垃圾。","动物家发现许多海鸟的尸体（腹内，腹泻）都含有许多不能消化的塑料垃圾。","糖尿病已成为人类健康的最大（隐情，隐形）杀手。","我要博览群书，做个学识（博士，渊博）的人。","某些野生植物含有致命（素色，毒素），不可随意采食。"],a:["尸体","腹内","隐形","渊博","毒素"]},
{u:3,unit:"第三单元 探秘之旅",lesson:"（十四）最美丽的风景",no:13,instr:"填写正确的答案。",bank:["灭亡","哭泣","祈愿","单细胞","舍弃"],q:["衣沙虫是一种___________的有壳变形虫，属于原生物界的肉足虫类。","恐龙在第四纪时代就___________了。","我___________地球各处风调雨顺，五谷丰收，百业繁荣。","哥哥___________舒适的生活，要到非洲去当义工。","我们要珍惜每一滴水，让地球妈妈不再___________。"],a:["单细胞","灭亡","祈愿","舍弃","哭泣"]},

{u:3,unit:"第三单元 探秘之旅",lesson:"（十五）人工智能汽车",no:8,instr:"填写正确的答案。",bank:["威胁","敬畏","措施","正式","阶段"],q:["我们一定要做好各项安全___________，以避免事故发生。","黄老师是我在小学___________最敬佩的一位老师。","近几十年来，地球环境遭受极大的破坏，严重___________到我们的生存。","全副武装的战士们看起来威风极了，令人感到无限___________。","一年一度的运动会将在早上9点___________开始。"],a:["措施","阶段","威胁","敬畏","正式"]},

/* DATA: [{u, unit, lesson, no, instr, bank:[], items:[{n,text}], ans:[]}] */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLANK=/[_＿]{2,}/;
const CHOICE=/（\s*([^（）]+?)\s*）/;
let total=0,right=0,checked=0;
const state={}; // key -> {picked:[], done:bool}

function parts(e,it){
  // returns {before, after, opts, kind} where kind: 'blank' | 'choice' | 'none'
  const t=it.text;
  let m=t.match(BLANK);
  if(m){return {kind:'blank',before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts:e.bank||[]};}
  m=t.match(CHOICE);
  if(m){const opts=m[1].split(/[、，,]/).map(x=>x.trim()).filter(Boolean);if(opts.length>=2)return {kind:'choice',before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts};}
  return {kind:'none',before:t,after:'',opts:[]};
}
function exHTML(e,ei){
  const key=ei;
  const st=state[key]||(state[key]={picked:{},done:false});
  const hasAns=Array.isArray(e.ans)&&e.ans.length>0&&e.ans.some(x=>x);
  let h=`<section class="card" id="ex${ei}"><div class="qh"><div class="qn">练习（${numCN(e.no)}）</div><div class="instr">${esc(e.instr||'')}</div></div>`;
  if(e.bank&&e.bank.length)h+=`<div class="bank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`;
  e.items.forEach((it,k)=>{
    const p=parts(e,it);
    const pk=st.picked[k]||'';
    const cls=st.done&&hasAns?((pk===e.ans[k])?'ok':'bad'):'';
    let sel=`<select data-ex="${ei}" data-k="${k}" class="${cls}" aria-label="第${it.n}题"><option value="">＿＿</option>${p.opts.map(o=>`<option value="${esc(o)}"${pk===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    let body=p.kind==='none'?esc(p.before):esc(p.before)+sel+esc(p.after);
    const numTag=`<b>${it.n}.</b> `;
    const ansTxt=st.done&&hasAns&&pk!==e.ans[k]&&e.ans[k]?`<div class="ansline">答案：${esc(e.ans[k])}</div>`:'';
    h+=`<div class="line">${numTag}${body}${ansTxt}</div>`;
  });
  h+=`<div class="row">`;
  if(hasAns)h+=`<button class="btn" data-act="check" data-ex="${ei}">✔ 检查</button><button class="btn alt sm" disabled data-act="show" data-ex="${ei}">👀 看答案</button>`;
  else h+=`<span class="none">暂无答案（资料里没有这一练习的答案）</span>`;
  h+=`</div>`;
  if(st.done&&hasAns){const ok=e.items.filter((_,k)=>st.picked[k]===e.ans[k]).length;h+=`<div class="muted">本练习：${ok} / ${e.items.length} 对</div>`;}
  return h+`</section>`;
}
const CN=['零','一','二','三','四','五','六','七','八','九','十'];
function numCN(n){if(n<=10)return CN[n];if(n<20)return '十'+(n%10?CN[n%10]:'');if(n<100){const a=Math.floor(n/10),b=n%10;return CN[a]+'十'+(b?CN[b]:'');}return '一百';}
function render(){
  const view=document.getElementById('view');
  let h='',lastU=null,lastL=null;
  DATA.forEach((e,ei)=>{
    if(e.unit!==lastU){h+=`<h2 class="unit">第 ${e.u} 单元　${esc(e.unit||'')}</h2>`;lastU=e.unit;lastL=null;}
    if(e.lesson&&e.lesson!==lastL){h+=`<div class="lesson">${esc(e.lesson)}</div>`;lastL=e.lesson;}
    h+=exHTML(e,ei);
  });
  view.innerHTML=h;
  score();
}
function score(){
  let c=0,r=0,t=0;
  DATA.forEach((e,ei)=>{const st=state[ei];if(!st||!st.done)return;const hasAns=e.ans&&e.ans.some(x=>x);if(!hasAns)return;
    e.items.forEach((_,k)=>{c++;if(st.picked[k]===e.ans[k])r++;});});
  DATA.forEach(e=>{if(e.ans&&e.ans.some(x=>x))t+=e.items.length;});
  document.getElementById('score').textContent=`✅ ${r} / ${t}　已检查 ${c}`;
}
document.addEventListener('change',ev=>{
  const s=ev.target;if(s.tagName!=='SELECT'||s.dataset.ex===undefined)return;
  const ei=+s.dataset.ex,k=+s.dataset.k;const st=state[ei]||(state[ei]={picked:{},done:false});
  st.picked[k]=s.value;
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const ei=+b.dataset.ex,e=DATA[ei];const st=state[ei]||(state[ei]={picked:{},done:false});
  // capture current selects first
  document.querySelectorAll(`select[data-ex="${ei}"]`).forEach(s=>{st.picked[+s.dataset.k]=s.value;});
  if(b.dataset.act==='check'){
    const miss=e.items.filter((_,k)=>!st.picked[k]).length;
    if(miss>0){alert('还有 '+miss+' 格没有选哦！');return;}
    st.done=true;
  }
  if(b.dataset.act==='show'){
    e.ans.forEach((a,k)=>{st.picked[k]=a;});st.done=true;
  }
  const y=window.scrollY;
  const saved=document.getElementById('ex'+ei);
  render();window.scrollTo(0,y);
});
document.getElementById('jump').addEventListener('change',ev=>{
  const u=+ev.target.value;if(!u)return;
  const idx=[...new Set(DATA.map(e=>e.u))].indexOf(u);
  const tgt=document.querySelectorAll('#view h2.unit')[idx];
  if(tgt)tgt.scrollIntoView({block:'start'});
  ev.target.value='';

(function(){const j=document.getElementById('jump');const seen=new Set();
  j.innerHTML='<option value="">跳到单元…</option>';
  DATA.forEach(e=>{if(seen.has(e.u))return;seen.add(e.u);const o=document.createElement('option');o.value=e.u;o.textContent='第 '+e.u+' 单元';j.appendChild(o);});})();
render();
</script>
<script>
(function(){
  const BOOK='4B';
  const units=[...new Set(DATA.map(e=>e.u))];
  const FIRST=units[0];
  const ukey=u=>'fill-'+BOOK+'-u'+String(u).padStart(2,'0');
  const isDone=u=>{try{return localStorage.getItem(ukey(u))==='1';}catch(e){return false;}};
  const setDone=u=>{try{localStorage.setItem(ukey(u),'1');}catch(e){}};
  const prevOf=u=>units[units.indexOf(u)-1];
  const unlocked=u=>u===FIRST||isDone(prevOf(u));
  function exPassed(ei){
    const e=DATA[ei];
    if(!e.ans||!e.ans.some(x=>x)) return true;
    const st=state[ei];
    return !!(st&&st.done&&!st.revealed&&e.items.every((_,k)=>st.picked[k]===e.ans[k]));
  }
  function unitComplete(u){ return DATA.every((e,ei)=>e.u!==u||exPassed(ei)); }
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('[disabled data-act="show"]');if(!b)return;
    const i=+b.dataset.ex;state[i]=state[i]||{picked:{},done:false};state[i].revealed=true;
  },true);
  function hashUnit(){
    const m=location.hash.match(/^#u(\d+)$/);
    const u=m?+m[1]:null;
    return (u!==null&&units.includes(u)&&unlocked(u))?u:null;
  }
  let CUR=hashUnit()||units.find(u=>!isDone(u)&&unlocked(u))||FIRST;
  function buildUnits(){
    const box=document.getElementById('units');if(!box)return;
    box.innerHTML='';
    units.forEach(u=>{
      const ok=unlocked(u);
      const b=document.createElement('button');
      b.className=(u===CUR?'btn':'btn alt')+' sm';
      b.setAttribute('aria-pressed',String(u===CUR));
      b.textContent=!ok?'🔒 第 '+u+' 单元':(isDone(u)?'✅ 第 '+u+' 单元':'第 '+u+' 单元');
      if(!ok){b.disabled=true;b.style.opacity='.5';}
      b.addEventListener('click',()=>{location.hash='u'+u;});
      box.appendChild(b);
    });
  }
  function lockedCard(e,ei){
    return '<section class="card" id="ex'+ei+'"><div class="qh"><div class="qn">🔒 练习（'+numCN(e.no)+'）未开放</div></div><div class="instr">请先做完上一个练习，全部答对后才能做这一题。</div></section>';
  }
  render=function(){
    const ex=DATA.map((e,ei)=>({e,ei})).filter(x=>x.e.u===CUR);
    let h='<h2 class="unit">第 '+CUR+' 单元　'+esc(ex[0]?ex[0].e.unit||'':'')+'</h2>';
    let lastL=null;
    ex.forEach(({e,ei},k)=>{
      if(e.lesson&&e.lesson!==lastL){h+='<div class="lesson">'+esc(e.lesson)+'</div>';lastL=e.lesson;}
      h+=(k>0&&!exPassed(ex[k-1].ei))?lockedCard(e,ei):exHTML(e,ei);
    });
    document.getElementById('view').innerHTML=h;
    score();
    buildUnits();
  };
  const origScore=score;
  score=function(){
    origScore();
    if(!isDone(CUR)&&unitComplete(CUR)){ setDone(CUR); buildUnits(); }
    if(isDone(CUR)){
      const el=document.getElementById('score');
      if(el&&!el.textContent.includes('已完成')) el.textContent+='　🎉 本单元已完成';
    }
  };
  window.addEventListener('hashchange',()=>{const u=hashUnit();if(u!==null){CUR=u;render();}});
  const j=document.getElementById('jump');if(j)j.style.display='none';
  render();
})();
</script>
</body>
</html>
